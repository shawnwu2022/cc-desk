[package]
name = "cc-desk-android-native"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
url = "=2.5.8"
zeroize = "=1.9.1"
base64 = "=0.22.1"
cc-desk-remote-record = { path = "../../protocol/remote/inner/v1" }
cc-desk-remote-security = { path = "../../remote/crates/security", features = ["experimental"] }
ring = "=0.17.14"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.150"
cc-desk-remote-client = { path = "../../remote/crates/client" }
cc-desk-remote-transport = { path = "../../remote/crates/transport" }
tokio = { version = "=1.52.1", features = ["rt", "sync", "time", "macros"] }

[dev-dependencies]
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "=0.21.1", default-features = false }
coset = "=0.4.2"
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std"] }
