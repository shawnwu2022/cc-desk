name: Native CLI acceptance gate

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Signed candidate workflow run ID
        required: true
        type: string
      evidence_run_id:
        description: Authorized target evidence workflow run ID
        required: true
        type: string
      evidence_artifact:
        description: Artifact containing target-plan.json, records/, and evidence/
        required: true
        default: native-cli-acceptance-evidence
        type: string

permissions:
  contents: read
  actions: read

jobs:
  verify:
    name: Verify candidate-bound acceptance evidence
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download candidate manifest
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_run_id }}
          name: cc-desk-candidate-manifest
          path: ${{ runner.temp }}/cc-desk-candidate-manifest

      - name: Read frozen candidate source
        id: candidate
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs')
          const value = JSON.parse(fs.readFileSync('${{ runner.temp }}/cc-desk-candidate-manifest/candidate-manifest.json', 'utf8'))
          if (!/^[0-9a-f]{40,64}$/.test(String(value.sourceSha ?? ''))) {
            throw new Error('CANDIDATE_SOURCE_SHA_INVALID')
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `source_sha=${value.sourceSha}\n`)
          NODE

      - name: Verify gate run is bound to candidate source
        env:
          SOURCE_SHA: ${{ steps.candidate.outputs.source_sha }}
        shell: bash
        run: |
          test "$GITHUB_SHA" = "$SOURCE_SHA" || {
            echo "::error::Gate workflow must be dispatched from the exact candidate source SHA"
            exit 1
          }
          candidate_run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/${{ inputs.candidate_run_id }}")"
          evidence_run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/${{ inputs.evidence_run_id }}")"
          test "$(jq -r .conclusion <<<"$candidate_run")" = "success"
          test "$(jq -r .head_sha <<<"$candidate_run")" = "$SOURCE_SHA"
          test "$(jq -r .path <<<"$candidate_run")" = ".github/workflows/release.yml"
          test "$(jq -r .conclusion <<<"$evidence_run")" = "success"
          test "$(jq -r .head_sha <<<"$evidence_run")" = "$SOURCE_SHA"

      - name: Checkout exact candidate source
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.candidate.outputs.source_sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Download exact candidate packages
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_run_id }}
          pattern: cc-desk-candidate-${{ steps.candidate.outputs.source_sha }}-*
          path: gate/candidate
          merge-multiple: false

      - name: Download authorized target evidence
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.evidence_run_id }}
          name: ${{ inputs.evidence_artifact }}
          path: gate/acceptance

      - name: Verify exact candidate and all required evidence
        shell: bash
        run: |
          test -f "${{ runner.temp }}/cc-desk-candidate-manifest/candidate-manifest.json"
          test -f docs/testing/native-cli-acceptance-catalog.json
          test -f gate/acceptance/target-plan.json
          test -d gate/acceptance/records
          test -d gate/acceptance/evidence
          node scripts/native-cli/verify-acceptance.mjs \
            "${{ runner.temp }}/cc-desk-candidate-manifest/candidate-manifest.json" \
            gate/candidate \
            docs/testing/native-cli-acceptance-catalog.json \
            gate/acceptance/target-plan.json \
            gate/acceptance/records \
            gate/acceptance/evidence \
            > gate/acceptance-result.json

      - name: Upload machine gate result
        uses: actions/upload-artifact@v4
        with:
          name: native-cli-acceptance-result-${{ github.run_id }}
          path: gate/acceptance-result.json
          if-no-files-found: error
          retention-days: 90
