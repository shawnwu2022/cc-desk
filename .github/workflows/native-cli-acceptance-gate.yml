      - name: Record boundary
        if: always()
        shell: bash
        run: |
          echo "This job verifies a candidate manifest plus evidence emitted by the protected installed-evidence ingest workflow." >> "$GITHUB_STEP_SUMMARY"
          echo "It does not create missing C/D evidence and cannot turn BLOCKED/NOT_RUN into PASS." >> "$GITHUB_STEP_SUMMARY"
