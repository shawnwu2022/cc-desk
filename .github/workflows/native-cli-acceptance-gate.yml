name: Native CLI acceptance gate

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful Signed candidate packages run ID
        required: true
        type: string
      candidate_sha:
        description: Exact 40-hex source commit used for the candidate
        required: true
        type: string
      evidence_run_id:
        description: Successful Ingest installed native evidence run ID
        required: true
        type: string
      bundle_id:
        description: Evidence bundle ID used by the ingest workflow
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: native-acceptance-${{ inputs.candidate_sha }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify installed-package acceptance
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Validate immutable inputs
        shell: bash
        run: |
          if ! printf '%s' "${{ inputs.candidate_sha }}" | grep -Eq '^[0-9a-f]{40}          for id in "${{ inputs.candidate_run_id }}" "${{ inputs.evidence_run_id }}"; do
            if ! printf '%s' "$id" | grep -Eq '^[1-9][0-9]*$'; then
              echo "::error::run IDs must be positive integers"
              exit 1
            fi
          done
          if ! printf '%s' "${{ inputs.bundle_id }}" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'; then
            echo "::error::bundle_id is invalid"
            exit 1
          fi

      - name: Checkout exact candidate source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Read source workflow-run metadata
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            fs.mkdirSync('.acceptance', { recursive: true })
            for (const [name, id] of [
              ['candidate', Number('${{ inputs.candidate_run_id }}')],
              ['evidence', Number('${{ inputs.evidence_run_id }}')],
            ]) {
              const response = await github.rest.actions.getWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: id,
              })
              fs.writeFileSync(`.acceptance/${name}-run.json`, JSON.stringify(response.data))
            }

      - name: Verify candidate and evidence run provenance
        shell: bash
        run: |
          node scripts/native-cli/verify-workflow-run.mjs --run-json .acceptance/candidate-run.json --workflow-path .github/workflows/release.yml --head-sha "${{ inputs.candidate_sha }}" --event workflow_dispatch --event push
          node scripts/native-cli/verify-workflow-run.mjs --run-json .acceptance/evidence-run.json --workflow-path .github/workflows/native-cli-installed-evidence.yml --head-sha "${{ inputs.candidate_sha }}" --event workflow_dispatch

      - name: Download candidate manifest from the candidate build
        uses: actions/download-artifact@v4
        with:
          name: cc-desk-candidate-${{ inputs.candidate_sha }}-manifest
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          path: .acceptance/candidate

      - name: Download provenance-bound installed evidence bundle
        uses: actions/download-artifact@v4
        with:
          name: native-installed-evidence-${{ inputs.candidate_sha }}-${{ inputs.bundle_id }}
          run-id: ${{ inputs.evidence_run_id }}
          github-token: ${{ github.token }}
          path: .acceptance/bundle

      - name: Verify complete target and subcase evidence
        shell: bash
        run: |
          node scripts/native-cli/verify-acceptance-command.mjs --catalog docs/testing/native-cli-acceptance-catalog.json --candidate .acceptance/candidate/candidate.json --plan .acceptance/bundle/plan.json --records .acceptance/bundle/records.json --evidence-root .acceptance/bundle/evidence --out .acceptance/acceptance-summary.json

      - name: Upload machine-verifiable acceptance summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-acceptance-summary-${{ inputs.candidate_sha }}-${{ inputs.bundle_id }}
          path: .acceptance/acceptance-summary.json
          retention-days: 30
          if-no-files-found: warn

      - name: Record boundary
        if: always()
        shell: bash
        run: |
          echo "This job verifies a candidate manifest plus evidence emitted by the protected installed-evidence ingest workflow." >> "$GITHUB_STEP_SUMMARY"
          echo "It does not create missing C/D evidence and cannot turn BLOCKED/NOT_RUN into PASS." >> "$GITHUB_STEP_SUMMARY"
; then
            echo "::error::candidate_sha must be an exact commit SHA"
            exit 1
          fi
          if [ "${{ github.sha }}" != "${{ inputs.candidate_sha }}" ]; then
            echo "::error::Dispatch this workflow from the exact candidate ref"
            exit 1
          fi
          for id in "${{ inputs.candidate_run_id }}" "${{ inputs.evidence_run_id }}"; do
            if ! printf '%s' "$id" | grep -Eq '^[1-9][0-9]*$'; then
              echo "::error::run IDs must be positive integers"
              exit 1
            fi
          done
          if ! printf '%s' "${{ inputs.bundle_id }}" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'; then
            echo "::error::bundle_id is invalid"
            exit 1
          fi

      - name: Checkout exact candidate source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Read source workflow-run metadata
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            fs.mkdirSync('.acceptance', { recursive: true })
            for (const [name, id] of [
              ['candidate', Number('${{ inputs.candidate_run_id }}')],
              ['evidence', Number('${{ inputs.evidence_run_id }}')],
            ]) {
              const response = await github.rest.actions.getWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: id,
              })
              fs.writeFileSync(`.acceptance/${name}-run.json`, JSON.stringify(response.data))
            }

      - name: Verify candidate and evidence run provenance
        shell: bash
        run: |
          node scripts/native-cli/verify-workflow-run.mjs --run-json .acceptance/candidate-run.json --workflow-path .github/workflows/release.yml --head-sha "${{ inputs.candidate_sha }}" --event workflow_dispatch --event push
          node scripts/native-cli/verify-workflow-run.mjs --run-json .acceptance/evidence-run.json --workflow-path .github/workflows/native-cli-installed-evidence.yml --head-sha "${{ inputs.candidate_sha }}" --event workflow_dispatch

      - name: Download candidate manifest from the candidate build
        uses: actions/download-artifact@v4
        with:
          name: cc-desk-candidate-${{ inputs.candidate_sha }}-manifest
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          path: .acceptance/candidate

      - name: Download provenance-bound installed evidence bundle
