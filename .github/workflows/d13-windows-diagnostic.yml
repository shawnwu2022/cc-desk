name: D13 Windows reporter diagnostic
on:
  push:
    branches: [feat/native-cli-source-scope]
    paths: [.github/workflows/d13-windows-diagnostic.yml]
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Inspect native Bash dependencies and synthetic header pipe
        shell: pwsh
        run: |
          $script = @'
          command -v curl head od tr
          curl -q --version
          printf 'random bytes: '
          od -An -N16 -tx1 /dev/urandom | tr -d ' \n'
          echo
          printf '{}\n' | curl -q -sS --max-time 2 --noproxy '*' -H @<(printf 'X-D13-Probe: synthetic\n') --data-binary @- http://127.0.0.1:1
          echo CURL_STATUS=$?
          '@
          $path = Join-Path $env:RUNNER_TEMP 'd13-diagnostic.sh'
          [IO.File]::WriteAllText($path, $script.Replace("`r`n", "`n"), [Text.UTF8Encoding]::new($false))
          & "$env:ProgramFiles/Git/bin/bash.exe" ($path.Replace('\','/'))
          python -c "from pathlib import Path; b=Path('src-tauri/plugin/scripts/report-hook.sh').read_bytes(); print('script_crlf=', b.count(bytes([13,10])))"
