name: D12 projection dependencies
on:
  push:
    branches: [feat/native-cli-source-scope]
    paths: [.github/workflows/d12-core-vendor.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src-tauri/Cargo.toml')
          s=p.read_text(); assert '\ncap-std' not in s
          p.write_text(s.replace('[dependencies]\n','[dependencies]\ncap-std = "=4.0.3"\nlibc = "=0.2.186"\ntoml = "=0.9.12"\n'))
          PY
          mkdir -p /tmp/d12-dependencies
          cd src-tauri
          cargo fetch
          cargo vendor --locked /tmp/d12-dependencies/vendor > /tmp/d12-dependencies/vendor-config.toml
          cp Cargo.toml Cargo.lock /tmp/d12-dependencies/
          cd /tmp/d12-dependencies
          tar -czf vendor.tar.gz vendor
          rm -rf vendor
          sha256sum vendor.tar.gz Cargo.toml Cargo.lock > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: d12-projection-dependencies
          path: /tmp/d12-dependencies
          retention-days: 2
          if-no-files-found: error
