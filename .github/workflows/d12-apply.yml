name: D12 fixture correction materialization
on:
  push:
    branches: [feat/native-cli-source-scope]
    paths: [.github/workflows/d12-apply.yml]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply two exact test-only corrections
        run: |
          python3 - <<'PYTHON'
          import os,subprocess
          from pathlib import Path
          assert os.environ['GITHUB_REPOSITORY']=='shawnwu2022/cc-desk'
          assert os.environ['GITHUB_REF']=='refs/heads/feat/native-cli-source-scope'
          corrections=[
              ('src-tauri/src/tests/session_name_index.rs','0d3d0147d995590a83071801e84399cd0ab0aa40',
               'fn Resolver_Dirs_PruneComplete_023() {\n    let dir = tempfile::tempdir().unwrap();\n    let project_dir = dir.path().join("-e-source-project");\n',
               'fn Resolver_Dirs_PruneComplete_023() {\n    let dir = tempfile::tempdir().unwrap();\n    let project_dir = dir.path().join("-e-source-project");\n    std::fs::create_dir_all(&project_dir).unwrap();\n'),
              ('src-tauri/src/tests/store.rs','02eebc2ea0a3e2bd18f2fdd746a4f90f3ae3e80e',
               '                let project_key =\n                    crate::session_name_index::legacy_project_index_key(project_dir.as_ref())\n                        .unwrap();',
               '                let project_key =\n                    crate::session_name_index::legacy_project_index_key(project_dir).unwrap();')]
          for name,sha,before,after in corrections:
              assert subprocess.check_output(['git','hash-object',name]).decode().strip()==sha
              p=Path(name); text=p.read_text(); assert text.count(before)==1
              p.write_text(text.replace(before,after))
          Path('.github/workflows/d12-apply.yml').unlink()
          PYTHON
          cd src-tauri
          cargo fmt
          cargo fmt --check
          git diff --check
      - name: Create verified Git objects without moving a branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYTHON'
          import os,json,subprocess,urllib.request
          from pathlib import Path
          def git(*args):
              return subprocess.check_output(['git',*args]).decode().strip()
          parent=git('rev-parse','HEAD'); assert parent==os.environ['GITHUB_SHA']
          base='https://api.github.com/repos/shawnwu2022/cc-desk'
          def api(route,data=None):
              request=urllib.request.Request(base+route,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},data=None if data is None else json.dumps(data).encode(),method='GET' if data is None else 'POST')
              with urllib.request.urlopen(request,timeout=60) as response:
                  return json.load(response)
          assert api('/git/ref/heads/feat/native-cli-source-scope')['object']['sha']==parent
          assert api('/git/commits/'+parent)['parents'][0]['sha']=='caabb8d233b264b5e8904f33148659ca4b54b2b8'
          subprocess.run(['git','add','-A'],check=True)
          paths=list(filter(None,subprocess.check_output(['git','diff','--cached','--name-only','-z']).decode().split('\0')))
          assert set(paths)=={'src-tauri/src/tests/session_name_index.rs','src-tauri/src/tests/store.rs','.github/workflows/d12-apply.yml'}
          entries=[]
          for p in paths:
              if not Path(p).exists():
                  entries.append({'path':p,'mode':'100644','type':'blob','sha':None}); continue
              blob=api('/git/blobs',{'content':Path(p).read_text(),'encoding':'utf-8'})['sha']
              assert blob==git('hash-object',p)
              entries.append({'path':p,'mode':'100644','type':'blob','sha':blob})
          tree=api('/git/trees',{'base_tree':git('rev-parse','HEAD^{tree}'),'tree':entries})['sha']
          assert tree==git('write-tree')
          author={'name':'CC Desk development','email':'41898282+github-actions[bot]@users.noreply.github.com'}
          commit=api('/git/commits',{'message':'test(d12): create physical pruning fixture and remove redundant coercion','tree':tree,'parents':[parent],'author':author,'committer':author})['sha']
          out=Path('/tmp/d12-result');out.mkdir()
          (out/'commit.json').write_text(json.dumps({'parent':parent,'commit':commit,'tree':tree},indent=2))
          subprocess.run(['git','archive','--format=tar',tree,'-o',str(out/'source.tar')],check=True)
          print('D12_CORRECTED_COMMIT='+commit)
          print('D12_CORRECTED_TREE='+tree)
          PYTHON
      - uses: actions/upload-artifact@v4
        with:
          name: d12-corrected-source
          path: /tmp/d12-result
          retention-days: 2
          if-no-files-found: error
