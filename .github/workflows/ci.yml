name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run frontend tests
        run: npm run test:ci

      - name: Run Node policy tests
        run: node --test tests/scripts/nativeReleasePolicy.node.mjs

      - name: Build frontend
        run: npm run build

  rust:
    name: Rust checks
    runs-on: windows-2022
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js for pinned runtime preparation
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Prepare verified Windows runtime before direct cargo commands
        working-directory: .
        run: node scripts/prepare-conpty.mjs

      - name: Run Rust tests
        run: cargo test --locked

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
