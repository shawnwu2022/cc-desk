name: Source bootstrap artifact

on:
  push:
    branches:
      - feat/unified-workspace-ux
    paths:
      - .github/workflows/source-bootstrap.yml

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Archive exact tracked source
        run: git archive --format=tar.gz --output=cc-desk-source.tar.gz HEAD
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: cc-desk-source-${{ github.sha }}
          path: cc-desk-source.tar.gz
          retention-days: 1
          if-no-files-found: error
