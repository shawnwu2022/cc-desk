name: D12 retained directory core
on:
  pull_request:
    paths:
      - 'src-tauri/src/cli/**'
      - 'src-tauri/src/session_name_index.rs'
      - 'src-tauri/src/session_index_maintenance.rs'
      - 'src-tauri/src/store.rs'
      - 'src-tauri/src/platform/legacy.rs'
      - 'src-tauri/src/version_history/windows.rs'
      - 'src-tauri/src/version_history/windows/files.rs'
      - 'src-tauri/src/version_history/windows/security.rs'
      - 'scripts/session-sdk-bridge.mjs'
      - 'scripts/prepare-session-sdk.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'src-tauri/src/tests/native_cli_projection_*.rs'
      - 'src-tauri/src/tests/native_cli_scoped_fs.rs'
      - 'tests/native-cli/scope-core/**'
      - '.github/workflows/d12-scope-core.yml'
permissions:
  contents: read
concurrency:
  group: d12-scope-core-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Prepare pinned official session metadata helper
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run prepare:session-sdk
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tests/native-cli/scope-core
          shared-key: scope-core
          cache-workspace-crates: false
          cache-on-failure: true
      - name: Test actual production reader modules with locked dependencies
        run: cargo test --locked --manifest-path tests/native-cli/scope-core/Cargo.toml
      - name: Lint actual production reader modules
        run: cargo clippy --locked --manifest-path tests/native-cli/scope-core/Cargo.toml --all-targets -- -D warnings
