name: D12 retained directory core
on:
  pull_request:
    paths:
      - 'src-tauri/src/cli/**'
      - 'src-tauri/src/tests/native_cli_projection_*.rs'
      - 'src-tauri/src/tests/native_cli_scoped_fs.rs'
      - 'tests/native-cli/scope-core/**'
      - '.github/workflows/d12-scope-core.yml'
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Test actual production reader modules with locked dependencies
        run: cargo test --locked --manifest-path tests/native-cli/scope-core/Cargo.toml
      - name: Lint actual production reader modules
        run: cargo clippy --locked --manifest-path tests/native-cli/scope-core/Cargo.toml --all-targets -- -D warnings
