name: Windows test package and bundled ConPTY integration
on:
  push:
    branches: [codex/fix-devtools-text-paste]
    paths:
      - src-tauri/src/main.rs
      - src-tauri/src/conpty_runtime.rs
      - src-tauri/src/tests/conpty_runtime.rs
      - src-tauri/build.rs
      - src-tauri/conpty/**
      - src-tauri/tauri.windows.conf.json
      - scripts/*conpty*
      - tests/scripts/conptyBundle.node.cjs
      - .github/workflows/conpty-integration.yml
  pull_request:
    paths:
      # Unified UX changes need the final installed Windows package gate too.
      - src/**
      - src-tauri/src/commands.rs
      - src-tauri/src/lib.rs
      - src-tauri/src/store.rs
      - src-tauri/src/tests/store.rs
      - src-tauri/tauri.conf.json
      - package.json
      - package-lock.json
      - build/**
      - vite.config.ts
      - tsconfig*.json
      - tests/components/**
      - tests/stores/**
      - tests/native-cli/**
      - tests/config/**
      - src-tauri/src/main.rs
      - src-tauri/src/conpty_runtime.rs
      - src-tauri/conpty/**
      - src-tauri/tauri.windows.conf.json
      - scripts/*conpty*
      - .github/workflows/conpty-integration.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bundled-conpty-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  formatting:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Verify formatting and retain any diff
        working-directory: src-tauri
        run: |
          cargo fmt --all
          git diff --output=../conpty-format.patch
          git diff --exit-code
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conpty-format-diff
          path: conpty-format.patch
          retention-days: 3

  installer:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CARGO_PROFILE_RELEASE_LTO: 'false'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Capture npm advisory report without mutating dependencies
        shell: bash
        run: |
          npm audit --json > npm-audit.json || true
          node - <<'NODE'
          const fs = require('node:fs')
          try {
            const report = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'))
            console.log('NPM_AUDIT ' + JSON.stringify(report.metadata?.vulnerabilities ?? { unavailable: true }))
          } catch {
            console.log('NPM_AUDIT unavailable')
          }
          NODE

      - name: Prepare verified bundled Windows runtime
        run: node scripts/prepare-conpty.mjs

      - name: Verify bundled runtime generator contracts
        run: node --test tests/scripts/conptyBundle.node.cjs

      - name: Type check frontend
        run: npm run typecheck

      - name: Run frontend and adversarial tests
        run: npm test

      - name: Verify release remains fail-closed
        run: node --test tests/scripts/nativeReleasePolicy.node.mjs

      - name: Windows runtime guard tests
        working-directory: src-tauri
        run: cargo test --locked --bin cc-desk ConptyRuntime_ -- --nocapture

      - name: Strict Rust lint
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Build ordinary Windows installer (test-only, no updater publication)
        shell: pwsh
        run: |
          npm run tauri -- build --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":false}}'
          exit $LASTEXITCODE

      - name: Install, reinstall, relocate and test fail-closed startup
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe)
          if ($installers.Count -ne 1) { throw 'Expected one NSIS installer' }
          ./scripts/test-conpty-install.ps1 -Installer $installers[0].FullName

      - name: Stage immutable test package and manifest
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe)
          if ($installers.Count -ne 1) { throw 'Expected one NSIS installer' }
          $stage = New-Item -ItemType Directory -Force -Path test-package
          $shortSha = '${{ github.sha }}'.Substring(0, 12)
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $name = "CC-Desk-$version-test-$shortSha-x64-setup.exe"
          $target = Join-Path $stage.FullName $name
          Copy-Item -LiteralPath $installers[0].FullName -Destination $target
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $target).Hash.ToLowerInvariant()
          $manifest = [ordered]@{
            schemaVersion = 1
            product = 'CC Desk'
            channel = 'test-only'
            baseVersion = $version
            sourceCommit = '${{ github.sha }}'
            workflowRunId = '${{ github.run_id }}'
            workflowRunAttempt = '${{ github.run_attempt }}'
            platform = 'windows-x86_64'
            installerFile = $name
            sha256 = $hash
            publishable = $false
            updaterPublication = $false
            d20RealCliCertification = 'BLOCKED_EXTERNAL_TARGET'
          }
          $manifest | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 (Join-Path $stage.FullName 'test-package-manifest.json')
          @"
          CC Desk Native CLI v3 TEST PACKAGE

          This package is an unreleased test build from commit ${{ github.sha }}.
          It is not a stable release and must not be promoted to an updater channel.
          Internal application version: $version
          Platform: Windows x86_64
          SHA-256: $hash

          Automated package verification performed before artifact upload:
          - locked dependency install
          - TypeScript typecheck
          - full frontend/adversarial test suite
          - release-policy tests
          - bundled ConPTY runtime guards
          - strict Rust Clippy
          - NSIS build
          - install / reinstall / relocation
          - missing and corrupt runtime fail-closed probes

          D20 real Claude Code / Codex CLI Layer-C certification remains BLOCKED until an authorized real target environment supplies the required evidence.
          "@ | Set-Content -Encoding utf8 (Join-Path $stage.FullName 'TEST-PACKAGE.txt')
          Write-Output "TEST_PACKAGE installer=$name sha256=$hash"

      - name: Verify tracked files unchanged
        run: git diff --exit-code

      - name: Upload verified Windows test package, never a GitHub release
        uses: actions/upload-artifact@v4
        with:
          name: cc-desk-native-v3-test-${{ github.sha }}
          path: |
            test-package/*
            conpty-install-results.json
            npm-audit.json
          retention-days: 14
          if-no-files-found: error
