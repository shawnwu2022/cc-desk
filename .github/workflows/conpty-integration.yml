name: Bundled ConPTY integration
on:
  push:
    branches: [codex/fix-devtools-text-paste]
    paths:
      - src-tauri/src/main.rs
      - src-tauri/src/conpty_runtime.rs
      - src-tauri/src/tests/conpty_runtime.rs
      - src-tauri/build.rs
      - src-tauri/conpty/**
      - src-tauri/tauri.windows.conf.json
      - scripts/*conpty*
      - tests/scripts/conptyBundle.node.cjs
      - .github/workflows/conpty-integration.yml
  pull_request:
    branches: [main]
    paths:
      - src-tauri/src/main.rs
      - src-tauri/src/conpty_runtime.rs
      - src-tauri/conpty/**
      - src-tauri/tauri.windows.conf.json
      - scripts/*conpty*
      - .github/workflows/conpty-integration.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bundled-conpty-${{ github.ref }}
  cancel-in-progress: true
jobs:
  installer:
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      CARGO_PROFILE_RELEASE_LTO: 'false'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: bundled-conpty-v1
          cache-on-failure: true
      - run: npm ci
      - run: node scripts/prepare-conpty.mjs
      - run: node --test tests/scripts/conptyBundle.node.cjs
      - run: npm run typecheck
      - run: npm test
      - name: Windows runtime guard tests
        working-directory: src-tauri
        run: cargo test --locked --bin cc-desk ConptyRuntime_ -- --nocapture
      - name: Strict Rust lint
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build ordinary Windows installer (no tracing, no updater publication)
        shell: pwsh
        run: |
          npm run tauri -- build --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":false}}'
          exit $LASTEXITCODE
      - name: Install, reinstall, relocate and test fail-closed startup
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe)
          if ($installers.Count -ne 1) { throw 'Expected one NSIS installer' }
          ./scripts/test-conpty-install.ps1 -Installer $installers[0].FullName
      - name: Capture source formatting diff for review
        if: always()
        shell: pwsh
        working-directory: src-tauri
        run: |
          cargo fmt --all
          git diff --output=../conpty-format.patch
          git diff --exit-code
      - name: Upload verification artifacts, never a GitHub release
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conpty-installer-verification
          path: |
            conpty-install-results.json
            conpty-format.patch
            src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 7
          if-no-files-found: warn
