name: D12 offline Rust development tools
on:
  push:
    branches: [feat/native-cli-source-scope]
    paths: [.github/workflows/d12-dev-tools.yml]
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Export compiler and vendored locked dependencies for offline checks
        run: |
          set -eu
          mkdir -p /tmp/d12-tools
          cd src-tauri
          cargo vendor --locked /tmp/d12-tools/vendor > /tmp/d12-tools/vendor-config.toml
          rustc --version > /tmp/d12-tools/rust-version.txt
          root=$(rustc --print sysroot)
          tar -C "$root" -czf /tmp/d12-tools/rust-toolchain.tar.gz bin lib libexec
          cd /tmp/d12-tools
          tar -czf vendor.tar.gz vendor
          rm -rf vendor
          sha256sum *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: d12-offline-rust-tools
          path: /tmp/d12-tools
          compression-level: 0
          retention-days: 2
          if-no-files-found: error
