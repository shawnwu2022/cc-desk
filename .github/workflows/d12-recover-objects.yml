name: D12 recover source objects
on:
  push:
    branches: [feat/native-cli-source-scope]
    paths: [.github/workflows/d12-recover-objects.yml]
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Restore hash-checked source and store blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os,json,base64,hashlib,lzma,subprocess,urllib.request
          from pathlib import Path
          assert os.environ['GITHUB_REPOSITORY']=='shawnwu2022/cc-desk'
          assert os.environ['GITHUB_REF']=='refs/heads/feat/native-cli-source-scope'
          def git(*args):
              return subprocess.check_output(['git',*args]).decode().strip()
          parent=git('rev-parse','HEAD')
          assert git('rev-parse','HEAD^')=='7668d0255b63e4433651bcb7b32b812c51348bf2'
          def api(route,data=None):
              req=urllib.request.Request('https://api.github.com/repos/shawnwu2022/cc-desk'+route,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},data=None if data is None else json.dumps(data).encode(),method='GET' if data is None else 'POST')
              with urllib.request.urlopen(req,timeout=60) as response:
                  return json.load(response)
          parts=[]
          for sha in ['b4746467aaddf2c3b19e0651c1fff3d06ad06e56','bc3a5c9b3497ccfba90ac61ab2bb02df9363b0bd','d7c1983d2ad49557028ba8c247c031a91a8e3431','694cf6f55f8bfa923fe2eec8c947f99c807f575e','3ccfd984e9725085913117102825a172b22cba27','b2f998ea02bdcf42c0364e32d00bcc80bdcbd9b3','74ce17b4bec5443092e833eda02e7ff6134f32df','c14ed7554b48e4f5ba2a7299e04fc2cbaf7b7316','26561fab6017f80367faa2c7041a3508ad4e5a90']:
              blob=api('/git/blobs/'+sha)
              data=base64.b64decode(blob['content'])
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==sha
              parts.append(data)
          patch=lzma.decompress(b''.join(parts))
          assert hashlib.sha256(patch).hexdigest()=='e1fda23c53cace46f8d36cecf22e2cdcbc7ead5fe9a27ace158be3e0e3bc91eb'
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
          Path('.github/workflows/d12-apply.yml').unlink()
          Path('.github/workflows/d12-recover-objects.yml').unlink()
          subprocess.run(['git','add','-A'],check=True)
          assert git('write-tree')=='4c6ddf7a2fddd1bb437050e3d2076d410802223a'
          out=Path('/tmp/d12-recovered');out.mkdir()
          subprocess.run(['git','archive','--format=tar',git('write-tree'),'-o',str(out/'source.tar')],check=True)
          subprocess.run(['git','bundle','create',str(out/'repo.bundle'),'HEAD'],check=True)
          entries=[]
          for p in filter(None,subprocess.check_output(['git','diff','--cached','--name-only','-z']).decode().split('\0')):
              if not Path(p).exists():
                  entries.append({'path':p,'mode':'100644','type':'blob','sha':None});continue
              content=Path(p).read_bytes()
              sha=api('/git/blobs',{'content':base64.b64encode(content).decode(),'encoding':'base64'})['sha']
              assert sha==git('hash-object',p)
              entries.append({'path':p,'mode':git('ls-files','--stage',p).split()[0],'type':'blob','sha':sha})
          (out/'objects.json').write_text(json.dumps({'parent':parent,'baseTree':git('rev-parse','HEAD^{tree}'),'sourceTree':git('write-tree'),'entries':entries},indent=2))
          print('D12_SOURCE_BLOBS_STORED',len(entries))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d12-recovered-source-objects
          path: /tmp/d12-recovered
          retention-days: 2
          if-no-files-found: error
