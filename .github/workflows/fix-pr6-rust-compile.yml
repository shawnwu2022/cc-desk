name: PR6 one-shot Rust compile repair

on:
  push:
    branches:
      - codex/focus-claude-workspace

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: windows-2022
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v5
        with:
          ref: codex/focus-claude-workspace
          fetch-depth: 0

      - name: Install Rust tooling
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply deterministic compile repair
        shell: python
        run: |
          from pathlib import Path

          def replace_count(path: Path, old: str, new: str, expected: int = 1) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != expected:
                  raise RuntimeError(
                      f"{path}: expected {expected} matches, found {count}: {old[:100]!r}"
                  )
              path.write_text(text.replace(old, new), encoding="utf-8", newline="\n")

          def remove_between(path: Path, start_marker: str, end_marker: str) -> None:
              text = path.read_text(encoding="utf-8")
              start_count = text.count(start_marker)
              if start_count != 1:
                  raise RuntimeError(
                      f"{path}: expected one start marker, found {start_count}: {start_marker!r}"
                  )
              start = text.index(start_marker)
              end = text.find(end_marker, start)
              if end < 0:
                  raise RuntimeError(f"{path}: end marker not found after {start_marker!r}")
              path.write_text(text[:start] + text[end:], encoding="utf-8", newline="\n")

          pty = Path("src-tauri/src/pty.rs")
          replace_count(
              pty,
              "        signal: status.signal().map(ToString::to_string),\n",
              "        // portable-pty 0.8.x exposes a portable exit code but no public\n"
              "        // signal accessor. Do not infer a signal from formatted text.\n"
              "        signal: None,\n",
          )
          replace_count(
              pty,
              "        self.validate_spawn_request(&id, cwd).map_err(|error| {\n"
              "            self.emit_error(&id, &error.to_string(), \"validation\");\n"
              "            error\n"
              "        })?;\n",
              "        self.validate_spawn_request(&id, cwd).inspect_err(|error| {\n"
              "            self.emit_error(&id, &error.to_string(), \"validation\");\n"
              "        })?;\n",
              expected=2,
          )

          pty_tests = Path("src-tauri/src/tests/pty.rs")
          replace_count(
              pty_tests,
              "#[test]\n"
              "fn PtyExitPayload_PreservesSignal_001() {\n"
              "    let status = ExitStatus::with_signal(\"SIGTERM\");\n"
              "    let payload = crate::pty::exit_payload(\"pty-2\", &status);\n\n"
              "    assert_eq!(payload.id, \"pty-2\");\n"
              "    assert_eq!(payload.exit_code, 1);\n"
              "    assert_eq!(payload.signal.as_deref(), Some(\"SIGTERM\"));\n"
              "}\n",
              "#[test]\n"
              "fn PtyExitPayload_SignalStatusUsesPortableExitCode_001() {\n"
              "    let status = ExitStatus::with_signal(\"SIGTERM\");\n"
              "    let payload = crate::pty::exit_payload(\"pty-2\", &status);\n\n"
              "    assert_eq!(payload.id, \"pty-2\");\n"
              "    assert_eq!(payload.exit_code, 1);\n"
              "    assert_eq!(payload.signal, None);\n"
              "}\n",
          )

          store_tests = Path("src-tauri/src/tests/store.rs")
          replace_count(
              store_tests,
              "    set_agent_enabled_in, set_mcp_server_enabled_in, set_skill_enabled_in,\n",
              "",
          )
          replace_count(
              store_tests,
              "    assert_eq!(\n"
              "        info.env.as_ref().unwrap().get(\"CHROME_PATH\").unwrap(),\n"
              "        \"/usr/bin/chrome\"\n"
              "    );\n",
              "",
          )
          replace_count(
              store_tests,
              "    assert_eq!(\n"
              "        info.headers.as_ref().unwrap().get(\"Authorization\").unwrap(),\n"
              "        \"Bearer token123\"\n"
              "    );\n",
              "",
          )

          platform = Path("src-tauri/src/platform.rs")
          remove_between(
              platform,
              "// ---- 5. 进程管理 ----\n",
              "// ---- 7. Shell 选择 ----\n",
          )

          platform_tests = Path("src-tauri/src/tests/platform.rs")
          remove_between(
              platform_tests,
              "// ---- get_platform_id ----\n",
              "// ---- get_default_shell ----\n",
          )

          store = Path("src-tauri/src/store.rs")
          remove_between(
              store,
              "    // 3. 从 disabled 备份目录读取用户级 agents（原位灰显）\n",
              "    Ok(agents)\n",
          )
          remove_between(
              store,
              "    // 2b. 从 disabled 备份目录读取用户级 skills（原位灰显）\n",
              "    // 3. 从 plugins 获取 skills",
          )
          remove_between(
              store,
              "    // 5. 从 disabled 备份目录读取用户级 MCP servers（原位灰显）\n",
              "    Ok(servers)\n",
          )
          remove_between(
              store,
              "/// 严格版的 claude 命令执行：exit code != 0 时返回 Err（含 stderr）\n",
              "/// 检测 Git Bash 路径（Windows）\n",
          )
          replace_count(
              store,
              "    /// 环境变量仅供原生配置解析，不序列化到 WebView。\n"
              "    #[serde(skip_serializing)]\n"
              "    pub env: Option<HashMap<String, String>>,\n"
              "    /// HTTP Headers 可能包含凭据，不序列化到 WebView。\n"
              "    #[serde(skip_serializing)]\n"
              "    pub headers: Option<HashMap<String, String>>,\n",
              "",
          )
          remove_between(
              store,
              "    // 解析 env（对象），展开环境变量值\n",
              "    // 解析 url，展开环境变量\n",
          )
          remove_between(
              store,
              "    // 解析 headers，展开环境变量值\n",
              "    // 推断 server type\n",
          )
          replace_count(store, "        env,\n        headers,\n", "")

          frontend_config = Path("src/types/config.ts")

          forbidden = {
              pty: [
                  "status.signal()",
                  ".map_err(|error| {\n            self.emit_error(&id, &error.to_string(), \"validation\")",
              ],
              platform: [
                  "kill_processes_by_name",
                  "is_process_running",
                  "get_platform_id",
              ],
              store: [
                  "get_disabled_subdir(",
                  "run_claude_command_strict",
                  "pub env: Option<HashMap<String, String>>",
                  "pub headers: Option<HashMap<String, String>>",
              ],
              store_tests: [
                  "set_agent_enabled_in",
                  "set_mcp_server_enabled_in",
                  "set_skill_enabled_in",
                  "info.env.as_ref()",
                  "info.headers.as_ref()",
              ],
              frontend_config: [
                  "env?: Record<string, string>  // stdio server environment variables",
                  "headers?: Record<string, string>  // HTTP headers for authentication",
              ],
          }
          for path, tokens in forbidden.items():
              text = path.read_text(encoding="utf-8")
              leftovers = [token for token in tokens if token in text]
              if leftovers:
                  raise RuntimeError(f"{path}: stale symbols remain: {leftovers}")

      - name: Format Rust
        working-directory: src-tauri
        run: cargo fmt --all

      - name: Verify formatting
        working-directory: src-tauri
        run: cargo fmt --all --check

      - name: Verify Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Verify Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Commit verified repair and remove one-shot workflow
        shell: pwsh
        run: |
          Remove-Item .github/workflows/fix-pr6-rust-compile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Error "Expected tracked compile-repair changes"
            exit 1
          }
          git commit -m "fix: restore Rust checks after scope cleanup [rust-fix-bot]"
          git push origin HEAD:codex/focus-claude-workspace
