name: Diagnose fragmented bracketed paste input

on:
  push:
    branches: [codex/fix-devtools-paste]
    paths:
      - .github/workflows/diagnose-git-bash-paste.yml

permissions:
  contents: read

concurrency:
  group: diagnose-fragmented-paste
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Install the already-verified Claude Code build
        run: npm install --engine-strict --prefix .ci-claude --no-save "@anthropic-ai/claude-code@2.1.267"
      - name: Generate one real frontend JSON payload
        shell: node {0}
        run: |
          const fs = require('node:fs');
          const path = require('node:path');
          const root = process.cwd();
          const ts = require(path.join(root, 'node_modules/typescript'));
          const js = ts.transpileModule(fs.readFileSync('src/utils/pasteText.ts', 'utf8'), {
            compilerOptions: {module: ts.ModuleKind.CommonJS, target: ts.ScriptTarget.ES2022}
          }).outputText;
          fs.writeFileSync('.ci-claude/pasteText.cjs', js);
          const {buildPastePayload} = require(path.join(root, '.ci-claude/pasteText.cjs'));
          const fixture = JSON.parse(fs.readFileSync('src-tauri/tests/fixtures/devtools-paste-framing.json', 'utf8')).find(f => f.name === 'devtools-json-nested-64');
          if (!fixture) throw new Error('missing JSON fixture');
          const source = (fixture.prefix || '') + Array(fixture.repeat).fill(fixture.source).join(fixture.separator || '') + (fixture.suffix || '');
          JSON.parse(source);
          const cases = [{name: 'fragmented-bracketed-paste', wire: buildPastePayload(source, true, false), expected: source.replace(/\r\n?/g, '\n')}];
          const payloadFile = path.resolve('.ci-claude/fragmented-payload.json');
          fs.writeFileSync(payloadFile, JSON.stringify(cases));
          const pkgDir = path.resolve('.ci-claude/node_modules/@anthropic-ai/claude-code');
          const pkg = JSON.parse(fs.readFileSync(path.join(pkgDir, 'package.json'), 'utf8'));
          const bin = typeof pkg.bin === 'string' ? pkg.bin : pkg.bin.claude;
          const cli = path.resolve(pkgDir, bin);
          if (!fs.existsSync(cli)) throw new Error('required executable missing');
          fs.appendFileSync(process.env.GITHUB_ENV, `CC_E2E_CLAUDE_PATH=${cli}\nCC_PASTE_PAYLOAD_FILE=${payloadFile}\n`);
          console.log('fixture UTF-8 bytes:', Buffer.byteLength(cases[0].expected));
      - name: One-call control must pass
        working-directory: src-tauri
        run: cargo test --locked --lib RealClaude_DevtoolsJsonSubmittedCompletely_001 -- --ignored --test-threads=1 --nocapture
      - name: Patch only the acceptance driver to split opener, body and closer
        shell: python
        run: |
          from pathlib import Path
          p = Path('src-tauri/src/tests/paste_cli_submit.rs')
          text = p.read_text(encoding='utf-8')
          old = '        write_pty_data(&mut *writer, case.wire.as_bytes()).map_err(|e| e.to_string())?;'
          if text.count(old) != 1:
              raise SystemExit('acceptance write call changed unexpectedly')
          new = '''        const OPEN: &[u8] = b"\\x1b[200~";
                  const CLOSE: &[u8] = b"\\x1b[201~";
                  let wire = case.wire.as_bytes();
                  if !wire.starts_with(OPEN) || !wire.ends_with(CLOSE) {
                      return Err("acceptance fixture is not one complete bracketed paste frame".into());
                  }
                  // This matches a valid xterm/native path where onData/IPC delivers
                  // the opening delimiter, body and closing delimiter separately.
                  write_pty_data(&mut *writer, OPEN).map_err(|e| e.to_string())?;
                  write_pty_data(&mut *writer, &wire[OPEN.len()..wire.len() - CLOSE.len()])
                      .map_err(|e| e.to_string())?;
                  write_pty_data(&mut *writer, CLOSE).map_err(|e| e.to_string())?;'''
          p.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
      - name: Require the current stateless production writer to reproduce the failure
        working-directory: src-tauri
        shell: pwsh
        run: |
          cargo fmt --all
          $output = cargo test --locked --lib RealClaude_DevtoolsJsonSubmittedCompletely_001 -- --ignored --test-threads=1 --nocapture 2>&1
          $code = $LASTEXITCODE
          $output | Write-Output
          if ($code -eq 0) {
            throw 'Fragmented paste unexpectedly passed; the per-call framing hypothesis is rejected'
          }
          $text = $output -join "`n"
          if ($text -notmatch 'Paste submitted before the explicit Enter key|No complete UserPromptSubmit capture|submitted JSON differs|201~') {
            throw 'Fragmented paste failed for an unrelated reason'
          }
          'Confirmed RED: current production writer only protects a complete frame in one IPC call; fragmented delimiters lose transaction semantics.' >> $env:GITHUB_STEP_SUMMARY
          $global:LASTEXITCODE = 0
