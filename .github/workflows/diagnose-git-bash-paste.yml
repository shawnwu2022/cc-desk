name: Build paste diagnostics package

on:
  push:
    branches: [codex/fix-devtools-paste]
    paths:
      - .github/workflows/diagnose-git-bash-paste.yml

permissions:
  contents: write

concurrency:
  group: build-paste-diagnostics
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci

      - name: Add privacy-safe paste boundary diagnostics and unique version
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one match, got {text.count(old)}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          replace_once('package.json', '"version": "0.17.2"', '"version": "0.17.3"')
          replace_once('package-lock.json', '"name": "cc-desk",\n  "version": "0.17.2"', '"name": "cc-desk",\n  "version": "0.17.3"')
          replace_once('package-lock.json', '"": {\n      "name": "cc-desk",\n      "version": "0.17.2"', '"": {\n      "name": "cc-desk",\n      "version": "0.17.3"')
          replace_once('src-tauri/Cargo.toml', 'name = "cc-desk"\nversion = "0.17.2"', 'name = "cc-desk"\nversion = "0.17.3"')
          replace_once('src-tauri/tauri.conf.json', '"version": "0.17.2"', '"version": "0.17.3"')

          replace_once(
              'src-tauri/build.rs',
              '    tauri_build::build()\n}',
              '''    let build_sha = std::env::var("CC_DESK_BUILD_SHA")
                  .or_else(|_| std::env::var("GITHUB_SHA"))
                  .unwrap_or_else(|_| "local".to_string());
              println!("cargo:rerun-if-env-changed=CC_DESK_BUILD_SHA");
              println!("cargo:rerun-if-env-changed=GITHUB_SHA");
              println!("cargo:rustc-env=CC_DESK_BUILD_SHA={build_sha}");

              tauri_build::build()
          }'''
          )

          replace_once(
              'src-tauri/src/logger.rs',
              '    log::info!("=== CC Desk started ===");',
              '''    log::info!("=== CC Desk started ===");
              log::info!(
                  "Build identity: version={} sha={}",
                  env!("APP_VERSION"),
                  env!("CC_DESK_BUILD_SHA")
              );'''
          )

          replace_once(
              'src/api/tauri.ts',
              '''export const ptyInput = async (id: string, data: string): Promise<boolean> => {
            return invoke<boolean>('pty_input', { id, data });
          };''',
              '''export type PtyInputSource =
            | 'terminal-ondata'
            | 'xterm-ondata-paste'
            | 'clipboard-keyboard'
            | 'clipboard-dom'
            | 'other'

          export const ptyInput = async (
            id: string,
            data: string,
            source: PtyInputSource = 'other',
          ): Promise<boolean> => {
            return invoke<boolean>('pty_input', { id, data, source });
          };'''
          )

          replace_once(
              'src/components/XTermTerminal.vue',
              '      if (instance.ptyId) ptyInput(instance.ptyId, data)',
              '''      if (instance.ptyId) {
                const pasteLike = data.includes('\\x1b[200~') || data.includes('\\x1b[201~')
                ptyInput(instance.ptyId, data, pasteLike ? 'xterm-ondata-paste' : 'terminal-ondata')
              }'''
          )
          replace_once(
              'src/components/XTermTerminal.vue',
              '''        text => buildPastePayload(text, term.modes.bracketedPasteMode, term.options.ignoreBracketedPasteMode ?? false),
                  ptyInput,
                  () => imagePasteBytes(platform),''',
              '''        text => buildPastePayload(text, term.modes.bracketedPasteMode, term.options.ignoreBracketedPasteMode ?? false),
                  (id, payload) => ptyInput(id, payload, 'clipboard-keyboard'),
                  () => imagePasteBytes(platform),'''
          )
          replace_once(
              'src/components/XTermTerminal.vue',
              '      write: ptyInput,',
              "      write: (id, payload) => ptyInput(id, payload, 'clipboard-dom'),"
          )

          replace_once(
              'src-tauri/src/commands.rs',
              '''pub async fn pty_input(id: String, data: String) -> Result<bool, String> {
              let manager = get_pty_manager().ok_or_else(|| "PTY manager not initialized".to_string())?;

              manager
                  .write(&id, &data)
                  .map(|_| true)
                  .map_err(|e| e.to_string())
          }''',
              '''pub async fn pty_input(
              id: String,
              data: String,
              source: Option<String>,
          ) -> Result<bool, String> {
              let manager = get_pty_manager().ok_or_else(|| "PTY manager not initialized".to_string())?;

              manager
                  .write(&id, &data, source.as_deref())
                  .map(|_| true)
                  .map_err(|e| e.to_string())
          }'''
          )

          p = Path('src-tauri/src/pty.rs')
          text = p.read_text(encoding='utf-8')
          text = text.replace('use std::time::Duration;', 'use std::time::{Duration, Instant};', 1)
          old = '''    /// 写入输入到 PTY。全局 map 锁在取得 Arc 后立即释放。
              pub fn write(&self, id: &str, data: &str) -> Result<()> {
                  let entry = lookup_writer(&self.writers, id).ok_or_else(|| {
                      let error = format!("PTY writer not found for id: {id}");
                      log::warn!("{}", error);
                      anyhow!(error)
                  })?;

                  let mut writer = entry.writer.lock();
                  write_pty_data(writer.as_mut(), data.as_bytes()).with_context(|| {
                      format!("Failed to write or flush {} bytes to PTY {id}", data.len())
                  })?;
                  Ok(())
              }'''
          if text.count(old) != 1:
              raise SystemExit('src-tauri/src/pty.rs: write method changed unexpectedly')
          new = '''    /// 写入输入到 PTY。全局 map 锁在取得 Arc 后立即释放。
              /// 粘贴诊断只记录来源、尺寸、标记位置和耗时，绝不记录剪贴板正文。
              pub fn write(&self, id: &str, data: &str, source: Option<&str>) -> Result<()> {
                  let entry = lookup_writer(&self.writers, id).ok_or_else(|| {
                      let error = format!("PTY writer not found for id: {id}");
                      log::warn!("{}", error);
                      anyhow!(error)
                  })?;

                  let bytes = data.as_bytes();
                  let open = data.find("\\x1b[200~");
                  let close = data.rfind("\\x1b[201~");
                  let complete_frame = data.starts_with("\\x1b[200~") && data.ends_with("\\x1b[201~");
                  let source = source
                      .unwrap_or("unknown")
                      .chars()
                      .filter(|ch| ch.is_ascii_alphanumeric() || matches!(ch, '-' | '_' | ':'))
                      .take(48)
                      .collect::<String>();
                  let paste_like = source.contains("paste") || open.is_some() || close.is_some();
                  let transport = if cfg!(windows) && complete_frame {
                      "windows-conpty-protected"
                  } else {
                      "generic"
                  };
                  let short_id = &id[..id.len().min(8)];
                  if paste_like {
                      log::info!(
                          target: "paste_diag",
                          "input build={} version={} pty={} source={} utf8_bytes={} chars={} lf={} open_at={:?} close_at={:?} complete={} transport={}",
                          env!("CC_DESK_BUILD_SHA"),
                          env!("APP_VERSION"),
                          short_id,
                          source,
                          bytes.len(),
                          data.chars().count(),
                          bytes.iter().filter(|byte| **byte == b'\\n').count(),
                          open,
                          close,
                          complete_frame,
                          transport
                      );
                  }

                  let started = Instant::now();
                  let mut writer = entry.writer.lock();
                  let result = write_pty_data(writer.as_mut(), bytes);
                  if paste_like {
                      log::info!(
                          target: "paste_diag",
                          "write pty={} source={} success={} elapsed_ms={}",
                          short_id,
                          source,
                          result.is_ok(),
                          started.elapsed().as_millis()
                      );
                  }
                  result.with_context(|| {
                      format!("Failed to write or flush {} bytes to PTY {id}", data.len())
                  })?;
                  Ok(())
              }'''
          p.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          replace_once(
              'src-tauri/src/tests/pty.rs',
              '    assert_eq!(Arc::strong_count(&entry), 3);',
              '''    assert_eq!(Arc::strong_count(&entry), 3);
          }

          #[test]
          fn PtyPasteDiagnostic_DoesNotRequireClipboardContent_001() {
              let input = "\\x1b[200~{\\n  \\"secret\\": true\\n}\\x1b[201~";
              assert!(input.starts_with("\\x1b[200~"));
              assert!(input.ends_with("\\x1b[201~"));'''
          )

          p = Path('AGENTS.md')
          text = p.read_text(encoding='utf-8')
          text += '''

          ### 粘贴诊断构建

          - 0.17.3 诊断包通过 `paste_diag` 仅记录入口来源、UTF-8 字节数、字符数、LF 数、起止标记位置、writer 路径和耗时；严禁记录剪贴板正文。
          - 日志位于 `~/.cc-box/logs/YYYY-MM-DD.log`，并包含版本与构建 SHA。用户复现后应截取 `Build identity` 和 `paste_diag` 行定位边界。
          - 诊断包不得被表述为已修复版本；结果用于区分 WebView/IPC 未形成完整帧，与特定 Windows/Claude 对完整帧处理失败。
          '''
          p.write_text(text, encoding='utf-8', newline='\n')

      - name: Format and verify source
        env:
          CC_DESK_BUILD_SHA: diagnostic-source
        shell: pwsh
        run: |
          Push-Location src-tauri
          cargo fmt --all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fmt --all --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build

      - name: Commit the verified diagnostic source
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json src-tauri/build.rs src-tauri/src/logger.rs src-tauri/src/commands.rs src-tauri/src/pty.rs src-tauri/src/tests/pty.rs src/api/tauri.ts src/components/XTermTerminal.vue AGENTS.md
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git commit -m 'diagnostic: trace paste boundaries without recording clipboard content'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:codex/fix-devtools-paste
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CC_DESK_BUILD_SHA=$(git rev-parse HEAD)" >> $env:GITHUB_ENV
          "DIAGNOSTIC_SOURCE_SHA=$(git rev-parse HEAD)" >> $env:GITHUB_ENV

      - name: Verify updater signing secrets
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY) -or [string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) {
            throw 'Missing updater signing secrets'
          }

      - name: Build signed Windows diagnostic installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build

      - name: Stage package and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/windows | Out-Null
          Get-ChildItem src-tauri/target/release/bundle/nsis -File |
            Where-Object { $_.Extension -in '.exe', '.sig' } |
            ForEach-Object { Copy-Item $_.FullName artifacts/windows/ }
          if (-not (Get-ChildItem artifacts/windows -Filter '*.exe' -File)) { throw 'No installer generated' }
          @(
            "version=0.17.3"
            "source_commit=$env:DIAGNOSTIC_SOURCE_SHA"
            "build_identity=$env:CC_DESK_BUILD_SHA"
            "purpose=paste-boundary-diagnostics-not-a-fix-claim"
            "log_path=%USERPROFILE%\\.cc-box\\logs\\YYYY-MM-DD.log"
          ) | Set-Content -Encoding utf8NoBOM artifacts/windows/build-info.txt
          Get-ChildItem artifacts/windows -File |
            Where-Object { $_.Name -ne 'SHA256SUMS.txt' } |
            ForEach-Object {
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash *$($_.Name)"
            } | Set-Content -Encoding ascii artifacts/windows/SHA256SUMS.txt
          Get-ChildItem artifacts/windows -File | Format-Table Name, Length
          Get-Content artifacts/windows/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: cc-desk-paste-diagnostics-0.17.3-${{ env.DIAGNOSTIC_SOURCE_SHA }}
          path: artifacts/windows/*
          if-no-files-found: error
          retention-days: 14

      - name: Remove the temporary build workflow
        if: success()
        shell: pwsh
        run: |
          git rm .github/workflows/diagnose-git-bash-paste.yml
          git commit -m 'chore: remove temporary paste diagnostics build workflow'
          git push origin HEAD:codex/fix-devtools-paste
