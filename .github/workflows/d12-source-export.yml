name: D12 continuation source export
on:
  push:
    branches: [feat/native-cli-source-scope]
    paths: [.github/workflows/d12-source-export.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export exact continuation including scoped-reader scaffolding
        run: |
          mkdir -p /tmp/d12-source
          git bundle create /tmp/d12-source/repo.bundle HEAD
          git rev-parse HEAD > /tmp/d12-source/source.sha
          cd /tmp/d12-source
          sha256sum repo.bundle > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: d12-continuation-source
          path: /tmp/d12-source
          retention-days: 2
          if-no-files-found: error
