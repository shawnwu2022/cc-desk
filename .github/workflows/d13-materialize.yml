name: D13 verified source materialization
on:
  push:
    branches: [feat/native-cli-source-scope]
    paths: [.github/workflows/d13-materialize.yml]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reconstruct and verify exact reviewed source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os,json,subprocess,hashlib,base64,lzma,urllib.request
          from pathlib import Path
          assert os.environ['GITHUB_REPOSITORY']=='shawnwu2022/cc-desk'
          assert os.environ['GITHUB_REF']=='refs/heads/feat/native-cli-source-scope'
          def git(*args): return subprocess.check_output(['git',*args]).decode().strip()
          parent=git('rev-parse','HEAD')
          assert parent==os.environ['GITHUB_SHA']
          base='6f27709020517fb45e048d023cfc6a6de07814e2'
          assert git('rev-parse','HEAD^')==base,'unexpected predecessor; preserve concurrent changes'
          endpoint='https://api.github.com/repos/shawnwu2022/cc-desk'
          def api(route,data=None):
              req=urllib.request.Request(endpoint+route,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},data=None if data is None else json.dumps(data).encode(),method='GET' if data is None else 'POST')
              with urllib.request.urlopen(req,timeout=60) as response: return json.load(response)
          chunks=[]
          for sha in ['f0e8a4602eea1fce43122f8c833080a4b614efc3','35c95f529112fe66c19a3691866c2feb7ae525a5','b94d1516477e9fb92668c0cf9fedc3a39ce70061','d9f2f64e1642300b6729e7830f03aa86660ab274','22fca6319e81d5b2c29210131b4a6945e29283ee']:
              blob=api('/git/blobs/'+sha)
              assert blob['sha']==sha and blob['encoding']=='base64'
              data=base64.b64decode(blob['content'])
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==sha
              chunks.append(data)
          raw=lzma.decompress(b''.join(chunks))
          assert len(raw)==105051
          digest=hashlib.sha256(raw).hexdigest()
          assert digest=='fc9e0a12b14aaa37d06640b5cb113e94dcc9bad219e389002c5b3ed1c58f5ea5'
          manifest=json.loads(raw)
          assert manifest['base']==base
          assert manifest['tree']=='755de1593062840c64ec02c073aa8bd47c6e25af'
          sources={}
          for path,sha in manifest['sources'].items():
              data=subprocess.check_output(['git','show',base+':'+path])
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==sha
              sources[path]=data.decode('utf-8').splitlines(keepends=True)
          for item in manifest['files']:
              p=Path(item['path'])
              assert not p.is_absolute() and '..' not in p.parts
              assert str(p).startswith(('src/','src-tauri/src/','src-tauri/plugin/','tests/','docs/')) or str(p) in ['AGENTS.md','.github/workflows/d13-observer-core.yml','.github/workflows/d13-workspace-export.yml']
              if item.get('delete'):
                  p.unlink(); continue
              pieces=[]
              for op in item['ops']:
                  if op[0]=='insert': pieces.append(op[1])
                  else:
                      assert op[0]=='copy'
                      rows=sources[op[1]]; start,count=op[2:]
                      assert start>=0 and count>0 and start+count<=len(rows)
                      pieces.extend(rows[start:start+count])
              content=''.join(pieces).encode('utf-8')
              assert hashlib.sha256(content).hexdigest()==item['sha256'],str(p)
              p.parent.mkdir(parents=True,exist_ok=True); p.write_bytes(content)
              assert item['mode'] in ['100644','100755']
              p.chmod(0o755 if item['mode']=='100755' else 0o644)
          Path('.github/workflows/d13-materialize.yml').unlink()
          subprocess.run(['git','add','-A'],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          tree=git('write-tree')
          assert tree==manifest['tree'],tree
          assert api('/git/ref/heads/feat/native-cli-source-scope')['object']['sha']==parent,'branch advanced; do not overwrite'
          paths=list(filter(None,subprocess.check_output(['git','diff','--cached','--name-only','-z']).decode().split('\0')))
          entries=[]
          for path in paths:
              p=Path(path)
              if not p.exists():
                  entries.append({'path':path,'mode':'100644','type':'blob','sha':None}); continue
              blob=api('/git/blobs',{'content':p.read_bytes().decode('utf-8'),'encoding':'utf-8'})['sha']
              assert blob==git('hash-object',path)
              mode=git('ls-files','--stage',path).split()[0]
              entries.append({'path':path,'mode':mode,'type':'blob','sha':blob})
          remote_tree=api('/git/trees',{'base_tree':git('rev-parse','HEAD^{tree}'),'tree':entries})['sha']
          assert remote_tree==tree
          author={'name':'CC Desk development','email':'41898282+github-actions[bot]@users.noreply.github.com'}
          commit=api('/git/commits',{'message':'feat(d13): connect authenticated observer leases and isolate activity projections','tree':tree,'parents':[parent],'author':author,'committer':author})['sha']
          out=Path('/tmp/d13-result'); out.mkdir()
          (out/'commit.json').write_text(json.dumps({'base':base,'parent':parent,'commit':commit,'tree':tree,'deltaSha256':digest},indent=2))
          subprocess.run(['git','archive','--format=tar',tree,'-o',str(out/'source.tar')],check=True)
          print('D13_MATERIALIZED_COMMIT='+commit)
          print('D13_MATERIALIZED_TREE='+tree)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: d13-verified-source
          path: /tmp/d13-result
          retention-days: 2
          if-no-files-found: error
