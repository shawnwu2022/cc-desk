name: Repair raw ConPTY paste

on:
  push:
    branches: [codex/fix-devtools-paste]
    paths: [.github/workflows/repair-raw-conpty-paste.yml]

permissions:
  contents: write

concurrency:
  group: repair-raw-conpty-paste
  cancel-in-progress: false

jobs:
  repair:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci

      - name: Add raw-frame regression
        run: python .github/scripts/repair_raw_paste.py add-test

      - name: Correct temporary Rust string escaping
        shell: python
        run: |
          from pathlib import Path
          p = Path('src-tauri/src/tests/paste_framing.rs')
          text = p.read_text(encoding='utf-8')
          old = r'''    let payload = format!("{OPEN}{{\n  \\"ok\\": true,\n  \\"text\\": \\"中文🎉\\"\n}}{CLOSE}");'''
          new = r'''    let payload = format!("{OPEN}{{\n  \"ok\": true,\n  \"text\": \"中文🎉\"\n}}{CLOSE}");'''
          assert text.count(old) == 1, text[text.index('fn PtyPaste_WindowsMatches'):text.index('fn PtyPaste_WindowsMatches') + 900]
          p.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

      - name: Format regression
        working-directory: src-tauri
        run: cargo fmt --all

      - name: Confirm RED against encoded-marker writer
        working-directory: src-tauri
        shell: pwsh
        run: |
          $output = cargo test --lib PtyPaste_WindowsMatchesWindowsTerminalRawWrite_009 -- --nocapture 2>&1
          $code = $LASTEXITCODE
          $output | Write-Output
          if ($code -eq 0) { throw 'Expected current encoded-marker writer to fail' }
          if (($output -join "`n") -notmatch 'one unmodified raw bracketed-paste write') {
            throw 'Regression failed for an unrelated reason'
          }
          $global:LASTEXITCODE = 0

      - name: Apply architecture correction
        run: python .github/scripts/repair_raw_paste.py apply

      - name: Restore registry dependency metadata
        working-directory: src-tauri
        run: cargo update -p portable-pty --precise 0.8.1

      - name: Verify focused raw-frame contract
        working-directory: src-tauri
        run: |
          cargo fmt --all
          cargo test --lib PtyPaste_WindowsMatchesWindowsTerminalRawWrite_009 -- --nocapture

      - name: Install isolated Claude Code 2.1.268
        run: npm install --engine-strict --prefix .ci-claude --no-save "@anthropic-ai/claude-code@2.1.268"

      - name: Generate real Claude payloads
        run: node .github/scripts/generate_paste_acceptance.cjs

      - name: Verify exact submitted JSON through real Claude
        working-directory: src-tauri
        run: cargo test --lib RealClaude_DevtoolsJsonSubmittedCompletely_001 -- --ignored --test-threads=1 --nocapture

      - name: Verify Rust
        working-directory: src-tauri
        run: |
          cargo fmt --all --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: Verify frontend
        run: |
          npm run typecheck
          npm run test:ci
          npm run build

      - name: Commit verified 0.17.5 source
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json src-tauri/src/pty.rs src-tauri/src/tests/paste_framing.rs .github/workflows/paste-cli-acceptance.yml docs/paste-framing.md AGENTS.md
          git add -A src-tauri/vendor/portable-pty
          git diff --cached --check
          git commit -m 'fix: send Windows bracketed paste as one unmodified ConPTY frame'
          git push origin HEAD:codex/fix-devtools-paste

      - name: Remove temporary repair files
        shell: pwsh
        run: |
          Remove-Item .github/workflows/repair-raw-conpty-paste.yml
          Remove-Item .github/scripts/repair_raw_paste.py
          Remove-Item .github/scripts/generate_paste_acceptance.cjs
          git add -A .github/workflows/repair-raw-conpty-paste.yml .github/scripts/repair_raw_paste.py .github/scripts/generate_paste_acceptance.cjs
          git commit -m 'chore: remove temporary raw paste repair harness'
          git push origin HEAD:codex/fix-devtools-paste
