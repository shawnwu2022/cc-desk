name: Repair raw ConPTY paste

on:
  push:
    branches: [codex/fix-devtools-paste]
    paths: [.github/workflows/repair-raw-conpty-paste.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-raw-conpty-paste
  cancel-in-progress: false

jobs:
  repair:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci

      - name: Add raw-frame regression
        run: python .github/scripts/repair_raw_paste.py add-test

      - name: Correct temporary Rust string escaping
        shell: python
        run: |
          from pathlib import Path
          p = Path('src-tauri/src/tests/paste_framing.rs')
          text = p.read_text(encoding='utf-8')
          old = r'''    let payload = format!("{OPEN}{{\n  \\"ok\\": true,\n  \\"text\\": \\"中文🎉\\"\n}}{CLOSE}");'''
          new = r'''    let payload = format!("{OPEN}{{\n  \"ok\": true,\n  \"text\": \"中文🎉\"\n}}{CLOSE}");'''
          assert text.count(old) == 1, text[text.index('fn PtyPaste_WindowsMatches'):text.index('fn PtyPaste_WindowsMatches') + 900]
          p.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

      - name: Format regression
        working-directory: src-tauri
        run: cargo fmt --all

      - name: Confirm RED against encoded-marker writer
        working-directory: src-tauri
        shell: pwsh
        run: |
          $output = cargo test --lib PtyPaste_WindowsMatchesWindowsTerminalRawWrite_009 -- --nocapture 2>&1
          $code = $LASTEXITCODE
          $output | Write-Output
          if ($code -eq 0) { throw 'Expected current encoded-marker writer to fail' }
          if (($output -join "`n") -notmatch 'one unmodified raw bracketed-paste write') {
            throw 'Regression failed for an unrelated reason'
          }
          $global:LASTEXITCODE = 0

      - name: Apply architecture correction
        run: python .github/scripts/repair_raw_paste.py apply

      - name: Keep the repair commit free of workflow-file changes
        shell: pwsh
        run: git checkout -- .github/workflows/paste-cli-acceptance.yml

      - name: Restore exact crates.io portable-pty lock entry
        shell: python
        run: |
          from pathlib import Path
          import re
          import subprocess

          subprocess.run(
              ['git', 'fetch', 'origin', 'codex/focus-claude-workspace', '--depth=1'],
              check=True,
          )
          base = subprocess.check_output(
              ['git', 'show', 'FETCH_HEAD:src-tauri/Cargo.lock'],
              text=True,
              encoding='utf-8',
          )
          lock_path = Path('src-tauri/Cargo.lock')
          current = lock_path.read_text(encoding='utf-8')
          pattern = re.compile(
              r'^\[\[package\]\]\nname = "portable-pty"\n.*?(?=^\[\[package\]\]|\Z)',
              re.MULTILINE | re.DOTALL,
          )
          base_match = pattern.search(base)
          current_match = pattern.search(current)
          if base_match is None or current_match is None:
              raise SystemExit('portable-pty lock entry not found in base/current lockfile')
          base_block = base_match.group(0)
          if 'source = "registry+' not in base_block or 'checksum = ' not in base_block:
              raise SystemExit('base portable-pty entry is not a registry package')
          current = current[:current_match.start()] + base_block + current[current_match.end():]
          old_version = 'name = "cc-desk"\nversion = "0.17.4"'
          if current.count(old_version) != 1:
              raise SystemExit('cc-desk lock version entry was not uniquely found')
          current = current.replace(old_version, 'name = "cc-desk"\nversion = "0.17.5"', 1)
          lock_path.write_text(current, encoding='utf-8', newline='\n')

      - name: Verify focused raw-frame contract
        working-directory: src-tauri
        run: |
          cargo fmt --all
          cargo test --locked --lib PtyPaste_WindowsMatchesWindowsTerminalRawWrite_009 -- --nocapture

      - name: Install isolated Claude Code 2.1.268
        run: npm install --engine-strict --prefix .ci-claude --no-save "@anthropic-ai/claude-code@2.1.268"

      - name: Generate real Claude payloads
        run: node .github/scripts/generate_paste_acceptance.cjs

      - name: Verify exact submitted JSON through real Claude
        working-directory: src-tauri
        run: cargo test --locked --lib RealClaude_DevtoolsJsonSubmittedCompletely_001 -- --ignored --test-threads=1 --nocapture

      - name: Verify Rust
        working-directory: src-tauri
        run: |
          cargo fmt --all --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

      - name: Verify frontend
        run: |
          npm run typecheck
          npm run test:ci
          npm run build

      - name: Verify updater signing secrets
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw 'Missing TAURI_SIGNING_PRIVATE_KEY'
          }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) {
            throw 'Missing TAURI_SIGNING_PRIVATE_KEY_PASSWORD'
          }

      - name: Build signed Windows 0.17.5 installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build

      - name: Generate installer verification metadata
        shell: pwsh
        run: |
          $bundle = 'src-tauri/target/release/bundle/nsis'
          $exe = Get-ChildItem $bundle -Filter '*.exe' | Select-Object -First 1
          $sig = Get-ChildItem $bundle -Filter '*.exe.sig' | Select-Object -First 1
          if (-not $exe) { throw 'Windows installer was not produced' }
          if (-not $sig) { throw 'Windows updater signature was not produced' }
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($exe.Name)" | Set-Content (Join-Path $bundle 'SHA256SUMS.txt') -Encoding utf8NoBOM
          @(
            'version=0.17.5'
            "workflow_source_sha=${{ github.sha }}"
            'claude_acceptance_version=2.1.268'
            'transport=windows-conpty-raw-frame'
            "installer=$($exe.Name)"
          ) | Set-Content (Join-Path $bundle 'BUILD-INFO.txt') -Encoding utf8NoBOM
          Get-Content (Join-Path $bundle 'SHA256SUMS.txt')
          Get-Content (Join-Path $bundle 'BUILD-INFO.txt')

      - name: Upload Windows 0.17.5 installer
        uses: actions/upload-artifact@v4
        with:
          name: cc-desk-0.17.5-windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
            src-tauri/target/release/bundle/nsis/BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 30

      - name: Commit verified 0.17.5 source
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json src-tauri/src/pty.rs src-tauri/src/tests/paste_framing.rs docs/paste-framing.md AGENTS.md
          git add -A src-tauri/vendor/portable-pty
          git diff --cached --check
          $workflowChanges = @(git diff --cached --name-only | Where-Object { $_ -like '.github/workflows/*' })
          if ($workflowChanges.Count -ne 0) {
            throw "Refusing to push workflow-file changes: $($workflowChanges -join ', ')"
          }
          git commit -m 'fix: send Windows bracketed paste as one unmodified ConPTY frame'
          git push origin HEAD:codex/fix-devtools-paste
