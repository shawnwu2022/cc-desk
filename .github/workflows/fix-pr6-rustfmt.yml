name: PR6 one-shot rustfmt repair

on:
  push:
    branches:
      - codex/focus-claude-workspace

permissions:
  contents: write

jobs:
  rustfmt:
    if: ${{ !contains(github.event.head_commit.message, '[rustfmt-bot]') }}
    runs-on: windows-2022
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v5
        with:
          ref: codex/focus-claude-workspace
          fetch-depth: 0

      - name: Install Rust with rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply rustfmt
        working-directory: src-tauri
        run: cargo fmt --all

      - name: Commit formatting and remove one-shot workflow
        shell: pwsh
        run: |
          Remove-Item .github/workflows/fix-pr6-rustfmt.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if (git diff --cached --quiet) {
            Write-Error "cargo fmt produced no tracked change; expected PR formatting repair"
            exit 1
          }
          git commit -m "style: apply rustfmt [rustfmt-bot]"
          git push origin HEAD:codex/focus-claude-workspace
