name: Real Claude paste acceptance
on:
  push:
    branches: [main, codex/fix-devtools-text-paste]
    paths: &paste_paths
      - .github/workflows/paste-cli-acceptance.yml
      - .github/scripts/generate_paste_acceptance.cjs
      - tests/scripts/pasteAcceptance.node.cjs
      - src-tauri/src/tests/paste_cli_submit.rs
      - src-tauri/src/pty.rs
      - src-tauri/tests/fixtures/devtools-paste-framing.json
      - src/utils/pasteText.ts
  pull_request:
    branches: [main]
    paths: *paste_paths
  workflow_dispatch:
    inputs:
      claude_versions:
        description: JSON array of exact Claude Code versions
        default: '["2.1.268","2.1.274"]'
        required: true
permissions:
  contents: read
concurrency:
  group: paste-cli-acceptance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    name: Real CLI (${{ matrix.claude_version }})
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        claude_version: ${{ fromJSON(inputs.claude_versions || '["2.1.268","2.1.274"]') }}
    env:
      CLAUDE_TEST_VERSION: ${{ matrix.claude_version }}
      DISABLE_AUTOUPDATER: '1'
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Verify generator regression contracts
        run: node --test tests/scripts/pasteAcceptance.node.cjs
      - name: Install a disposable pinned Claude CLI without user credentials
        shell: pwsh
        run: |
          if ($env:CLAUDE_TEST_VERSION -notmatch '^\d+\.\d+\.\d+$') { throw 'An exact version is required' }
          npm install --engine-strict --prefix .ci-claude --no-save "@anthropic-ai/claude-code@$env:CLAUDE_TEST_VERSION"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Generate JSON and non-JSON payloads using the production frontend
        run: node .github/scripts/generate_paste_acceptance.cjs
      - name: Record actual executable and Windows build
        shell: pwsh
        run: |
          $cli = $env:CC_E2E_CLAUDE_PATH
          $version = if ([IO.Path]::GetExtension($cli) -eq '.js') { & node $cli --version } else { & $cli --version }
          if ($LASTEXITCODE -ne 0) { throw 'Cannot execute the resolved CLI' }
          if (($version -join ' ') -notmatch ([regex]::Escape($env:CLAUDE_TEST_VERSION) + '(\s|$)')) { throw "Unexpected CLI version: $version" }
          "Executable: $cli; version: $version"
          Get-FileHash -Algorithm SHA256 -LiteralPath $cli
          [Environment]::OSVersion.VersionString
          'This hosted runner is not the reported Windows 10 build 19045.' >> $env:GITHUB_STEP_SUMMARY
      - name: Check committed Rust formatting
        working-directory: src-tauri
        run: cargo fmt --all --check
      - name: Capture actual submitted prompts through the production writer
        working-directory: src-tauri
        run: cargo test --locked --lib RealClaude_DevtoolsJsonSubmittedCompletely_001 -- --ignored --test-threads=1 --nocapture
      - name: Strict Rust checks
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Ensure verification did not rewrite tracked files
        run: git diff --exit-code
      - name: Record result boundaries
        if: always()
        shell: pwsh
        run: |
          'Compare the real UserPromptSubmit prompt, not a paste chip or successful pipe write. Synthetic fixtures only; no user clipboard or credentials.' >> $env:GITHUB_STEP_SUMMARY
