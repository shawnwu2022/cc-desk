name: D13 observer isolation
on:
  pull_request:
    paths:
      - 'src-tauri/src/**'
      - 'src-tauri/plugin/**'
      - 'tests/native-cli/observer-core/**'
      - '.github/workflows/d13-observer-core.yml'
permissions:
  contents: read
jobs:
  observer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Test actual production observer, HTTP and reporter
        run: cargo test --locked --manifest-path tests/native-cli/observer-core/Cargo.toml
      - name: Strict observer lint
        run: cargo clippy --locked --manifest-path tests/native-cli/observer-core/Cargo.toml --all-targets -- -D warnings
