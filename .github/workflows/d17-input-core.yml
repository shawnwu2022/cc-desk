name: D17 input staging core
on:
  pull_request:
    paths:
      - 'src-tauri/src/terminal_input.rs'
      - 'src-tauri/src/cli/types.rs'
      - 'tests/native-cli/input-core/**'
      - '.github/workflows/d17-input-core.yml'
permissions:
  contents: read
jobs:
  input:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Test actual production input staging
        run: cargo test --locked --manifest-path tests/native-cli/input-core/Cargo.toml
      - name: Strict input staging lint
        run: cargo clippy --locked --manifest-path tests/native-cli/input-core/Cargo.toml --all-targets -- -D warnings
