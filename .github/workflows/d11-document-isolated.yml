name: Exact canonical cursor style RED (verification only)
on:
  push:
    branches: [verify/packaged-native-84855a84]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cursor-style-red:
    if: github.ref == 'refs/heads/verify/packaged-native-84855a84'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 64d6b1cc626e694eb483b53d44c39f057f3a7122
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: remote
          key: canonical-rgb-terminal
          cache-on-failure: true
      - name: Observe exact cursor style RED assertions
        shell: bash
        run: |
          set -o pipefail
          cargo test --manifest-path remote/Cargo.toml --locked -p cc-desk-remote-terminal --features experimental-emulator --test canonical_cursor_style 2>&1 | tee cursor-style-red.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cursor-style-red-${{ github.run_id }}-${{ github.run_attempt }}
          path: cursor-style-red.log
          if-no-files-found: error
          retention-days: 7
