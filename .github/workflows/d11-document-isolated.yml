name: PR 101 installed diagnostics acceptance
on:
  push:
    branches: [verify/pr101-diagnostics-0727a08c]
permissions:
  contents: read
  actions: read
jobs:
  installed-diagnostics:
    if: github.ref == 'refs/heads/verify/pr101-diagnostics-0727a08c'
    timeout-minutes: 15
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Download pinned verified candidate and smoke receipt
        shell: pwsh
        env:
          ARTIFACT_READER: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{ Authorization = "Bearer $env:ARTIFACT_READER"; Accept = 'application/vnd.github+json' }
          $base = 'https://api.github.com/repos/shawnwu2022/cc-desk/actions/artifacts'
          foreach ($entry in @(
            @{ Id = 14509138179; Name = 'cc-desk-native-v3-test-971eb19a30218c7295be73d48d73fda5db9379c4'; Folder = 'pr101-package'; Sha = '0d32332221587856f7ceddab3e4018d83e5be3b078c7dd891fd42364fe6e3854' },
            @{ Id = 14509570953; Name = 'desktop-webview-smoke-971eb19a30218c7295be73d48d73fda5db9379c4-44481773577-1'; Folder = 'pr101-smoke'; Sha = '045198275fad08a2f0c84633e25be917c8e9bfde24d0e420102db0e094774251' }
          )) {
            $meta = Invoke-RestMethod "$base/$($entry.Id)" -Headers $headers
            if ($meta.expired -or $meta.workflow_run.id -ne 44481773577 -or $meta.workflow_run.head_sha -cne '0727a08c9e963b140bbd014aaf17e2275b8e3358' -or $meta.name -cne $entry.Name) { throw 'Pinned artifact identity mismatch' }
            $file = Join-Path $env:RUNNER_TEMP ($entry.Folder + '.zip')
            Invoke-WebRequest "$base/$($entry.Id)/zip" -Headers $headers -OutFile $file
            if ((Get-FileHash -LiteralPath $file).Hash -ine $entry.Sha) { throw 'Pinned artifact digest mismatch' }
            if ($entry.Id -eq 14509138179) {
              Add-Type -AssemblyName System.IO.Compression.FileSystem
              $zip = [IO.Compression.ZipFile]::OpenRead($file)
              try {
                if (@($zip.Entries | Where-Object FullName -CEQ 'test-package/test-package-manifest.json').Count -ne 1) {
                  throw 'Pinned manifest ZIP entry mismatch'
                }
                Write-Host 'Pinned ZIP entry verified: test-package/test-package-manifest.json'
              } finally { $zip.Dispose() }
            }
            Expand-Archive -LiteralPath $file -DestinationPath (Join-Path $env:RUNNER_TEMP $entry.Folder)
          }
      - name: Verify and launch the exact ordinary NSIS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (!$IsWindows -or $env:RUNNER_ENVIRONMENT -cne 'github-hosted') { throw 'Expected ephemeral hosted Windows' }
          $package = Join-Path $env:RUNNER_TEMP 'pr101-package/test-package'
          $manifest = Get-Content (Join-Path $package 'test-package-manifest.json') -Raw | ConvertFrom-Json
          if ($manifest.sourceCommit -cne '971eb19a30218c7295be73d48d73fda5db9379c4' -or $manifest.workflowRunId -cne '44481773577' -or $manifest.workflowRunAttempt -cne '1' -or $manifest.channel -cne 'test-only' -or $manifest.publishable -ne $false -or $manifest.updaterPublication -ne $false -or $manifest.installerFile -cnotmatch '^CC-Desk-[\w.-]+-setup\.exe$') { throw 'Pinned manifest mismatch' }
          $installer = Join-Path $package $manifest.installerFile
          if ((Get-FileHash -LiteralPath $installer).Hash -ine $manifest.sha256) { throw 'NSIS digest mismatch' }
          $smoke = Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'pr101-smoke/result.json') -Raw | ConvertFrom-Json
          if ($smoke.status -cne 'passed' -or !$smoke.normalExit -or $smoke.sha256 -cnotmatch '^[0-9A-Fa-f]{64}$') { throw 'Missing trusted installed image identity' }
          $target = Join-Path $env:RUNNER_TEMP 'pr101-installed'
          $install = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$target") -WindowStyle Hidden -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw 'NSIS installation failed' }
          $exe = Join-Path $target 'cc-desk.exe'
          if ((Get-FileHash -LiteralPath $exe).Hash -ine $smoke.sha256) { throw 'Installed image differs from pinned smoke' }
          [ordered]@{ packageSource=$manifest.sourceCommit; packageArtifact=14509138179; smokeArtifact=14509570953; installerSha256=$manifest.sha256; exeSha256=$smoke.sha256 } | ConvertTo-Json | Set-Content pr101-identity.json
          Get-ChildItem Env: | Where-Object { $_.Name -cne 'GITHUB_ACTIONS' -and $_.Name -match '^(ACTIONS_|GITHUB_|GH_)|TOKEN|SECRET|API_KEY|PASSWORD|CREDENTIAL' } | ForEach-Object {
            [Environment]::SetEnvironmentVariable($_.Name, $null, 'Process')
          }
          & ./scripts/test-desktop-webview.ps1 -Exe $exe -ActivityDiagnosticsAcceptance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr101-installed-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            pr101-identity.json
            desktop-webview-smoke/result.json
