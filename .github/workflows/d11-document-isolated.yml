name: PR 101 isolated native Claude metadata acceptance
on:
  push:
    branches: [verify/pr101-diagnostics-0727a08c]
permissions:
  contents: read
jobs:
  claude-metadata:
    if: github.repository == 'shawnwu2022/cc-desk' && github.ref == 'refs/heads/verify/pr101-diagnostics-0727a08c'
    timeout-minutes: 25
    runs-on: windows-2022
    env:
      CC_DESK_BUILD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24.18.0'
      - name: Pin official offline Node Claude and SDK bytes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (!$IsWindows -or $env:RUNNER_ENVIRONMENT -cne 'github-hosted') { throw 'Not ephemeral hosted Windows' }
          $dir = Join-Path $env:RUNNER_TEMP 'pr101-official-claude'
          if (Test-Path -LiteralPath $dir) { throw 'Supply dir already exists' }
          New-Item -ItemType Directory $dir | Out-Null
          $node = (Get-Command node.exe -CommandType Application).Source
          if ((Get-FileHash -LiteralPath $node).Hash -ine '9a4eb5f1c29c6a2e93852ead46b999e284a6a5ca8bab4d4e241d587d025a52de') { throw 'Pinned Node bytes unavailable' }
          $registry = 'https://registry.npmjs.org'
          $meta = Invoke-RestMethod "$registry/@anthropic-ai%2fclaude-code-win32-x64/2.1.319"
          $claudeUrl = "$registry/@anthropic-ai/claude-code-win32-x64/-/claude-code-win32-x64-2.1.319.tgz"
          if ($meta.name -cne '@anthropic-ai/claude-code-win32-x64' -or $meta.version -cne '2.1.319' -or $meta.dist.tarball -cne $claudeUrl) { throw 'Official Claude provenance mismatch' }
          function Save-PinnedEntry($url, $integrity, $archive, [string[]]$allowedMembers, $output, $digest) {
            if ($integrity -cnotmatch '^sha512-[A-Za-z0-9+/]{86}==$') { throw 'Package integrity absent' }
            Invoke-WebRequest -MaximumRedirection 0 -Uri $url -OutFile $archive
            $stream = [IO.File]::OpenRead($archive)
            $hasher = [Security.Cryptography.SHA512]::Create()
            try { $value = 'sha512-' + [Convert]::ToBase64String($hasher.ComputeHash($stream)) } finally { $stream.Dispose(); $hasher.Dispose() }
            if ($value -cne $integrity) { throw 'Package integrity mismatch' }
            $entries = @(& tar -tzf $archive)
            if ($LASTEXITCODE -ne 0) { throw 'Package member listing failed' }
            $matchingEntries = @($entries | Where-Object { $allowedMembers -ccontains $_ })
            if ($matchingEntries.Count -ne 1) { throw 'Pinned package member absent or ambiguous' }
            $member = $matchingEntries[0]
            $detail = @(& tar -tvzf $archive -- $member)
            if ($LASTEXITCODE -ne 0 -or $detail.Count -ne 1 -or !$detail[0].StartsWith('-')) { throw 'Package member is not regular' }
            # Native stdout redirection preserves executable bytes without PowerShell text conversion.
            $process = Start-Process -FilePath "$env:SystemRoot\System32\tar.exe" -ArgumentList @('-xOzf', ('"' + $archive + '"'), '--', $member) -RedirectStandardOutput $output -WindowStyle Hidden -Wait -PassThru
            if ($process.ExitCode -ne 0 -or (Get-FileHash -LiteralPath $output).Hash -ine $digest) { throw 'Pinned member bytes unavailable' }
          }
          $claude = Join-Path $dir 'claude.exe'
          $sdk = Join-Path $dir 'sdk.mjs'
          Save-PinnedEntry $claudeUrl $meta.dist.integrity (Join-Path $dir 'claude.tgz') @('package/claude.exe', 'package/bin/claude.exe') $claude '2e055732c9d03d22700d9046251a8370b673607bfcc9e4d16a1b0e8fb1345cbd'
          Save-PinnedEntry "$registry/@anthropic-ai/claude-agent-sdk/-/claude-agent-sdk-0.3.301.tgz" 'sha512-mAe4zIFRL9BejcFHQVc+D0gxrMR/7mDt5GgdekfWB2DNWZebHoeGhgP2R3rZ/BcEZnW10nSGV2IwWyywwZw83Q==' (Join-Path $dir 'sdk.tgz') 'package/sdk.mjs' $sdk '6b963b3eb871949a14392bb35ff970a55e91e2edbe218c61cd9eed60e46cbe45'
          Add-Content -LiteralPath $env:GITHUB_ENV -Value @("CC_DESK_NATIVE_METADATA_NODE=$node", "CC_DESK_NATIVE_METADATA_SDK=$sdk", "CC_DESK_NATIVE_METADATA_HOSTED_CLAUDE=$claude")
      - uses: dtolnay/rust-toolchain@1.98.1
      - name: Prepare repository test toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm ci --ignore-scripts
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run prepare:session-sdk
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run prepare:opencode-archive
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/prepare-conpty.mjs
      - name: Run exact Windows Job owned offline fixture
        working-directory: src-tauri
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $names = @(& cargo test --locked --lib NativeMetadataLive_InstalledClaude_110 -- --ignored --list)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $selected = @($names | ForEach-Object { if ("$_" -cmatch '^([A-Za-z0-9_:]+::NativeMetadataLive_InstalledClaude_110): test$') { $Matches[1] } })
          if ($selected.Count -ne 1) { throw 'Exact native test absent or ambiguous' }
          Get-ChildItem Env: | Where-Object { $_.Name -cne 'GITHUB_ACTIONS' -and $_.Name -match '^(ACTIONS_|GITHUB_|GH_)|TOKEN|SECRET|API_KEY|PASSWORD|CREDENTIAL' } | ForEach-Object {
            [Environment]::SetEnvironmentVariable($_.Name, $null, 'Process')
          }
          $env:CC_DESK_NATIVE_METADATA_LIVE_GO = 'isolated-metadata'
          & cargo test --locked --lib -- $selected[0] --ignored --exact --nocapture
          exit $LASTEXITCODE
