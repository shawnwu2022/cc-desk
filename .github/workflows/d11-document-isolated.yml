name: Reused diagnostic NSIS GUI (verification branch only)
on:
  push:
    branches: [verify/packaged-native-84855a84]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  packaged-native:
    if: github.ref == 'refs/heads/verify/packaged-native-84855a84'
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Download exact existing package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'pr100-input'
          New-Item -ItemType Directory $out | Out-Null
          $headers = @{Authorization="Bearer $env:GH_TOKEN"; Accept='application/vnd.github+json'}
          $metadata = Invoke-RestMethod -Headers $headers https://api.github.com/repos/shawnwu2022/cc-desk/actions/artifacts/14502218312
          if ($metadata.expired -or $metadata.workflow_run.id -ne 44464798890 -or $metadata.name -cne 'diagnostic-nsis-67289549ca38753760eebb6ec2e7094f0faaf1ff-44464798890-1') { throw 'Artifact identity mismatch' }
          $zip = Join-Path $out 'artifact.zip'
          Invoke-WebRequest -Headers $headers https://api.github.com/repos/shawnwu2022/cc-desk/actions/artifacts/14502218312/zip -OutFile $zip
          if ((Get-FileHash $zip).Hash -ine '5df104e8d717aa6352ed84152d596fc86ba65a853389f8147b29f84db2d30fcc') { throw 'Artifact ZIP digest mismatch' }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead($zip)
          try {
            foreach ($entry in $archive.Entries) {
              if ($entry.FullName -match '(^[/\\]|(^|[/\\])\.\.([/\\]|$)|:)' -or (($entry.ExternalAttributes -shr 16) -band 0xF000) -eq 0xA000) { throw 'Unsafe ZIP entry' }
            }
          } finally { $archive.Dispose() }
          Expand-Archive -LiteralPath $zip -DestinationPath (Join-Path $out 'package')
          $installers = @(Get-ChildItem (Join-Path $out 'package') -Recurse -Filter '*setup.exe')
          if ($installers.Count -ne 1 -or (Get-FileHash $installers[0].FullName).Hash -ine '0f0927e3e25afb147a5a339db603ba758382637a3f295024473e054914479bfb') { throw 'Installer digest mismatch' }
      - name: Download pinned official Codex
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'official-codex'
          New-Item -ItemType Directory $dir | Out-Null
          $exe = Join-Path $dir 'codex.exe'
          Invoke-WebRequest 'https://github.com/openai/codex/releases/download/rust-v0.169.1/codex-x86_64-pc-windows-msvc.exe' -OutFile $exe
          if ((Get-Item $exe).Length -ne 382647088 -or (Get-FileHash $exe).Hash -ine 'f76f94d08b0793bfa129ae62c09341ee32ae96d57e69968ae6b8d7c71a20d8c4') { throw 'Official Codex asset digest mismatch' }
      - name: Install exact NSIS and run real GUI acceptance
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GH_TOKEN -or $env:GITHUB_TOKEN) { throw 'Download credentials must not reach product' }
          $installer = @(Get-ChildItem (Join-Path $env:RUNNER_TEMP 'pr100-input/package') -Recurse -Filter '*setup.exe')
          if ($installer.Count -ne 1) { throw 'Installer not unique' }
          $installed = Join-Path $env:RUNNER_TEMP 'pr100-installed'
          $setup = Start-Process -FilePath $installer[0].FullName -ArgumentList "/S /D=$installed" -PassThru -WindowStyle Hidden
          try {
            if (!$setup.WaitForExit(180000)) { $setup.Kill(); $null=$setup.WaitForExit(10000); throw 'Installer timeout' }
            if ($setup.ExitCode -ne 0) { throw 'Installer failed' }
          } finally { $setup.Dispose() }
          $exe = Join-Path $installed 'cc-desk.exe'
          $sha = 'f3a1193dd5a82b020df3d2f4cb2cf170b028795ab126b89b16c9024f83674c48'
          if ((Get-FileHash $exe).Hash -ine $sha) { throw 'Installed product digest mismatch' }
          $runtime = @{
            'conpty.dll'='39fba2713e2495117b1591ae8c32a3b904bea7aa66069cf7815e2844c76d75d8'
            'OpenConsole.exe'='b7fd936c2668b87b9ecf7b3366dc6568afc1c6f981874cba3e955a1c35cf8160'
          }
          foreach ($name in $runtime.Keys) {
            if ((Get-FileHash (Join-Path $installed $name)).Hash -ine $runtime[$name]) { throw 'Installed runtime digest mismatch' }
          }
          [ordered]@{workflowCommit=$env:GITHUB_SHA; artifactId=14502218312; mode='reused-diagnostic-nsis-not-original-pr100'; source='67289549ca38753760eebb6ec2e7094f0faaf1ff'; baseline='84855a84ba08ca97c76567d1857d40bda9a4ff9d'; sourceTree='343ce2064530918d934085e2ccbc6a4637abf2f9'; looseExeSha256='7ac193cd0f555a502ea76c4625ebfd1a2332dc7a95250e0f8f30c7b25a781cd4'; bundleMarker='NSIS uses NSS; loose executable uses UNK'; productSha256=$sha; officialCodexAsset=760864385; published=$false} | ConvertTo-Json | Set-Content packaged-source.json
          & ./scripts/test-desktop-webview.ps1 -Exe $exe -ExpectedSha256 $sha -CanonicalDiagnostic -NativeCodex (Join-Path $env:RUNNER_TEMP 'official-codex/codex.exe')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packaged-pr100-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            packaged-source.json
            desktop-webview-smoke/
          if-no-files-found: error
          retention-days: 7
