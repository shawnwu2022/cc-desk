name: Canonical RGB targeted regression (verification branch only)
on:
  push:
    branches: [verify/packaged-native-84855a84]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  canonical-rgb-red:
    if: github.ref == 'refs/heads/verify/packaged-native-84855a84'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: d6575274c789d7c755f4eefebc08c11a6b932e5e
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: remote
          key: canonical-rgb-targeted
          cache-on-failure: true
      - name: Observe RED with unchanged product implementation
        shell: bash
        env:
          CARGO_BUILD_JOBS: '2'
        run: |
          set -o pipefail
          git rev-parse HEAD | tee rgb-source.txt
          cargo test --manifest-path remote/Cargo.toml --locked -p cc-desk-remote-terminal --features experimental-emulator --test canonical_rgb -- --test-threads=1 2>&1 | tee rgb-tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canonical-rgb-red-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            rgb-source.txt
            rgb-tests.log
          if-no-files-found: error
          retention-days: 7
