name: CC Desk Codex native history rename (Linux only)
on:
  push:
    branches: [verify/028-codex-native-linux-20261121]
    paths: [.github/workflows/028-codex-native-linux.yml]
permissions:
  contents: read
jobs:
  isolated-native-codex:
    if: >-
      github.repository == 'shawnwu2022/cc-desk' &&
      github.ref == 'refs/heads/verify/028-codex-native-linux-20261121' &&
      github.event.created && !github.event.deleted && !github.event.forced &&
      github.event.before == '0000000000000000000000000000000000000000' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
          sparse-checkout: |
            .github/isolated-tests/cc-desk-linux-native
            .github/workflows/028-codex-native-linux.yml
          sparse-checkout-cone-mode: false
      - name: Verify exact scratch parent, files and fixture digest
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          EXPECTED_WORKFLOW_HEAD: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          helper=.github/isolated-tests/cc-desk-linux-native/verify.py
          workflow=.github/workflows/028-codex-native-linux.yml
          head="$(git rev-parse HEAD)"
          test "$head" = "$EXPECTED_HEAD"
          test "$head" = "$EXPECTED_WORKFLOW_HEAD"
          test "$(git rev-list --parents -n 1 HEAD)" = "$head 4f70aec347b99227d4412f88221b54ecd52df8cc"
          expected="$(printf 'A\t%s\nA\t%s\n' "$helper" "$workflow" | LC_ALL=C sort)"
          actual="$(git diff-tree --no-commit-id --no-renames --name-status -r HEAD | LC_ALL=C sort)"
          test "$actual" = "$expected"
          test -f "$helper"
          test ! -L "$helper"
          printf '%s  %s\n' '35ee055f648a52f0df16976eaf6e1cbf3e96636adb1a2b73de379a334c57edba' "$helper" | sha256sum -c --status
          /usr/bin/python3 -I -c 'import ast, pathlib, sys; ast.parse(pathlib.Path(sys.argv[1]).read_text())' "$helper"
      - name: Fetch exact public OpenAI Linux archive, no tokens
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/curl -qfsS --proto '=https' --max-time 100 --max-filesize 167001033 \
            'https://registry.npmjs.org/@openai/codex/-/codex-0.169.1-linux-x64.tgz' \
            --output "$RUNNER_TEMP/ccdesk-codex-0.169.1-linux-x64.tgz"
      - name: Verify archive and run one synthetic rename and fresh native readback
        shell: bash
        run: |
          /usr/bin/python3 -I .github/isolated-tests/cc-desk-linux-native/verify.py "$RUNNER_TEMP/ccdesk-codex-0.169.1-linux-x64.tgz"
