# Local review only; entirely synthetic empty media, no global apt/dpkg installation.
name: Synthetic empty-disk KVM firmware diagnostic
on:
  push:
    branches: [verify/028-x64-guest-firmware-synthetic-20261121]
    paths: [.github/workflows/028-x64-guest-firmware-synthetic.yml]
permissions: {}
jobs:
  firmware:
    if: github.repository == 'shawnwu2022/cc-desk' && github.ref == 'refs/heads/verify/028-x64-guest-firmware-synthetic-20261121' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Isolate first QEMU and private QMP failure using empty synthetic disk
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          stage=runner_admission
          fail() { printf '%s\n' 'SYNTHETIC_BOOT_PATH_PASS=false' "SYNTHETIC_BOOT_PATH_STOP_STAGE=$stage"; exit 1; }
          [ "${RUNNER_ENVIRONMENT:-}" = github-hosted ] || fail
          [ "$(/usr/bin/uname -m)" = x86_64 ] || fail
          [ "$(/usr/bin/lsb_release -sc)" = noble ] || fail
          for var in HTTPS_PROXY HTTP_PROXY ALL_PROXY https_proxy http_proxy all_proxy; do
            [ -z "${!var:-}" ] || fail
          done
          umask 077
          work=$(/usr/bin/mktemp -d /tmp/ccdesk-firmware-XXXXXXXX) || fail
          trap '/usr/bin/rm -f -- "$work"/{synthetic.vhdx,overlay.qcow2,OVMF_VARS_4M.fd,qmp.sock,local.ppm}' EXIT
          disk=$(/usr/bin/df -Pk -- "$work" | /usr/bin/awk 'NR==2 {print $4}') || fail
          [[ $disk =~ ^[0-9]+$ ]] && (( disk >= 24 * 1024 * 1024 )) || fail
          uid=$(/usr/bin/id -u) || fail
          gid=$(/usr/bin/id -g) || fail
          kvm_record=$(/usr/bin/getent group kvm) || fail
          IFS=: read -r group _ kvm _ <<<"$kvm_record"
          [[ $uid =~ ^[1-9][0-9]*$ && $gid =~ ^[1-9][0-9]*$ && $kvm =~ ^[1-9][0-9]*$ ]] || fail
          [ "$group" = kvm ] && [ "$kvm" != "$gid" ] && [ -c /dev/kvm ] && [ ! -L /dev/kvm ] || fail
          read -r dg mode major minor <<<"$(/usr/bin/stat -c '%g %a %t %T' -- /dev/kvm)"
          [[ $dg = "$kvm" && $mode =~ ^[0-7]{3}$ && $major = a && $minor = e8 ]] || fail
          (( (8#$mode & 060) == 060 )) || fail
          # Unprivileged private Apt state and authenticated download only.
          # Snapshot dpkg status for dependency resolution: never alter dpkg,
          # invoke maintainer scripts/udev hooks or add host system settings.
          ar="$work/apt"
          rt="$work/runtime"
          /usr/bin/mkdir -p -- "$ar"/{empty,lists/partial,archives/partial,preferences.d} "$rt" || fail
          /usr/bin/cp -- /var/lib/dpkg/status "$ar/status" || fail
          [ -f /usr/share/keyrings/ubuntu-archive-keyring.gpg ] || fail
          [ "$(/usr/bin/stat -c '%u' -- /usr/share/keyrings/ubuntu-archive-keyring.gpg)" = 0 ] || fail
          cat > "$ar/ubuntu.sources" <<'APT'
          Types: deb
          URIs: https://archive.ubuntu.com/ubuntu
          Suites: noble noble-updates
          Components: main universe
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

          Types: deb
          URIs: https://security.ubuntu.com/ubuntu
          Suites: noble-security
          Components: main universe
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          APT
          cat > "$ar/config" <<APT
          Dir::Etc::main "/dev/null";
          Dir::Etc::parts "$ar/empty";
          Dir::Etc::sourcelist "$ar/ubuntu.sources";
          Dir::Etc::sourceparts "$ar/empty";
          Dir::Etc::preferences "$ar/empty/preferences";
          Dir::Etc::preferencesparts "$ar/preferences.d";
          Dir::Etc::netrc "/dev/null";
          Dir::Etc::netrcparts "$ar/empty";
          Dir::State "$ar";
          Dir::State::status "$ar/status";
          Dir::State::lists "$ar/lists";
          Dir::Cache "$ar";
          Dir::Cache::archives "$ar/archives";
          Dir::Cache::pkgcache "";
          Dir::Cache::srcpkgcache "";
          Acquire::Languages "none";
          Acquire::Retries "0";
          Acquire::https::AllowRedirect "false";
          Acquire::AllowInsecureRepositories "false";
          APT::Get::AllowUnauthenticated "false";
          Debug::NoLocking "true";
          APT
          # Use only the private config from process start; no inherited Apt
          # settings or host hooks. This never runs with sudo/root.
          apt_do() {
            /usr/bin/timeout -k 2s 160s /usr/bin/env -i PATH=/usr/bin:/bin HOME="$work" \
              APT_CONFIG="$ar/config" "$@"
          }
          stage=apt_index
          apt_do /usr/bin/apt-get update >/dev/null 2>&1 || fail
          stage=apt_download
          packages=(qemu-system-x86 qemu-system-common qemu-system-data qemu-utils ovmf)
          apt_do /usr/bin/apt-get --yes --no-remove --reinstall --no-install-recommends \
            --download-only install "${packages[@]}" >/dev/null 2>&1 || fail
          declare -A authenticated=()
          have=0
          stage=apt_extraction
          for deb in "$ar"/archives/*.deb; do
            [ -f "$deb" ] && [ ! -L "$deb" ] || fail
            pkg=$(/usr/bin/dpkg-deb -f "$deb" Package) || fail
            ver=$(/usr/bin/dpkg-deb -f "$deb" Version) || fail
            architecture=$(/usr/bin/dpkg-deb -f "$deb" Architecture) || fail
            [[ $pkg =~ ^[a-z0-9][a-z0-9+.-]+$ && $ver =~ ^[a-zA-Z0-9:.+~_-]+$ &&
               ($architecture = amd64 || $architecture = all) && -z "${authenticated[$pkg]:-}" ]] || fail
            expected=$(/usr/bin/sha256sum -- "$deb") || fail
            # apt already authenticates acquired packages; independently tie
            # each actual archive to SHA256 from an authenticated index.
            apt_do /usr/bin/apt-cache show "$pkg=$ver" 2>/dev/null | /usr/bin/awk \
              -v hash="${expected%% *}" '$1=="SHA256:" && $2==hash {ok=1} END {exit !ok}' || fail
            /usr/bin/dpkg-deb -x -- "$deb" "$rt" >/dev/null 2>&1 || fail
            authenticated[$pkg]=1
            (( have+=1 ))
            (( have<=100 )) || fail
          done
          for pkg in "${packages[@]}"; do [ "${authenticated[$pkg]:-}" = 1 ] || fail; done
          stage=runtime_abi
          qemu="$rt/usr/bin/qemu-system-x86_64"
          qimg="$rt/usr/bin/qemu-img"
          qdata="$rt/usr/share/qemu"
          ovmf="$rt/usr/share/OVMF"
          lib="$rt/usr/lib/x86_64-linux-gnu:$rt/lib/x86_64-linux-gnu"
          for path in "$qemu" "$qimg" "$qdata" "$ovmf" "$ovmf/OVMF_CODE_4M.fd" "$ovmf/OVMF_VARS_4M.fd"; do
            [ -e "$path" ] && [[ "$(/usr/bin/realpath -e -- "$path")" == "$rt/"* ]] || fail
          done
          [ -x "$qemu" ] && [ -x "$qimg" ] || fail
          # Private direct ELF resolution; no credential or ambient loader env.
          # Same-distro OS already installed libs may be used only from protected
          # system library paths. Actual module/firmware lookup must still pass.
          for exe in "$qemu" "$qimg"; do
            /usr/bin/env -i /lib64/ld-linux-x86-64.so.2 --library-path "$lib" --list "$exe" 2>/dev/null |
              /usr/bin/python3 -I -S -c 'import os,sys; from pathlib import Path; root=Path(sys.argv[1]); system=Path("/usr/lib/x86_64-linux-gnu"); lines=[l.strip() for l in sys.stdin if l.strip()]; assert lines; paths=[]; exec("for line in lines:\n if line.startswith(\"linux-vdso\"): continue\n assert \"not found\" not in line\n value=line.split(\" => \",1)[-1].split()[0]\n p=Path(value).resolve(strict=True)\n assert p.is_file()\n assert p.is_relative_to(root) or (p.is_relative_to(system) and p.stat().st_uid==0 and not p.stat().st_mode & 0o022)\n paths.append(p)"); assert paths' "$rt" >/dev/null 2>&1 || fail
          done
          printf '%s\n' 'SIGNED_PACKAGE_STAGE_COMPLETE=true'
          qemu_env=(/usr/bin/env -i "HOME=$work" "LD_LIBRARY_PATH=$lib" "QEMU_MODULE_DIR=$rt/usr/lib/x86_64-linux-gnu/qemu")
          cd -- "$work"
          stage=synthetic_vhdx_create
          # Exercise the same VHDX → explicit QCOW2 chain without Windows media.
          "${qemu_env[@]}" "$qimg" create -f vhdx synthetic.vhdx 64M >/dev/null 2>&1 || fail
          stage=synthetic_overlay_create
          "${qemu_env[@]}" "$qimg" create -f qcow2 overlay.qcow2 64M >/dev/null 2>&1 || fail
          stage=qemu_readonly_inputs
          /usr/bin/chmod 0400 synthetic.vhdx || fail
          /usr/bin/cp -- "$ovmf/OVMF_VARS_4M.fd" OVMF_VARS_4M.fd || fail
          /usr/bin/awk '/^MemAvailable:/ {ok = ($2 >= 5*1024*1024)} END {exit !ok}' /proc/meminfo || fail
          stage=qemu_diagnostic
          /usr/bin/timeout --signal=TERM --kill-after=3s 75s \
              /usr/bin/python3 -I -S - "$uid" "$gid" "$kvm" "$work" 2>/dev/null <<'PY' || fail
          import errno
          import json
          import os
          import socket
          import stat
          import struct
          import subprocess
          import sys
          import threading
          import time
          from pathlib import Path

          class Blocked(RuntimeError):
              pass

          phase="launch"
          def require(ok, code):
              if not ok:
                  raise Blocked(code)

          def startup_reason(data):
              # Externally only these constants; never print the private stderr.
              low=data.lower()
              if b"permission denied" in low or b"operation not permitted" in low:
                  return "permission"
              if b"kvm" in low and (b"failed" in low or b"not available" in low):
                  return "kvm_setup"
              if b"firmware" in low or b"ovmf" in low or b"bios" in low or b"pflash" in low:
                  return "firmware_or_pflash"
              if b"vga" in low:
                  return "vga_device"
              if b"ide.0" in low or b"drive" in low or b"blockdev" in low or b"vhdx" in low:
                  return "disk_or_controller"
              if b"error while loading shared libraries" in low or b"cannot open shared object file" in low:
                  return "dynamic_library"
              if b"invalid option" in low or b"unsupported" in low or b"parameter" in low:
                  return "option_or_parameter"
              return "early_exit_other"

          def qmp_error_kind(err):
              if not isinstance(err,dict):
                  return "qmp_shape"
              if err.get("class")=="CommandNotFound":
                  return "qmp_unknown_command"
              msg=str(err.get("desc","")).lower()
              if err.get("class") in ("InvalidParameter","InvalidParameterType","InvalidParameterValue") \
                 or ("parameter" in msg and any(k in msg for k in ("invalid","unexpected","missing"))):
                  return "qmp_invalid_arguments"
              return "qmp_command_rejected"

          uid,gid,kvm=map(int,sys.argv[1:4])
          work=Path(sys.argv[4])
          runtime=work/"runtime"
          ovmf=runtime/"usr/share/OVMF"
          qemu=runtime/"usr/bin/qemu-system-x86_64"
          lib=f"{runtime}/usr/lib/x86_64-linux-gnu:{runtime}/lib/x86_64-linux-gnu"
          modules=runtime/"usr/lib/x86_64-linux-gnu/qemu"
          qmp=work/"qmp.sock"
          def node(**data):
              return json.dumps(data,separators=(",",":"))
          def proc_facts(pid):
              p=Path("/proc")/str(pid)
              fields=dict(line.split(":",1) for line in (p/"status").read_text().splitlines() if ":" in line)
              require(fields["Uid"].split()==[str(uid)]*4 and fields["Gid"].split()==[str(gid)]*4,"process_uid_gid")
              require(fields["Groups"].split()==[str(kvm)] and fields["NoNewPrivs"].strip()=="1","process_groups_nnp")
              require(all(int(fields[k].strip(),16)==0 for k in ("CapEff","CapBnd","CapPrm","CapInh","CapAmb")),"process_capabilities")
              fds=set()
              for fd in (p/"fd").iterdir():
                  try: link=os.readlink(fd)
                  except FileNotFoundError: continue
                  if link.startswith("socket:["): fds.add(link[8:-1])
              for kind in ("tcp","tcp6","udp","udp6","raw","raw6"):
                  table=p/"net"/kind
                  if table.exists():
                      for line in table.read_text().splitlines()[1:]:
                          require(line.split()[9] not in fds,"inet_socket_present")

          child=None
          conn=None
          thread=None
          stderr=bytearray()
          outcome="ok"
          try:
              require(stat.S_IMODE(work.stat().st_mode)==0o700 and work.stat().st_uid==uid,"private_directory")
              argv=[
                "/usr/bin/sudo","-n","--","/usr/bin/setpriv",
                f"--reuid={uid}",f"--regid={gid}",f"--groups={kvm}",
                "--inh-caps=-all","--ambient-caps=-all","--bounding-set=-all","--no-new-privs","--reset-env","--",
                "/usr/bin/env","-i",f"HOME={work}",f"LD_LIBRARY_PATH={lib}",f"QEMU_MODULE_DIR={modules}",
                "/usr/bin/timeout","--signal=TERM","--kill-after=2s","45s",
                "/usr/bin/prlimit","--fsize=2147483648:2147483648","--",
                str(qemu),"-L",str(runtime/"usr/share/qemu"),"-no-user-config","-nodefaults","-S",
                "-machine","q35,accel=kvm","-cpu","host","-m","4096","-smp","2",
                "-display","none","-device","VGA","-nic","none","-monitor","none",
                "-serial","none","-parallel","none","-no-reboot",
                "-qmp",f"unix:{qmp},server=on,wait=off",
                "-drive",f"if=pflash,format=raw,readonly=on,file={ovmf}/OVMF_CODE_4M.fd",
                "-drive","if=pflash,format=raw,file=OVMF_VARS_4M.fd",
                "-blockdev",node(driver="file",filename="synthetic.vhdx",**{"node-name":"source","read-only":True}),
                "-blockdev",node(driver="vhdx",file="source",**{"node-name":"base","read-only":True}),
                "-blockdev",node(driver="file",filename="overlay.qcow2",**{"node-name":"scratch-file"}),
                "-blockdev",node(driver="qcow2",file="scratch-file",backing="base",**{"node-name":"scratch"}),
                "-device","ide-hd,drive=scratch,bus=ide.0"]
              child=subprocess.Popen(argv,cwd=work,stdin=subprocess.DEVNULL,stdout=subprocess.DEVNULL,stderr=subprocess.PIPE)
              def drain():
                  while True:
                      chunk=child.stderr.read(1024)
                      if not chunk: break
                      stderr.extend(chunk[:max(0,8192-len(stderr))])
              thread=threading.Thread(target=drain,daemon=True)
              thread.start()
              phase="private_socket"
              deadline=time.monotonic()+17
              while True:
                  if child.poll() is not None:
                      thread.join(timeout=1)
                      phase="early_launch_exit"
                      raise Blocked(startup_reason(stderr))
                  require(time.monotonic()<deadline,"socket_deadline")
                  if not qmp.exists():
                      time.sleep(.1)
                      continue
                  mode=qmp.lstat()
                  require(stat.S_ISSOCK(mode.st_mode) and mode.st_uid==uid,"socket_type_owner")
                  attempt=socket.socket(socket.AF_UNIX)
                  attempt.settimeout(3)
                  try: attempt.connect(str(qmp))
                  except OSError as e:
                      attempt.close()
                      if e.errno not in (errno.ECONNREFUSED,errno.ENOENT): raise
                      time.sleep(.1)
                      continue
                  conn=attempt
                  break
              phase="peer_credentials"
              pid, peer_uid, peer_gid=struct.unpack("3i",conn.getsockopt(socket.SOL_SOCKET,socket.SO_PEERCRED,12))
              require(pid>1 and peer_uid==uid and peer_gid==gid,"peer_credentials")
              phase="process_facts"
              proc_facts(pid)
              reader=conn.makefile("rb")
              def read():
                  data=reader.readline(262144)
                  require(bool(data) and data.endswith(b"\n"),"qmp_eof_or_oversized")
                  result=json.loads(data)
                  require(isinstance(result,dict),"qmp_shape")
                  return result
              phase="qmp_greeting"
              require("QMP" in read(),"qmp_shape")
              seq=0
              def call(name,args=None):
                  global seq
                  seq+=1
                  command={"execute":name,"id":seq}
                  if args is not None: command["arguments"]=args
                  conn.sendall(json.dumps(command).encode()+b"\n")
                  for _ in range(20):
                      answer=read()
                      if answer.get("id")!=seq: continue
                      if "error" in answer: raise Blocked(qmp_error_kind(answer["error"]))
                      require("return" in answer,"qmp_shape")
                      return answer["return"]
                  raise Blocked("qmp_response_id")

              phase="qmp_capabilities"
              call("qmp_capabilities")
              phase="kvm_state"
              require(call("query-kvm")=={"enabled":True,"present":True},"kvm_not_active")
              phase="prelaunch_state"
              require(call("query-status")["status"]=="prelaunch","unexpected_pause_state")
              def pci_check(pci):
                  def visit(bus):
                      for d in bus["devices"]:
                          require(d["class_info"]["class"]>>8!=2,"guest_nic_present")
                          if "pci_bridge" in d:
                              visit({"devices":d["pci_bridge"].get("devices",[])})
                  require(pci,"pci_missing")
                  for row in pci: visit(row)
                  require(any(d["class_info"]["class"]==0x300 for row in pci for d in row["devices"]),"vga_missing")
              def network_observe():
                  global phase
                  phase="qmp_pci"
                  pci_check(call("query-pci"))
                  phase="qmp_rx_filter"
                  require(call("query-rx-filter")==[],"guest_rx_filter_present")
                  phase="qmp_inventory"
                  require(call("human-monitor-command",{"command-line":"info network"}).strip()=="","guest_network_present")
              network_observe()
              phase="vcpu_counter"
              require(len(call("query-cpus-fast"))==2,"wrong_vcpu_count")
              phase="continue"
              call("cont")
              require(call("query-status")["running"] is True,"not_running")
              time.sleep(1)
              phase="stop"
              call("stop")
              require(call("query-status")["running"] is False,"not_stopped")
              phase="process_facts_after"
              proc_facts(pid)
              network_observe()
              phase="close"
              call("quit")
              require(child.wait(timeout=8)==0,"nonzero_exit")
              phase="complete"
          except Blocked as e:
              outcome=e.args[0]
          except PermissionError:
              outcome="permission"
          except (TimeoutError,subprocess.TimeoutExpired):
              outcome="deadline"
          except OSError:
              outcome="os_error"
          except (KeyError,TypeError,ValueError):
              outcome="shape_or_data"
          finally:
              if conn is not None: conn.close()
              if child is not None and child.poll() is None:
                  child.terminate()
                  try: child.wait(timeout=5)
                  except subprocess.TimeoutExpired:
                      child.kill()
                      try: child.wait(timeout=5)
                      except subprocess.TimeoutExpired:
                          phase="close"
                          outcome="cleanup_deadline"
          print("QEMU_DIAGNOSTIC_PHASE="+phase)
          print("QEMU_DIAGNOSTIC_RESULT="+outcome)
          sys.exit(0 if outcome=="ok" and phase=="complete" else 1)
          PY
          printf '%s\n' 'SYNTHETIC_BOOT_PATH_PASS=true' 'NO_WINDOWS_MEDIA=true' 'GUEST_INPUT_SENT=false'
