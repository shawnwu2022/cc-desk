              $r.stage='expand-exact-disposable-project'
              $expand=Find-Scoped $project 'Expand' ([System.Windows.Automation.ControlType]::Button)
              $collapse=Find-Scoped $project 'Collapse' ([System.Windows.Automation.ControlType]::Button)
