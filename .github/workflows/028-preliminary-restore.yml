              $null=Wait-Observed { -not (Find-Control @('Session actions') ([System.Windows.Automation.ControlType]::Menu)) } 'row menu closed after copy'
          }
          function Test-ExactActiveNavigation {
              $r=$result.codexHistory
              $r.stage='readonly-native-fixture-preflight'
              $baseline=& (Join-Path $PSScriptRoot 'pr101-codex-history-fixture.ps1') -Codex $FixtureCodex -ReadOnlyExisting $fixture -ObserveRename
              if (!$baseline.sameId -or !$baseline.sameCwd -or $baseline.expectedName -or !$baseline.listsExact) { throw 'Independent native fixture adoption or unmodified name not established' }
              $r.nativePreflight=$true
              $r.stage='locate-exact-sessions-tree'
              $tree=Wait-Observed { Find-Control @('Sessions') ([System.Windows.Automation.ControlType]::Tree) } 'unique visible workspace Sessions tree'
              $r.sessionsTreeObserved=$true
              $r.stage='identify-unique-disposable-project'
