name: 0.28 preliminary pinned installed active navigation
on:
  push:
    branches: [verify/028-preliminary-restore-20261120]
permissions:
  contents: read
  actions: read
jobs:
  installed-active-navigation:
    if: github.repository == 'shawnwu2022/cc-desk' && github.ref == 'refs/heads/verify/028-preliminary-restore-20261120' && github.run_attempt == 1
    timeout-minutes: 15
    runs-on: windows-2022
    steps:
      - name: Download pinned verified candidate and smoke receipt
        shell: pwsh
        env:
          ARTIFACT_READER: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{ Authorization = "Bearer $env:ARTIFACT_READER"; Accept = 'application/vnd.github+json' }
          $base = 'https://api.github.com/repos/shawnwu2022/cc-desk/actions/artifacts'
          foreach ($entry in @(
            @{ Id = 14537417451; Name = 'cc-desk-native-v3-test-cbe2aca540d6097a6b0cebe7747f3b3dad8d439f'; Folder = 'pr101-package'; Sha = 'ae31e711fd6b1f55579aeac2de2a1e9fd0a928281c128c0d5da4ee73c2c6a1c2' },
            @{ Id = 14538565669; Name = 'desktop-webview-smoke-cbe2aca540d6097a6b0cebe7747f3b3dad8d439f-44538325396-1'; Folder = 'pr101-smoke'; Sha = '3c4bef1e28897e26fd7336aaa08691445849cf0b5d756764a2bd2fb76f5f68b3' }
          )) {
            $meta = Invoke-RestMethod "$base/$($entry.Id)" -Headers $headers
            if ($meta.expired -or $meta.workflow_run.id -ne 44538325396 -or $meta.workflow_run.head_sha -cne 'cf847b4dc1993b7b58c192357cc79df7629bf560' -or $meta.name -cne $entry.Name) { throw 'Pinned artifact identity mismatch' }
            $file = Join-Path $env:RUNNER_TEMP ($entry.Folder + '.zip')
            Invoke-WebRequest "$base/$($entry.Id)/zip" -Headers $headers -OutFile $file
            if ((Get-FileHash -LiteralPath $file).Hash -ine $entry.Sha) { throw 'Pinned artifact digest mismatch' }
            if ($entry.Id -eq 14537417451) {
              Add-Type -AssemblyName System.IO.Compression.FileSystem
              $zip = [IO.Compression.ZipFile]::OpenRead($file)
              try {
                if (@($zip.Entries | Where-Object FullName -CEQ 'test-package/test-package-manifest.json').Count -ne 1) {
                  throw 'Pinned manifest ZIP entry mismatch'
                }
                Write-Host 'Pinned ZIP entry verified: test-package/test-package-manifest.json'
              } finally { $zip.Dispose() }
            }
            Expand-Archive -LiteralPath $file -DestinationPath (Join-Path $env:RUNNER_TEMP $entry.Folder)
          }
      - name: Download pinned official Codex
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'official-codex'
          New-Item -ItemType Directory $dir | Out-Null
          # A lone EXE is not the complete official runtime supply. Preserve the published vendor layout.
          $archive = Join-Path $dir 'codex-0.169.1-win32-x64.tgz'
          Invoke-WebRequest 'https://registry.npmjs.org/@openai/codex/-/codex-0.169.1-win32-x64.tgz' -OutFile $archive
          $expectedIntegrity = 'fImXWqxwxqHh9+FhJWsRRFiBzgBrSeN1bYTvtGZtUKGTPzHefYAL1agmlf5XScfwY5i5pHsExfdhFekzRBbqIw=='
          $stream = [IO.File]::OpenRead($archive)
          $hasher = [Security.Cryptography.SHA512]::Create()
          try { $actualIntegrity = [Convert]::ToBase64String($hasher.ComputeHash($stream)) } finally { $stream.Dispose(); $hasher.Dispose() }
          if ($actualIntegrity -cne $expectedIntegrity) { throw 'Official platform package integrity mismatch' }
          $names = @(& tar -tzf $archive)
          if ($LASTEXITCODE -ne 0) { throw 'Platform archive listing failed' }
          $details = @(& tar -tvzf $archive)
          if ($LASTEXITCODE -ne 0 -or $names.Count -ne 47 -or $details.Count -ne 47) { throw 'Platform archive entries mismatch' }
          foreach ($name in $names) {
            if (!$name.StartsWith('package/') -or $name -match '(^/|\\|:|(^|/)\.\.(/|$))') { throw 'Unsafe platform archive path' }
          }
          foreach ($entry in $details) { if ($entry[0] -ne '-') { throw 'Platform archive contains nonregular entry' } }
          $extract = Join-Path $dir 'extracted'
          New-Item -ItemType Directory $extract | Out-Null
          & tar -xzf $archive -C $extract
          if ($LASTEXITCODE -ne 0) { throw 'Platform archive extraction failed' }
          if (@(Get-ChildItem $extract -Recurse | Where-Object { $_.Attributes -band [IO.FileAttributes]::ReparsePoint }).Count) { throw 'Platform reparse point rejected' }
          $files = @(Get-ChildItem $extract -Recurse -File)
          if ($files.Count -ne 47 -or ($files | Measure-Object Length -Sum).Sum -ne 515292799) { throw 'Platform file set mismatch' }
          $inventory = @($files | ForEach-Object { [ordered]@{path=$_.FullName.Substring($extract.Length+1).Replace('\','/'); bytes=$_.Length; sha256=(Get-FileHash $_.FullName).Hash.ToLowerInvariant()} })
          [ordered]@{package='@openai/codex'; version='0.169.1-win32-x64'; integrity="sha512-$expectedIntegrity"; archiveSha256=(Get-FileHash $archive).Hash; source='official npm platform package'; files=$inventory} | ConvertTo-Json -Depth 5 | Set-Content codex-supply.json
          $exe = Join-Path $extract 'package/vendor/x86_64-pc-windows-msvc/bin/codex.exe'
          if ((Get-Item $exe).Length -ne 382647088 -or (Get-FileHash $exe).Hash -ine 'f76f94d08b0793bfa129ae62c09341ee32ae96d57e69968ae6b8d7c71a20d8c4') { throw 'Official Codex asset digest mismatch' }
      - name: Install pinned NSIS and verify launcher identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (!$IsWindows -or $env:RUNNER_ENVIRONMENT -cne 'github-hosted') { throw 'Expected ephemeral hosted Windows' }
          $package = Join-Path $env:RUNNER_TEMP 'pr101-package/test-package'
          if ((Get-FileHash -LiteralPath (Join-Path $package 'test-package-manifest.json')).Hash -ine 'fb879d1cac17723379097ab6bb596dbb6bfb345f020b271a22d3917ce2c1df14') { throw 'Manifest bytes differ from reviewed receipt' }
          $manifest = Get-Content (Join-Path $package 'test-package-manifest.json') -Raw | ConvertFrom-Json
          if ($manifest.sourceCommit -cne 'cbe2aca540d6097a6b0cebe7747f3b3dad8d439f' -or $manifest.workflowRunId -cne '44538325396' -or $manifest.workflowRunAttempt -cne '1' -or $manifest.channel -cne 'test-only' -or $manifest.publishable -ne $false -or $manifest.updaterPublication -ne $false -or $manifest.installerFile -cnotmatch '^CC-Desk-[\w.-]+-setup\.exe$') { throw 'Pinned manifest mismatch' }
          $installer = Join-Path $package $manifest.installerFile
          if ((Get-FileHash -LiteralPath $installer).Hash -ine $manifest.sha256) { throw 'NSIS digest mismatch' }
          $smoke = Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'pr101-smoke/result.json') -Raw | ConvertFrom-Json
          if ($smoke.sha256 -ine '6b63e56b7f675a5680ae4115d3fe58aed130f1b5f503c515b154f7079efb4b3f' -or $smoke.status -cne 'passed' -or !$smoke.normalExit -or $smoke.sha256 -cnotmatch '^[0-9A-Fa-f]{64}$') { throw 'Missing trusted installed image identity' }
          $target = Join-Path $env:RUNNER_TEMP 'pr101-installed'
          $install = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$target") -WindowStyle Hidden -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw 'NSIS installation failed' }
          $exe = Join-Path $target 'cc-desk.exe'
          if ((Get-FileHash -LiteralPath $exe).Hash -ine $smoke.sha256) { throw 'Installed image differs from pinned smoke' }
          [ordered]@{ mainAnchor='04a2f0cedc8e7acc080e8736723c6e8799127f58'; guiHarnessBaseline='71486c471394328b954a291dae200ae70b998cdd'; fixtureProbeBaseline='3c014ac4a9c9732f4d11ddf060587424cb2456cb'; candidateTree='933bae502bb1e262e6f0be2cd0bb600cb8992b8a'; prHead='cf847b4dc1993b7b58c192357cc79df7629bf560'; productSource='cbe2aca540d6097a6b0cebe7747f3b3dad8d439f'; preliminaryOnly=$true; exercise='non-archived-codex-history-navigation'; priorRestoreRun=44751032368; packageSource=$manifest.sourceCommit; packageArtifact=14537417451; smokeArtifact=14538565669; installerSha256=$manifest.sha256; exeSha256=$smoke.sha256 } | ConvertTo-Json | Set-Content pr101-identity.json
          $exe | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'verified-image.txt')

      - name: Verify one synthetic active row and UUID through installed GUI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (!$IsWindows -or $env:RUNNER_ENVIRONMENT -cne 'github-hosted') { throw 'Expected ephemeral hosted Windows' }
          $scriptRoot = Join-Path $env:RUNNER_TEMP 'scratch-navigation-harness'
          New-Item -ItemType Directory -Path $scriptRoot -ErrorAction Stop | Out-Null
          @'
          # Disposable Windows runner only. The real Codex executable performs a read-only protocol check.
          param(
              [Parameter(Mandatory=$true)][string]$Codex, [psobject]$ReadOnlyExisting, [switch]$ObserveRename
          )
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          if (!$IsWindows -or $env:GITHUB_ACTIONS -cne 'true' -or $env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or !$env:RUNNER_TEMP) {
              throw 'BLOCKED_EXTERNAL_TARGET: ephemeral hosted Windows required'
          }
          $temp = (Get-Item -LiteralPath $env:RUNNER_TEMP).FullName.TrimEnd('\') + '\'
          $image = (Get-Item -LiteralPath $Codex -ErrorAction Stop).FullName
          if (!$image.StartsWith($temp, [StringComparison]::OrdinalIgnoreCase) -or
              (Get-FileHash -LiteralPath $image).Hash -ine 'f76f94d08b0793bfa129ae62c09341ee32ae96d57e69968ae6b8d7c71a20d8c4') {
              throw 'Pinned official Codex image mismatch'
          }
          if ($ReadOnlyExisting) {
              $codexHome=[IO.Path]::GetFullPath($ReadOnlyExisting.Home)
              $project=[IO.Path]::GetFullPath($ReadOnlyExisting.Project)
              $root=Split-Path $codexHome -Parent
              if (!$root.StartsWith($temp,[StringComparison]::OrdinalIgnoreCase) -or
                  (Split-Path $root -Leaf) -cnotmatch '^pr101-history-[0-9a-f]{32}$' -or
                  $codexHome -cne (Join-Path $root 'codex-home') -or $project -cne (Join-Path $root 'project') -or
                  ($ObserveRename -and $ReadOnlyExisting.SessionId -cnotmatch '^[a-f0-9-]{36}$') -or
                  $ReadOnlyExisting.ArchivedId -cnotmatch '^[a-f0-9-]{36}$') { throw 'Read-only fixture ownership is not pinned' }
              foreach($currentPath in @($root,$codexHome,$project)){
                  $owned=Get-Item -LiteralPath $currentPath
                  if (!$owned.PSIsContainer -or ($owned.Attributes -band [IO.FileAttributes]::ReparsePoint)) { throw 'Untrusted synthetic fixture directory' }
              }
              $archivedId=$ReadOnlyExisting.ArchivedId
          } else {
          $root = Join-Path $temp ('pr101-history-' + [Guid]::NewGuid().ToString('N'))
          $codexHome = Join-Path $root 'codex-home'
          $project = Join-Path $root 'project'
          $now = [DateTime]::UtcNow
          $directory = Join-Path $codexHome ('sessions/' + $now.ToString('yyyy/MM/dd'))
          New-Item -ItemType Directory -Path $project,$directory -Force | Out-Null
          $id = [Guid]::NewGuid().ToString()
          $archivedId = [Guid]::NewGuid().ToString()
          $timestamp = $now.ToString("yyyy-MM-ddTHH:mm:ss.fff'Z'")
          $stamp = $now.ToString('yyyy-MM-ddTHH-mm-ss')
          $rollout = Join-Path $directory "rollout-$stamp-$id.jsonl"
          $meta = [ordered]@{ timestamp=$timestamp; type='session_meta'; payload=[ordered]@{ session_id=$id; id=$id; timestamp=$timestamp; cwd=$project; originator='cc_desk_acceptance'; cli_version='0.169.1'; source='cli' } }
          function Write-FixtureRollout([string]$File, [string]$SessionId, [string]$Canary) {
              $meta.payload.id = $SessionId
              $meta.payload.session_id = $SessionId
              $message = @{ timestamp=$timestamp; type='event_msg'; payload=@{type='user_message'; message=$Canary; images=@(); local_images=@(); text_elements=@()} }
              $output = @($meta,$message) | ForEach-Object { ConvertTo-Json -InputObject $_ -Compress -Depth 5 }
              [IO.File]::WriteAllText($File, ($output -join "`n") + "`n", [Text.UTF8Encoding]::new($false))
          }
          $activeCanary='Pr101ActiveCanary'
          $archivedCanary='Pr101ArchivedCanary'
          $archiveRoot = Join-Path $codexHome 'archived_sessions'
          New-Item -ItemType Directory -Path $archiveRoot | Out-Null
          $existingArchived = Join-Path $archiveRoot "rollout-$stamp-$archivedId.jsonl"
          Write-FixtureRollout $rollout $id $activeCanary
          Write-FixtureRollout $existingArchived $archivedId $archivedCanary
          
          }
          $spec=[Diagnostics.ProcessStartInfo]::new($image)
          $spec.WorkingDirectory=$project
          $spec.UseShellExecute=$false
          $spec.CreateNoWindow=$true
          $spec.RedirectStandardInput=$true
          $spec.RedirectStandardOutput=$true
          $spec.RedirectStandardError=$true
          $spec.ArgumentList.Add('app-server')
          $spec.ArgumentList.Add('--strict-config')
          $spec.Environment.Clear()
          foreach ($key in @('SystemRoot','WINDIR','SystemDrive','ComSpec')) {
              $value = [Environment]::GetEnvironmentVariable($key)
              if ($value) { $spec.Environment[$key] = $value }
          }
          $spec.Environment['HOME']=$root
          $spec.Environment['USERPROFILE']=$root
          $spec.Environment['APPDATA']=$root
          $spec.Environment['LOCALAPPDATA']=$root
          $spec.Environment['TEMP']=$root
          $spec.Environment['TMP']=$root
          $spec.Environment['CODEX_HOME']=$codexHome
          
          $process=[Diagnostics.Process]::Start($spec)
          if (!$process) { throw 'Could not start pinned app-server' }
          $stderr=$process.StandardError.BaseStream.CopyToAsync([IO.Stream]::Null)
          $deadline=[DateTime]::UtcNow.AddSeconds(25)
          function Send([object]$request) {
              $process.StandardInput.WriteLine((ConvertTo-Json -InputObject $request -Depth 8 -Compress))
              $process.StandardInput.Flush()
          }
          function Receive([int]$expected) {
              for ($i=0; $i -lt 48; $i++) {
                  $remaining=$deadline - [DateTime]::UtcNow
                  if ($remaining.TotalMilliseconds -le 0) { throw 'Pinned app-server deadline expired' }
                  $pending=$process.StandardOutput.ReadLineAsync()
                  if (!$pending.Wait($remaining)) { throw 'Pinned app-server reply timeout' }
                  $line=$pending.Result
                  if (!$line -or $line.Length -gt 65536) { throw 'Pinned app-server reply bound failed' }
                  try { $frame=$line | ConvertFrom-Json -AsHashtable } catch { throw 'Pinned app-server reply format failed' }
                  if ($frame.Contains('method') -and !$frame.Contains('id')) { continue }
                  if ($frame.id -ne $expected -or $frame.Contains('error') -or !$frame.Contains('result')) {
                      throw 'Pinned app-server returned an unexpected reply'
                  }
                  return $frame.result
              }
              throw 'Pinned app-server frame limit exceeded'
          }
          try {
              Send @{ id=1; method='initialize'; params=@{ clientInfo=@{name='cc_desk'; version='0.28.0'}; capabilities=@{explicitGatewayOauth=$true; experimentalApi=$false} } }
              $initial = Receive 1
              if (!$initial.codexHome -or [IO.Path]::GetFullPath($initial.codexHome).TrimEnd('\') -ine $codexHome) {
                  throw 'Pinned app-server did not bind to fixture CODEX_HOME'
              }
              Send @{ method='initialized' }
              if ($ReadOnlyExisting -and $ObserveRename) {
                  Send @{ id=2; method='thread/read'; params=@{ threadId=$ReadOnlyExisting.SessionId; includeTurns=$false } }
                  $renamed=Receive 2
                  Send @{ id=3; method='thread/list'; params=@{archived=$false;limit=100} }
                  $open=Receive 3
                  Send @{ id=4; method='thread/list'; params=@{archived=$true;limit=100} }
                  $closed=Receive 4
                  $activeId=@($open.data | Where-Object { $_.id -ceq $ReadOnlyExisting.SessionId -and $_.cwd -ceq $project })
                  $archiveId=@($closed.data | Where-Object { $_.id -ceq $archivedId -and $_.cwd -ceq $project })
                  $listsExact=$activeId.Count -eq 1 -and $archiveId.Count -eq 1 -and
                      @($open.data | Where-Object id -CEQ $archivedId).Count -eq 0 -and
                      @($closed.data | Where-Object id -CEQ $ReadOnlyExisting.SessionId).Count -eq 0
                  $process.StandardInput.Close()
                  if (!$process.WaitForExit(5000) -or $process.ExitCode -ne 0) { throw 'Pinned read-only post-rename app-server did not stop normally' }
                  return [pscustomobject]@{
                      sameId=$renamed.thread.id -ceq $ReadOnlyExisting.SessionId
                      sameCwd=$renamed.thread.cwd -ceq $project
                      expectedName=$renamed.thread.name -ceq 'Pr101RenamedCanary'
                      listsExact=$listsExact
                  }
              }
              if ($ReadOnlyExisting) {
                  Send @{ id=2; method='thread/list'; params=@{ archived=$false; limit=100 } }
                  $active=Receive 2
                  Send @{ id=3; method='thread/list'; params=@{ archived=$true; limit=100 } }
                  $archived=Receive 3
                  $result=@($active.data | Where-Object { $_.id -ceq $archivedId -and $_.cwd -ceq $project }).Count
                  $retained=@($archived.data | Where-Object { $_.id -ceq $archivedId -and $_.cwd -ceq $project }).Count
                  $process.StandardInput.Close()
                  if (!$process.WaitForExit(5000) -or $process.ExitCode -ne 0) { throw 'Pinned read-only post-restore app-server did not stop normally' }
                  return [pscustomobject]@{ activeCount=$result; archivedCount=$retained }
              }
              Send @{ id=2; method='thread/read'; params=@{ threadId=$id; includeTurns=$false } }
              $observed = Receive 2
              if ($observed.thread.id -cne $id) { throw 'Pinned app-server did not recognize fixture rollout' }
              Send @{ id=3; method='thread/read'; params=@{ threadId=$archivedId; includeTurns=$false } }
              $archived = Receive 3
              if ($archived.thread.id -cne $archivedId) { throw 'Pinned app-server did not recognize the separate pre-archived rollout' }
              $process.StandardInput.Close()
              if (!$process.WaitForExit(5000) -or $process.ExitCode -ne 0) { throw 'Pinned app-server did not stop normally' }
              [pscustomobject]@{ Home=$codexHome; Project=$project; SessionId=$id; Rollout=$rollout; ActiveCanary=$activeCanary; ArchivedId=$archivedId; ArchiveRollout=$existingArchived; ArchivedCanary=$archivedCanary; AppServerReadVerified=$true }
          } finally {
              if (!$process.HasExited) { $process.Kill(); $null=$process.WaitForExit(5000) }
              $process.Dispose()
          }
          '@ | Set-Content -LiteralPath (Join-Path $scriptRoot 'pr101-codex-history-fixture.ps1') -Encoding utf8
          @'
          # Sourced only by installed hosted acceptance with a verified, synthetic fixture.
          function Invoke-FixtureTarget($Root, [string]$Name, $Type, [switch]$WorkspaceHeader) {
              $specific = @($Root.FindAll([System.Windows.Automation.TreeScope]::Descendants, [System.Windows.Automation.Condition]::TrueCondition) | Where-Object {
                  if ($_.Current.Name -cne $Name -or ($Type -and $_.Current.ControlType -ne $Type)) { return $false }
                  if (!$WorkspaceHeader) { return $true }
                  $parent = [System.Windows.Automation.TreeWalker]::ControlViewWalker.GetParent($_)
                  if (!$parent) { return $false }
                  return @($parent.FindAll([System.Windows.Automation.TreeScope]::Children,[System.Windows.Automation.Condition]::TrueCondition) |
                      Where-Object { $_.Current.Name -ceq 'Collapse sessions panel' }).Count -eq 1
              })
              if ($specific.Count -gt 1) { throw 'Ambiguous synthetic fixture control' }
              if ($specific.Count -eq 0) { return $false }
              $ctl=$specific[0]
              if ($ctl.Current.IsOffscreen) {
                  $scroll=$null
                  if (!$ctl.TryGetCurrentPattern([System.Windows.Automation.ScrollItemPattern]::Pattern,[ref]$scroll)) { return $false }
                  ([System.Windows.Automation.ScrollItemPattern]$scroll).ScrollIntoView()
              }
              $pattern=$null
              if ($ctl.Current.IsOffscreen -or !$ctl.Current.IsEnabled -or !$ctl.TryGetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern,[ref]$pattern)) { return $false }
              ([System.Windows.Automation.InvokePattern]$pattern).Invoke()
              return $true
          }
          
          function Set-FixtureEdit([string]$Name,[string]$Value) {
              $editType=[System.Windows.Automation.ControlType]::Edit
              Reveal-FixtureControl @($Name) $editType
              $ctl=Wait-Observed { Find-Control @($Name) $editType } "synthetic configuration: $Name"
              $pattern=$null
              if (!$ctl.TryGetCurrentPattern([System.Windows.Automation.ValuePattern]::Pattern,[ref]$pattern)) { throw "Synthetic edit not writable: $Name" }
              $pattern=[System.Windows.Automation.ValuePattern]$pattern
              $pattern.SetValue($Value)
              $null=Wait-Observed {
                  $observed=Find-Control @($Name) $editType
                  $read=$null
                  if ($observed -and $observed.TryGetCurrentPattern([System.Windows.Automation.ValuePattern]::Pattern,[ref]$read) -and
                      ([System.Windows.Automation.ValuePattern]$read).Current.Value -ceq $Value) { return $observed }
              } "exact synthetic edit readback: $Name"
          }
          
          function Configure-CodexFixtureProfile {
              $result.codexHistory.stage='create-official-codex-profile'
              $result.codexHistory.stage='settings-open'
              Invoke-Button @('Settings')
              $result.codexHistory.stage='settings-launch-configurations'
              Invoke-Button @('Launch configurations')
              $name='Pr101SyntheticCodexProfile'
              $button=[System.Windows.Automation.ControlType]::Button
              $result.codexHistory.stage='codex-config-create-control'
              $target=Wait-Observed {
                  $tools=@($window.FindAll([System.Windows.Automation.TreeScope]::Descendants,[System.Windows.Automation.Condition]::TrueCondition) | Where-Object {
                      $_.Current.Name -ceq 'New configuration' -and $_.Current.ControlType -eq $button -and
                      $null -ne [System.Windows.Automation.TreeWalker]::ControlViewWalker.GetParent($_) -and
                      @([System.Windows.Automation.TreeWalker]::ControlViewWalker.GetParent($_).FindAll([System.Windows.Automation.TreeScope]::Descendants,[System.Windows.Automation.Condition]::TrueCondition) | Where-Object {
                          $_.Current.Name -ceq 'Codex CLI' -and $_.Current.ControlType -ne $button
                      }).Count -eq 1
                  })
                  if ($tools.Count -gt 1) { throw 'Ambiguous Codex profile group' }
                  if ($tools.Count -eq 1) { $tools[0] }
              } 'new configuration in exact Codex CLI group'
              if ($target.Current.IsOffscreen) {
                  $scroll=$null
                  if (!$target.TryGetCurrentPattern([System.Windows.Automation.ScrollItemPattern]::Pattern,[ref]$scroll)) { throw 'Codex configuration group cannot reveal its action' }
                  ([System.Windows.Automation.ScrollItemPattern]$scroll).ScrollIntoView()
              }
              $click=$null
              if (!$target.Current.IsEnabled -or !$target.TryGetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern,[ref]$click)) { throw 'Codex configuration action unavailable' }
              ([System.Windows.Automation.InvokePattern]$click).Invoke()
              $result.codexHistory.stage='codex-config-name'
              Set-FixtureEdit 'Configuration name' $name
              $result.codexHistory.stage='codex-config-options'
              $details=Wait-Observed {
                  $label="More options$([char]0x2026)"
                  $same = @($window.FindAll([System.Windows.Automation.TreeScope]::Descendants,[System.Windows.Automation.Condition]::TrueCondition) |
                      Where-Object { $_.Current.Name -ceq $label })
                  if ($same.Count -gt 8) { throw 'Too many identically labelled profile controls' }
                  $result.codexHistory.optionsControls=@($same | ForEach-Object { [ordered]@{
                      type=$_.Current.ControlType.ProgrammaticName
                      patterns=@($_.GetSupportedPatterns() | ForEach-Object ProgrammaticName)
                  } })
                  $action=@($same | Where-Object {
                      $pattern=$null
                      $_.Current.IsEnabled -and !$_.Current.IsOffscreen -and
                          $_.TryGetCurrentPattern([System.Windows.Automation.ExpandCollapsePattern]::Pattern,[ref]$pattern)
                  })
                  if ($action.Count -gt 1) { throw 'Ambiguous actionable disclosure in Codex configuration' }
                  if ($action.Count -eq 1) { return $action[0] }
              } 'unique actionable Codex configuration options'
              $expand=$null
              if (!$details.TryGetCurrentPattern([System.Windows.Automation.ExpandCollapsePattern]::Pattern,[ref]$expand)) { throw 'Missing profile options disclosure' }
              ([System.Windows.Automation.ExpandCollapsePattern]$expand).Expand()
              $result.codexHistory.stage='codex-config-program-mode'
              $combo=Wait-Observed { Find-Control @('CLI program override') ([System.Windows.Automation.ControlType]::ComboBox) } 'Codex executable override'
              $expand=$null
              if (!$combo.TryGetCurrentPattern([System.Windows.Automation.ExpandCollapsePattern]::Pattern,[ref]$expand)) { throw 'Missing executable override disclosure' }
              ([System.Windows.Automation.ExpandCollapsePattern]$expand).Expand()
