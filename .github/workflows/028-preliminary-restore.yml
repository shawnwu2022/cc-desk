name: CC Desk cold exact-source Windows startup comparison
on:
  push:
    branches: [verify/028-preliminary-restore-20261120]
permissions:
  contents: read
jobs:
  cold-exact-source-startup:
    if: github.repository == 'shawnwu2022/cc-desk' && github.ref == 'refs/heads/verify/028-preliminary-restore-20261120' && github.run_attempt == 1
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      CARGO_PROFILE_RELEASE_LTO: 'false'
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Check out exact reviewed product source
        uses: actions/checkout@v5
        with:
          path: product-source
          ref: 04a2f0cedc8e7acc080e8736723c6e8799127f58
          persist-credentials: false
      - name: Check out sparse helper subtree from the exact scratch workflow revision
        uses: actions/checkout@v5
        with:
          path: workflow-source
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: .github/isolated-tests/cc-desk-startup
          sparse-checkout-cone-mode: false
      - name: Admit immutable product source and verified scratch helpers
        shell: pwsh
        run: |
          # Gate every helper before starting any product or helper commands. Read git blob
          # bytes, not Windows checkout bytes; autocrlf cannot alter what gets executed.
          $trust=@'
          import hashlib, os, re, subprocess, tempfile
          from pathlib import Path
          pins = {
              "dist-receipt.cjs": "94ea92bf5da4f6d9004dccf55bb8c7577d875a96ff1d52038354b4679c937f83",
              "next_gate_binding.py": "b81c4aa4b65db66333183e6454ed89cd8d2cbe2a5bbe416e36a04650f3af1b9a",
              "run-cold-probe.ps1": "ab96fe111bd5d31aeb138439c7927daf9a657f48c495fd08007c3906eb7967db",
              "supply-cold-inputs.ps1": "a9a1e61a59b19cc40729df81f0e89cc83c2cd48ccb9c26157860084db7eb9db3",
              "test-conpty-install-bound.ps1": "434f9f5a343f9067babf6481bb1f25d604f83dbef5039a29aa7963e84709546b",
              "test-desktop-webview.ps1": "2d65ccef20d926d10b4d15e500532d2fc3c0ab953be42c236eb1010c532e6680",
              "verify_named_nsis.py": "49b0f703fd2ea25c0b3cd8f3d3795315822e3e60b8b98ef27e26cacbba1aa302",
          }
          def check(ok):
              if not ok:
                  raise SystemExit("Reviewed source/helper isolation gate failed")
          def git(repo,*args):
              p=subprocess.run(["git","-C",str(repo),*args], stdout=subprocess.PIPE, stderr=subprocess.DEVNULL)
              check(p.returncode == 0)
              return p.stdout
          workspace=Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          product=workspace/"product-source"
          scratch=workspace/"workflow-source"
          check(product.resolve()==product and scratch.resolve()==scratch and product!=scratch)
          source="04a2f0cedc8e7acc080e8736723c6e8799127f58"
          tree="933bae502bb1e262e6f0be2cd0bb600cb8992b8a"
          event=os.environ["GITHUB_SHA"]
          check(re.fullmatch(r"[0-9a-f]{40}",event) and event!=source and
                os.environ["GITHUB_WORKFLOW_SHA"]==event and
                os.environ["GITHUB_REF"]=="refs/heads/verify/028-preliminary-restore-20261120")
          check(git(product,"rev-parse","HEAD").strip()==source.encode())
          check(git(product,"rev-parse","HEAD^{tree}").strip()==tree.encode())
          check(not git(product,"status","--porcelain") and not (product/"src-tauri"/"target").exists())
          check(git(scratch,"rev-parse","HEAD").strip()==event.encode())
          helper_dir=".github/isolated-tests/cc-desk-startup/"
          listed=git(scratch,"ls-tree","-z","--full-tree","-r",event,"--",helper_dir)
          items=listed.split(b"\0")
          check(items.pop()==b"" and len(items)==len(pins))
          blobs={}
          for item in items:
              field, sep, rawname=item.partition(b"\t")
              mode, kind, oid=field.split()
              check(sep==b"\t" and mode==b"100644" and kind==b"blob" and re.fullmatch(rb"[0-9a-f]{40}",oid))
              rel=rawname.decode("ascii")
              check(rel.startswith(helper_dir))
              name=rel[len(helper_dir):]
              check(name in pins and name not in blobs and "/" not in name)
              length=int(git(scratch,"cat-file","-s",oid.decode()).strip())
              check(0 < length <= 64*1024)
              data=git(scratch,"cat-file","blob",oid.decode())
              check(len(data)==length and hashlib.sha256(data).hexdigest()==pins[name])
              blobs[name]=data
          check(set(blobs)==set(pins))
          private=Path(tempfile.mkdtemp(prefix="ccdesk-reviewed-helper-",dir=os.environ["RUNNER_TEMP"]))
          for name,data in blobs.items():
              with (private/name).open("xb") as stream:
                  stream.write(data)
              check(hashlib.sha256((private/name).read_bytes()).hexdigest()==pins[name])
          with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8") as env:
              env.write(f"CCDESK_TEST_HELPERS_ROOT={private}\n")
          '@
          $trust | & python -
          if ($LASTEXITCODE -ne 0) { throw 'Reviewed helper/source admission failed' }
      - uses: actions/setup-node@v5
        with:
          node-version: '24.18.0'
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - uses: actions/cache/restore@v4
        id: npm-cache
        with:
          path: 'C:\npm\cache'
          key: node-cache-Windows-x64-npm-5c630f0553f13862fb02a2428964971aa08d1c6d3b459e27179ba57f24242d07
      - uses: actions/cache/restore@v4
        id: browser-cache
        with:
          path: |
            ${{ runner.temp }}/cc-desk-browser-tools-21.1.8-0.2.129/*.tar.xz
            ${{ runner.temp }}/cc-desk-browser-tools-21.1.8-0.2.129/*.tar.gz
          key: windows-browser-official-llvm21.1.8-bindgen0.2.129-749d22f5-79e348c1
      - name: Supply original pinned build inputs without restoring Rust targets
        working-directory: product-source
        shell: pwsh
        run: '& (Join-Path $env:CCDESK_TEST_HELPERS_ROOT "supply-cold-inputs.ps1")'
      - name: Build one original NSIS, bind bytes and run ordinary isolated gates
        working-directory: product-source
        shell: pwsh
        env:
          NPM_RESTORE_HIT: ${{ steps.npm-cache.outputs.cache-hit }}
          BROWSER_RESTORE_HIT: ${{ steps.browser-cache.outputs.cache-hit }}
        run: '& (Join-Path $env:CCDESK_TEST_HELPERS_ROOT "run-cold-probe.ps1")'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cold-exact-source-startup-${{ github.run_id }}-${{ github.run_attempt }}
          path: cold-startup-receipt.json
          if-no-files-found: warn
          retention-days: 14

