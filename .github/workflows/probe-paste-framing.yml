name: Verify and apply DevTools JSON paste repair
on:
  push:
    branches: [codex/fix-devtools-paste]
permissions:
  contents: write
concurrency:
  group: repair-devtools-paste
  cancel-in-progress: false
jobs:
  repair:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Strengthen the JSON regression before changing production code
        shell: python
        run: |
          from pathlib import Path
          import json
          p = Path('src-tauri/src/tests/mod.rs')
          text = p.read_text(encoding='utf-8')
          assert 'mod paste_framing;' not in text
          p.write_text(text + '\n#[cfg(test)]\nmod paste_framing;\n', encoding='utf-8', newline='\n')
          p = Path('src-tauri/tests/fixtures/devtools-paste-framing.json')
          fixtures = json.loads(p.read_text(encoding='utf-8'))
          for fixture in fixtures:
              fixture['prepared'] = fixture['source'].replace('\r\n', '\n').replace('\r', '\n')
          row = '{\r\n      "id": 18446744073709551615,\r\n      "message": "请求失败 中文 🎉  双空格",\r\n      "nested": {"list": [true, null, 42], "path": "C:\\\\games\\\\app.js", "stack": "first\\nsecond"}\r\n    }'
          for count in [64, 256, 800]:
              fixtures.append({
                  'name': 'devtools-json-nested-' + str(count),
                  'source': row,
                  'prepared': row.replace('\r\n', '\n'),
                  'repeat': count,
                  'prefix': '{\n  "begin": "__JSON_BEGIN__",\n  "items": [\n    ',
                  'separator': ',\n    ',
                  'suffix': '\n  ],\n  "end": "__JSON_END__"\n}',
                  'isJson': True,
              })
          p.write_text(json.dumps(fixtures, ensure_ascii=False, indent=2) + '\n', encoding='utf-8', newline='\n')
          p = Path('tests/utils/devtoolsPaste.test.ts')
          text = p.read_text(encoding='utf-8')
          text = text.replace('  repeat: number\n', '  repeat: number\n  prefix?: string\n  suffix?: string\n  separator?: string\n  isJson?: boolean\n')
          text = text.replace("const expectedPayload = (fixture: PasteFixture) =>\n  '\\x1b[200~' + fixture.prepared.repeat(fixture.repeat) + '\\x1b[201~'", "const compose = (fixture: PasteFixture, text: string) =>\n  (fixture.prefix ?? '') + Array(fixture.repeat).fill(text).join(fixture.separator ?? '') + (fixture.suffix ?? '')\nconst expectedPayload = (fixture: PasteFixture) =>\n  '\\x1b[200~' + compose(fixture, fixture.prepared) + '\\x1b[201~'")
          text = text.replace('fixture.source.repeat(fixture.repeat)', 'compose(fixture, fixture.source)')
          text = text.replace('    expect(buildPastePayload(source, true, false))', '    if (fixture.isJson) expect(() => JSON.parse(source)).not.toThrow()\n    expect(buildPastePayload(source, true, false))')
          text = text.replace("  it('DevtoolsPaste_KeyboardCommit_002', async () => {\n    const fixture = fixtures[0]!", "  it.each(fixtures)('DevtoolsPaste_KeyboardCommit_002 $name', async fixture => {")
          text = text.replace("  it('DevtoolsPaste_NativeMenu_003', async () => {\n    const fixture = fixtures[0]!", "  it.each(fixtures)('DevtoolsPaste_NativeMenu_003 $name', async fixture => {")
          p.write_text(text, encoding='utf-8', newline='\n')
          p = Path('src-tauri/src/tests/paste_framing.rs')
          text = p.read_text(encoding='utf-8')
          old = '    struct Fixture { name: String, prepared: String, repeat: usize }'
          assert old in text
          text = text.replace(old, '''    struct Fixture {
                  name: String, prepared: String, repeat: usize,
                  #[serde(default)] prefix: String,
                  #[serde(default)] suffix: String,
                  #[serde(default)] separator: String,
              }''')
          old = '            let payload = format!("{OPEN}{}{CLOSE}", fixture.prepared.repeat(fixture.repeat));'
          assert old in text
          text = text.replace(old, '''            let body = vec![fixture.prepared.as_str(); fixture.repeat].join(&fixture.separator);
                      let payload = format!("{OPEN}{}{body}{}{CLOSE}", fixture.prefix, fixture.suffix);''')
          needle = '        assert_native_frames("split-escape-sequence", &[payload]);'
          assert needle in text
          text = text.replace(needle, needle + r'''
                  for padding in 4060..4098 {
                      let payload = format!("{OPEN}{}\x1b[31m中文🎉\nTAIL{CLOSE}", "x".repeat(padding));
                      assert_native_frames(&format!("escape-offset-{padding}"), &[payload]);
                  }
                  let payload = format!("{OPEN}{}{CLOSE}", "\x1b[31m色\x1b[0m\n".repeat(400));
                  assert_native_frames("dense-literal-escapes", &[payload]);
          ''')
          p.write_text(text, encoding='utf-8', newline='\n')
      - name: Require RED for unwanted JSON compaction
        shell: pwsh
        run: |
          $output = npx vitest run tests/utils/devtoolsPaste.test.ts 2>&1
          $code = $LASTEXITCODE
          $output | Write-Output
          if ($code -eq 0) { throw 'Expected the old automatic JSON compaction to fail fidelity tests' }
          if (($output -join "`n") -notmatch 'AssertionError') { throw 'Regression failed for an unrelated reason' }
          $global:LASTEXITCODE = 0
      - name: Fetch the exact production PTY dependency
        working-directory: src-tauri
        run: cargo metadata --locked --format-version 1 > pty-metadata.json
      - name: Apply narrow Windows writer and JSON fidelity fixes
        shell: python
        run: |
          from pathlib import Path
          import json, re, shutil
          root = Path('src-tauri')
          metadata = json.loads((root / 'pty-metadata.json').read_text(encoding='utf-8-sig'))
          package = next(p for p in metadata['packages'] if p['name'] == 'portable-pty')
          assert package['version'] == '0.8.1'
          vendor = root / 'vendor/portable-pty'
          shutil.copytree(Path(package['manifest_path']).parent, vendor, ignore=shutil.ignore_patterns('.cargo-ok', '.cargo-checksum.json', 'target', 'Cargo.lock'))
          p = vendor / 'src/win/conpty.rs'
          text = p.read_text(encoding='utf-8')
          pattern = r'    fn take_writer\(&self\) -> anyhow::Result<Box<dyn std::io::Write \+ Send>> \{.*?\n    \}'
          assert len(re.findall(pattern, text, re.S)) == 1
          replacement = '''    fn take_writer(&self) -> anyhow::Result<Box<dyn std::io::Write + Send>> {
                  let writer = self.inner.lock().unwrap().writable.take()
                      .ok_or_else(|| anyhow::anyhow!("writer already taken"))?;
                  Ok(Box::new(ConPtyInputWriter(writer)))
              }'''
          text = re.sub(pattern, lambda _: replacement, text, flags=re.S)
          text += r'''

          /// Drain only the ConPTY input pipe, not every FileDescriptor in the process.
          /// The upstream descriptor's flush is a no-op on Windows. Real drainage
          /// prevents separately written Unicode key events from being coalesced with
          /// body text and split inside the console host's input parser.
          struct ConPtyInputWriter(FileDescriptor);

          impl std::io::Write for ConPtyInputWriter {
              fn write(&mut self, data: &[u8]) -> std::io::Result<usize> {
                  std::io::Write::write(&mut self.0, data)
              }

              fn flush(&mut self) -> std::io::Result<()> {
                  use std::os::windows::io::AsRawHandle;
                  #[link(name = "kernel32")]
                  unsafe extern "system" {
                      fn FlushFileBuffers(handle: *mut std::ffi::c_void) -> i32;
                  }
                  // SAFETY: self owns the live, writable ConPTY input pipe handle.
                  // It is not closed or transferred by this call; no buffers escape.
                  if unsafe { FlushFileBuffers(self.0.as_raw_handle()) } == 0 {
                      return Err(std::io::Error::last_os_error());
                  }
                  Ok(())
              }
          }
          '''
          p.write_text(text, encoding='utf-8', newline='\n')
          (vendor / 'CC_DESK_PATCH.md').write_text('''# CC Desk local patch

          Based on the exact crates.io portable-pty 0.8.1 package selected by Cargo.lock.
          Original license and .cargo_vcs_info.json are retained. No other crate is patched.

          Only src/win/conpty.rs differs: the taken input writer owns the existing
          descriptor and implements a real FlushFileBuffers drain on its input pipe.
          Unix and output readers remain upstream. No raw handles are exposed to the app.
          The same owned writer is used in production and native regression tests.

          FlushFileBuffers may block until the console host consumes pending bytes,
          just as a synchronous pipe write can block. The application holds only the
          affected PTY's writer lock; its global registry and kill path remain independent.
          This does not acknowledge receipt by Claude's editor. See docs/paste-framing.md.

          Remove this local patch when upstream exposes equivalent pipe drainage or
          the supported console hosts reliably preserve bracketed paste input.
          ''', encoding='utf-8', newline='\n')
          p = root / 'Cargo.toml'
          text = p.read_text(encoding='utf-8')
          assert text.count('portable-pty = "0.8"') == 1
          p.write_text(text.replace('portable-pty = "0.8"', 'portable-pty = { version = "=0.8.1", path = "vendor/portable-pty" }'), encoding='utf-8', newline='\n')
          p = root / 'src/pty.rs'
          text = p.read_text(encoding='utf-8')
          needle = 'pub(crate) fn write_pty_data<W: Write + ?Sized>('
          assert text.count(needle) == 1
          helper = r'''/// Preserve complete bracketed paste frames for Windows ReadConsoleInputW
          /// clients. A Unicode ESC event is written separately from surrounding text,
          /// and the ConPTY input pipe is drained at each boundary. Neither an arbitrary
          /// sleep nor preserving only our own 4 KiB write boundaries is sufficient.
          #[cfg(windows)]
          fn write_conpty_paste<W: Write + ?Sized>(writer: &mut W, data: &[u8]) -> io::Result<()> {
              const LITERAL_ESCAPE: &[u8] = b"\x1b[0;0;27;1;0;1_";
              let text = std::str::from_utf8(data)
                  .map_err(|error| io::Error::new(io::ErrorKind::InvalidData, error))?;
              writer.flush()?;
              let mut segments = text.split('\x1b').peekable();
              while let Some(mut segment) = segments.next() {
                  while !segment.is_empty() {
                      let mut end = segment.len().min(PTY_WRITE_CHUNK_SIZE);
                      while !segment.is_char_boundary(end) {
                          end -= 1;
                      }
                      writer.write_all(&segment.as_bytes()[..end])?;
                      writer.flush()?;
                      segment = &segment[end..];
                  }
                  if segments.peek().is_some() {
                      // Vk=0, scan=0, Unicode=ESC, key-down, modifiers=0, repeat=1.
                      // Keep this event alone in the drained pipe, not in a text chunk.
                      writer.write_all(LITERAL_ESCAPE)?;
                      writer.flush()?;
                  }
              }
              Ok(())
          }

          '''
          text = text.replace(needle, helper + needle, 1)
          needle = '    let mut chunks = data.chunks(PTY_WRITE_CHUNK_SIZE).peekable();'
          assert text.count(needle) == 1
          text = text.replace(needle, '''    #[cfg(windows)]
              if data.starts_with(b"\\x1b[200~") && data.ends_with(b"\\x1b[201~") {
                  return write_conpty_paste(writer, data);
              }

          ''' + needle, 1)
          text = text.replace('// Windows ConPTY 对连续突发写入存在截断风险；小块刷新并短暂让出时间，避免大粘贴丢字节。', '// 普通输入保留既有分块策略；Windows 完整粘贴帧走下方独立编码与真实管道排空。')
          p.write_text(text, encoding='utf-8', newline='\n')
          p = Path('src/utils/pasteText.ts')
          text = p.read_text(encoding='utf-8')
          old = '  const compacted = compactJsonForPaste(text)\n  const prepared = preparePasteText(compacted)'
          assert text.count(old) == 1
          text = text.replace(old, '  // JSON 与普通文本一致：只规范行尾，不压缩、解析重写或截断正文。\n  const prepared = preparePasteText(text)', 1)
          text = text.replace('构造最终写入 PTY 的粘贴 payload：合法 JSON 压缩单行 + 规范化 LF + bracketed 包装。', '构造最终写入 PTY 的粘贴 payload：原文规范化 LF + bracketed 包装。')
          start = text.index('/**\n * 多行 JSON 压缩成单行')
          end = text.index('const COMPACT_MAX_LENGTH', start)
          text = text[:start] + '/**\n * @deprecated 历史 JSON 格式化工具；不再用于实际粘贴投递。\n * 压缩不保证防止截断。保留该独立导出仅供旧调用兼容与历史回归。\n */\n' + text[end:]
          p.write_text(text, encoding='utf-8', newline='\n')
          p = Path('tests/utils/pasteText.test.ts')
          text = p.read_text(encoding='utf-8')
          text = text.replace("'\\x1b[200~{\"a\": 1}\\x1b[201~'", "'\\x1b[200~{\\n  \"a\": 1\\n}\\x1b[201~'")
          text = text.replace("'\\x1b[200~{\"a\": 1,\"b\": 2}\\x1b[201~'", "'\\x1b[200~' + pretty + '\\x1b[201~'")
          text = text.replace('PasteText_BuildPayload_JsonCompacted_013', 'PasteText_BuildPayload_JsonFormattingPreserved_013')
          text = text.replace('// buildPastePayload 集成 JSON 压缩：多行 pretty JSON 进，单行 + bracketed 包装出。', '// 生产粘贴保留 JSON 的换行、缩进和数字原文，不再依赖压缩规避。')
          p.write_text(text, encoding='utf-8', newline='\n')
          p = Path('src/components/XTermTerminal.vue')
          text = p.read_text(encoding='utf-8')
          old = '// → 构造 payload（JSON 压缩单行 + 规范化 LF + bracketed 包装，见 utils/pasteText.ts；\n      // 压缩是为绕开 ConPTY 吞标记后 Claude 对大段多行 burst 的间歇截断）。'
          assert old in text
          text = text.replace(old, '// → 构造 payload（原文规范化 LF + bracketed 包装，见 utils/pasteText.ts）。\n      // JSON 不再自动压缩；Windows 粘贴帧由 Rust 生产 writer 保护。')
          p.write_text(text, encoding='utf-8', newline='\n')
      - name: Format Rust sources
        working-directory: src-tauri
        run: |
          cargo fmt --all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fmt --all --check
      - name: Verify production writer through real Windows ConPTY
        working-directory: src-tauri
        run: cargo test --lib paste_framing -- --nocapture
      - name: Verify strict Rust checks
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: Verify all Rust tests
        working-directory: src-tauri
        run: cargo test
      - name: Verify frontend types
        run: npm run typecheck
      - name: Verify all frontend tests
        run: npm run test:ci
      - name: Verify frontend production build
        run: npm run build
      - name: Document tested scope accurately and commit verified source
        shell: python
        run: |
          from pathlib import Path
          import os, subprocess
          p = Path('docs/paste-framing.md')
          p.write_text('''# DevTools JSON 粘贴完整性修复

          ## 已确认的问题

          旧代码将 JSON 压缩成单行，只是规避，不保证大对象完整进入 Claude 编辑器。
          Windows Server 2022 / portable-pty 0.8.1 / Node 20 的真实输入探针中，原始
          bracketed paste 起止标记被吞掉（期望 14012 字节，收到 14000）。
          此后还复现了控制序列跨 ConPTY 内部读边界损坏；应用层按完整单元切块仍不足。
          不能把调整 sleep、单行化、出现折叠标签或正文单独哈希通过当作修复验收。

          ## 实际修改

          - buildPastePayload 不再调用 JSON 压缩。只保留原有 CRLF/CR -> LF 规范化；
            换行、缩进、大整数数字、字符串转义、首尾内容不被压缩或截断。
          - Windows 完整粘贴帧中的 ESC 使用 Unicode 按键事件编码，每个事件独立写入；
            事件与正文之间真实排空 ConPTY 输入管道。正文按 UTF-8 边界分块，不复制整段。
          - 精确 vendor portable-pty 0.8.1，仅包装 ConPTY input writer 的 flush。
            不修改全局 filedescriptor，不使用测试专属传输实现，不改 Unix 输出/输入。
            普通键和图片粘贴键不编码；Windows writer 的 flush 现在会等待管道读取。
          - 每 PTY 独立 writer 锁保持不变；写入失败向上传播，不自动重发部分内容。

          ## 自动化证据及边界

          tests/utils/devtoolsPaste.test.ts 对同一套黄金样本逐一验证 payload 构造、
          commitPaste 快捷键入口、捕获阶段原生菜单入口，保留原始 JSON 格式。
          src-tauri/src/tests/paste_framing.rs 调用实际生产 writer，经真实 ConPTY，
          校验包含标记的完整 UTF-8 字节数及内容哈希。
          样本含 64/256/800 行对象数组的合法嵌套 JSON、大整数、中文、emoji、
          145 KB 日志、38 个 4 KiB 附近边界、800 个 ESC 与连续粘贴。

          这些测试证明上述样本的前端投递与 Windows stdin 传输契约，**不等同于
          用户真实 Chrome 剪贴板和具体 Claude Code 版本的编辑器已验收**。
          旧 paste_claude_e2e 探针存在折叠标签直接判通过的历史逻辑，不作为本修复
          的真实编辑器完整性证据。真实验收必须提取完整编辑器/提交正文进行比较。

          Windows 10/11 不同构建、WSL/SSH 嵌套链路、原始 U+009B 等特殊控制字符
          未由这一 Windows Server 2022 runner 自动验证。此分支尚未发布安装包。

          ## 复现记录

          - 旧生产写入失败：Actions run 34451840475。
          - 隔离 ESC + 真排空成功；关闭排空再次失败：Actions run 34454015996。
          - 当前全部生产路径回归：Actions run ''' + os.environ['GITHUB_RUN_ID'] + '''。

          Microsoft 协议：microsoft/terminal 的 #4999 Improved keyboard handling in Conpty。
          FlushFileBuffers 语义：Microsoft Learn /windows/win32/api/fileapi/nf-fileapi-flushfilebuffers。
          ''', encoding='utf-8', newline='\n')
          p = Path('AGENTS.md')
          text = p.read_text(encoding='utf-8')
          text += '\n### DevTools JSON 粘贴\n\n- 实际粘贴不再自动压缩 JSON；只规范行尾。\n- Windows 完整粘贴帧使用独立 ESC Unicode 事件与真实 ConPTY input pipe drain；具体补丁在 vendor/portable-pty/CC_DESK_PATCH.md。禁止用 sleep 或单行化代替完整性保证。\n- 前端各入口与生产 Rust writer 共享黄金样本；必须验证包含起止标记的完整正文。出现 Pasted text 折叠标签不算真实编辑器验收。见 docs/paste-framing.md。\n'
          p.write_text(text, encoding='utf-8', newline='\n')
          Path('.github/workflows/probe-paste-framing.yml').unlink()
          files = ['src-tauri/Cargo.toml', 'src-tauri/Cargo.lock', 'src-tauri/vendor/portable-pty', 'src-tauri/src/pty.rs', 'src-tauri/src/tests/mod.rs', 'src-tauri/src/tests/paste_framing.rs', 'src-tauri/tests/fixtures/devtools-paste-framing.json', 'src/utils/pasteText.ts', 'src/components/XTermTerminal.vue', 'tests/utils/pasteText.test.ts', 'tests/utils/devtoolsPaste.test.ts', 'docs/paste-framing.md', 'AGENTS.md', '.github/workflows/probe-paste-framing.yml']
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'add', '--'] + files, check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          subprocess.run(['git', 'commit', '-m', 'fix: preserve DevTools JSON through the production ConPTY paste path'], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:codex/fix-devtools-paste'], check=True)
      - name: Save diagnosis on failure without publishing a broken application
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: devtools-paste-repair-diagnostics
          path: |
            src-tauri/src/pty.rs
            src-tauri/src/tests/paste_framing.rs
            src-tauri/vendor/portable-pty/src/win/conpty.rs
            tests/utils/devtoolsPaste.test.ts
