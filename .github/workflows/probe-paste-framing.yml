name: Probe ConPTY input token boundaries
on:
  push:
    branches: [codex/fix-devtools-paste]
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - name: Isolate existing native tests and collect generated fixture diagnostics
        shell: python
        run: |
          from pathlib import Path
          import shutil
          root = Path('.paste-probe')
          (root / 'src/tests').mkdir(parents=True)
          (root / 'tests/fixtures').mkdir(parents=True)
          shutil.copy('src-tauri/tests/fixtures/devtools-paste-framing.json', root / 'tests/fixtures/devtools-paste-framing.json')
          text = Path('src-tauri/src/tests/paste_framing.rs').read_text(encoding='utf-8')
          marker = '        assert_native_frames("split-escape-sequence", &[payload]);'
          text = text.replace(marker, marker + r'''
                  for padding in 4060..4098 {
                      let payload = format!("{OPEN}{}\x1b[31m中文🎉\nTAIL{CLOSE}", "x".repeat(padding));
                      assert_native_frames(&format!("escape-offset-{padding}"), &[payload]);
                  }
                  let payload = format!("{OPEN}{}{CLOSE}", "\x1b[31m色\x1b[0m\n".repeat(400));
                  assert_native_frames("dense-literal-escapes", &[payload]);
          ''')
          text = text.replace("  console.log('PASTE_RAW:'", "  console.log('GENERATED_TAIL:' + Buffer.from(value.slice(-64)).toString('hex') + ':');\n  console.log('PASTE_RAW:'")
          marker = '        assert_eq!(field(&output, "PASTE_RAW:")'
          text = text.replace(marker, '        if field(&output, "PASTE_HASH:") != Some(u64::from(hash(expected.as_bytes()))) { println!("GENERATED FIXTURE DIAGNOSTIC: {output:?}"); }\n' + marker)
          (root / 'src/tests/paste_framing.rs').write_text(text, encoding='utf-8')
          (root / 'Cargo.toml').write_text('''[package]
          name = "paste-boundary-probe"
          version = "0.0.0"
          edition = "2021"
          [dependencies]
          portable-pty = "=0.8.1"
          serde = { version = "1", features = ["derive"] }
          serde_json = "1"
          ''', encoding='utf-8')
          (root / 'src/lib.rs').write_text('#![allow(non_snake_case)]\nmod pty;\n#[cfg(test)] mod tests { mod paste_framing; }\n', encoding='utf-8')
          (root / 'src/pty.rs').write_text(r'''
          use std::io::{self, Write};
          pub(crate) fn write_pty_data<W: Write + ?Sized>(writer: &mut W, data: &[u8]) -> io::Result<()> {
              let strategy = std::env::var("PROBE_STRATEGY").unwrap();
              let csi = if strategy.starts_with("c1") { "\u{9b}" } else { "\x1b[" };
              let all = strategy.ends_with("all");
              let limit: usize = std::env::var("PROBE_CHUNK").unwrap().parse().unwrap();
              let mut chunk = Vec::with_capacity(limit);
              for c in std::str::from_utf8(data).unwrap().chars() {
                  let encoded = if all || c == '\x1b' {
                      c.encode_utf16(&mut [0; 2]).iter().map(|u| format!("{csi}0;0;{u};1;0;1_")).collect::<String>()
                  } else { c.to_string() };
                  if chunk.len() + encoded.len() > limit {
                      writer.write_all(&chunk)?; writer.flush()?; chunk.clear();
                      std::thread::sleep(std::time::Duration::from_millis(1));
                  }
                  chunk.extend_from_slice(encoded.as_bytes());
              }
              writer.write_all(&chunk)?;
              writer.flush()
          }
          ''', encoding='utf-8')
      - name: Test indivisible Unicode tokens rather than byte cuts
        working-directory: .paste-probe
        shell: pwsh
        run: |
          foreach ($strategy in @('esc-esc', 'c1-esc', 'c1-all')) {
            foreach ($size in @('4096', '512')) {
              $env:PROBE_STRATEGY = $strategy
              $env:PROBE_CHUNK = $size
              cargo test --lib PtyPaste_Native -- --nocapture
              Write-Output "STRATEGY_${strategy}_CHUNK_${size}_EXIT=$LASTEXITCODE"
            }
          }
          $global:LASTEXITCODE = 0
