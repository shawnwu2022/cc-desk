name: Diagnose ConPTY receiver bytes
on:
  push:
    branches: [codex/fix-devtools-paste]
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - name: Prepare isolated native transport regression
        shell: python
        run: |
          from pathlib import Path
          import shutil
          root = Path('.paste-probe')
          (root / 'src/tests').mkdir(parents=True)
          (root / 'tests/fixtures').mkdir(parents=True)
          shutil.copy('src-tauri/tests/fixtures/devtools-paste-framing.json', root / 'tests/fixtures/devtools-paste-framing.json')
          text = Path('src-tauri/src/tests/paste_framing.rs').read_text(encoding='utf-8')
          text = text.replace("  console.log('PASTE_BYTES:' + bytes.length + ':');", "  console.log('GENERATED_HEX:' + bytes.toString('hex').slice(0, 500) + ':');\n  console.log('PASTE_BYTES:' + bytes.length + ':');")
          text = text.replace('        let expected = payloads.concat();', '        let expected = payloads.concat();\n        println!("GENERATED_RECEIVER: {:?}", output);')
          (root / 'src/tests/paste_framing.rs').write_text(text, encoding='utf-8')
          (root / 'Cargo.toml').write_text('''[package]
          name = "paste-record-probe"
          version = "0.0.0"
          edition = "2021"
          [dependencies]
          portable-pty = "=0.8.1"
          serde = { version = "1", features = ["derive"] }
          serde_json = "1"
          ''', encoding='utf-8')
          (root / 'src/lib.rs').write_text('#![allow(non_snake_case)]\nmod pty;\n#[cfg(test)] mod tests { mod paste_framing; }\n', encoding='utf-8')
          (root / 'src/pty.rs').write_text(r'''
          use std::io::{self, Write};
          pub(crate) fn write_pty_data<W: Write + ?Sized>(writer: &mut W, data: &[u8]) -> io::Result<()> {
              let text = std::str::from_utf8(data).map_err(|e| io::Error::new(io::ErrorKind::InvalidInput, e))?;
              let mut chunk = String::with_capacity(4096);
              for unit in text.encode_utf16() {
                  use std::fmt::Write as _;
                  let record = format!("\x1b[0;0;{unit};1;0;1_");
                  if chunk.len() + record.len() > 4096 {
                      writer.write_all(chunk.as_bytes())?;
                      writer.flush()?;
                      chunk.clear();
                      std::thread::sleep(std::time::Duration::from_millis(1));
                  }
                  write!(&mut chunk, "{record}").unwrap();
              }
              writer.write_all(chunk.as_bytes())?;
              writer.flush()
          }
          ''', encoding='utf-8')
      - name: Capture generated receiver sample (failure expected for current hypothesis)
        working-directory: .paste-probe
        shell: pwsh
        run: |
          cargo test --lib PtyPaste_NativeConsecutive -- --nocapture *> receiver.log
          $result = $LASTEXITCODE
          Get-Content receiver.log -Tail 40
          exit $result
