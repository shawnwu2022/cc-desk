name: Repair and verify Windows paste framing
on:
  push:
    branches: [codex/fix-devtools-paste]
permissions:
  contents: write
concurrency:
  group: repair-devtools-paste
  cancel-in-progress: false
jobs:
  repair:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: npm ci
      - name: Register regression tests before the fix
        shell: python
        run: |
          from pathlib import Path
          p = Path('src-tauri/src/tests/mod.rs')
          text = p.read_text(encoding='utf-8')
          assert 'mod paste_framing;' not in text
          p.write_text(text + '#[cfg(test)]\nmod paste_framing;\n', encoding='utf-8', newline='\n')
      - name: Format regression tests
        working-directory: src-tauri
        run: cargo fmt --all
      - name: Confirm RED through the actual production writer
        working-directory: src-tauri
        shell: pwsh
        run: |
          $output = cargo test --lib PtyPaste_NativeFrames_004 -- --nocapture 2>&1
          $code = $LASTEXITCODE
          $output | Write-Output
          if ($code -eq 0) { throw 'Expected the unpatched production transport to fail' }
          if (($output -join "`n") -notmatch 'paste frame byte length mismatch') {
            throw 'RED failed for a different reason; do not apply a speculative fix'
          }
          $global:LASTEXITCODE = 0
      - name: Repair only framed Windows ConPTY input
        shell: python
        run: |
          from pathlib import Path
          p = Path('src-tauri/src/pty.rs')
          text = p.read_text(encoding='utf-8')
          marker = 'pub(crate) fn write_pty_data<W: Write + ?Sized>('
          assert text.count(marker) == 1
          helper = r'''/// ConPTY parses ordinary CSI input instead of forwarding unknown keys.
          /// In particular it consumes bracketed-paste delimiters for ReadConsoleInputW
          /// clients (including Node raw stdin). Encode literal ESC as a Unicode key
          /// event so the client receives the original ESC, not a consumed CSI sequence.
          /// Only complete paste frames take this path; ordinary keys and responses
          /// retain their existing interpretation. Unix PTYs never use this encoding.
          /// Protocol: microsoft/terminal, doc/specs/#4999 - Improved keyboard handling in Conpty.md.
          #[cfg(windows)]
          fn conpty_paste_input(data: &[u8]) -> std::borrow::Cow<'_, [u8]> {
              if !data.starts_with(b"\x1b[200~") || !data.ends_with(b"\x1b[201~") {
                  return std::borrow::Cow::Borrowed(data);
              }
              let mut wire = Vec::with_capacity(data.len());
              for &byte in data {
                  if byte == 0x1b {
                      // Vk=0, Sc=0, Unicode=ESC, key-down, no modifiers, repeat=1.
                      wire.extend_from_slice(b"\x1b[0;0;27;1;0;1_");
                  } else {
                      wire.push(byte);
                  }
              }
              std::borrow::Cow::Owned(wire)
          }

          '''
          text = text.replace(marker, helper + marker, 1)
          needle = '    let mut chunks = data.chunks(PTY_WRITE_CHUNK_SIZE).peekable();'
          assert text.count(needle) == 1
          text = text.replace(needle, '    #[cfg(windows)]\n    let data = conpty_paste_input(data);\n\n' + needle, 1)
          old = '// Windows ConPTY 对连续突发写入存在截断风险；小块刷新并短暂让出时间，避免大粘贴丢字节。'
          assert text.count(old) == 1
          text = text.replace(old, '// 分块让出写入时间；粘贴帧的可靠性由下方 ConPTY 编码保证，不能靠延时替代起止标记。')
          p.write_text(text, encoding='utf-8', newline='\n')
          p = Path('AGENTS.md')
          text = p.read_text(encoding='utf-8')
          text += '\n### Windows 粘贴帧传输\n\n- 完整 bracketed paste 在 `pty.rs::write_pty_data` 内将 ESC 编码为 ConPTY Unicode 按键事件，避免起止标记被 Windows 吞掉；普通按键、图片粘贴快捷键、Unix 输入不改。\n- `paste_framing` 使用生产 writer、真 ConPTY、Node raw stdin 校验包含标记的 UTF-8 长度与哈希；严禁剥除或容忍标记丢失。前后端共享 `devtools-paste-framing.json` 黄金样本。\n- 传输通过不等于真实 Claude 编辑器已验收；详见 `docs/paste-framing.md`。\n'
          p.write_text(text, encoding='utf-8', newline='\n')
      - name: Format and check Rust
        working-directory: src-tauri
        run: |
          cargo fmt --all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fmt --all --check
      - name: Verify native framing is GREEN
        working-directory: src-tauri
        run: cargo test --lib paste_framing -- --nocapture
      - name: Verify strict Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: Verify all Rust tests
        working-directory: src-tauri
        run: cargo test
      - name: Verify frontend types
        run: npm run typecheck
      - name: Verify all frontend tests
        run: npm run test:ci
      - name: Verify production frontend build
        run: npm run build
      - name: Commit verified source and remove this repair workflow
        shell: pwsh
        run: |
          Remove-Item .github/workflows/probe-paste-framing.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src-tauri/src/pty.rs src-tauri/src/tests/mod.rs src-tauri/src/tests/paste_framing.rs AGENTS.md .github/workflows/probe-paste-framing.yml
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git commit -m 'fix: preserve bracketed paste through Windows ConPTY'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:codex/fix-devtools-paste
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
