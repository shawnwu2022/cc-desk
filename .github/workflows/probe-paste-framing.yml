name: Paste framing probe
on:
  push:
    branches: [codex/fix-devtools-paste]
permissions:
  contents: read
jobs:
  framing:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Generate current production paste and candidate wires
        shell: node {0}
        run: |
          const fs = require('fs');
          const ts = require(process.cwd() + '/node_modules/typescript');
          fs.mkdirSync('.paste-probe/src', {recursive: true});
          const source = fs.readFileSync('src/utils/pasteText.ts', 'utf8');
          const compiled = ts.transpileModule(source, {compilerOptions: {module: ts.ModuleKind.CommonJS, target: ts.ScriptTarget.ES2022}}).outputText;
          fs.writeFileSync('.paste-probe/pasteText.cjs', compiled);
          const {buildPastePayload} = require(process.cwd() + '/.paste-probe/pasteText.cjs');
          const body = 'DEVTOOLS_HEAD\n' + 'Error: request failed 中文🎉\n    at refresh (app.js:42:7)\n'.repeat(200) + 'DEVTOOLS_TAIL';
          const expected = '\x1b[200~' + body + '\x1b[201~';
          const current = buildPastePayload(body, true, false);
          const candidate = current.replace(/\x1b/g, '\x1b[0;0;27;1;0;1_');
          fs.writeFileSync('.paste-probe/cases.json', JSON.stringify([{name:'current_production',wire:current,expected}, {name:'win32_escape_candidate',wire:candidate,expected}]));
      - name: Create isolated native transport probe
        shell: python
        run: |
          from pathlib import Path
          Path('.paste-probe/Cargo.toml').write_text('''[package]
          name = "paste-framing-probe"
          version = "0.0.0"
          edition = "2021"
          [dependencies]
          portable-pty = "=0.8.1"
          serde_json = "1"
          ''', encoding='utf-8')
          Path('.paste-probe/src/main.rs').write_text(r'''
          use portable_pty::{native_pty_system, CommandBuilder, PtySize};
          use std::io::{Read, Write};
          use std::sync::{Arc, Mutex};
          use std::time::{Duration, Instant};
          const SCRIPT: &str = r#"
          process.stdin.setRawMode(true);
          process.stdin.setEncoding('utf8');
          let input = '';
          process.stdin.on('data', chunk => {
            input += chunk;
            const end = input.indexOf('__CC_DESK_FRAME_END__');
            if (end < 0) return;
            const value = input.slice(0, end);
            const b = Buffer.from(value, 'utf8');
            let hash = 2166136261 >>> 0;
            for (const byte of b) { hash ^= byte; hash = Math.imul(hash, 16777619) >>> 0; }
            console.log('FRAME_BYTES:' + b.length + ':');
            console.log('FRAME_HASH:' + hash + ':');
            console.log('FRAME_OPEN:' + Number(value.startsWith('\x1b[200~')) + ':');
            console.log('FRAME_CLOSE:' + Number(value.endsWith('\x1b[201~')) + ':');
            console.log('FRAME_DONE');
            process.exit(0);
          });
          process.stdout.write('\x1b[?2004hFRAME_READY\r\n');
          setTimeout(() => process.exit(2), 45000);
          "#;
          fn hash(bytes: &[u8]) -> u32 {
              bytes.iter().fold(2166136261u32, |h, b| (h ^ u32::from(*b)).wrapping_mul(16777619))
          }
          fn field(output: &str, key: &str) -> Option<u64> {
              let after = output.split_once(key)?.1;
              after.chars().take_while(char::is_ascii_digit).collect::<String>().parse().ok()
          }
          fn wait_for(output: &Arc<Mutex<String>>, marker: &str) {
              let start = Instant::now();
              while start.elapsed() < Duration::from_secs(50) {
                  if output.lock().unwrap().contains(marker) { return; }
                  std::thread::sleep(Duration::from_millis(10));
              }
              panic!("probe timed out waiting for {marker}");
          }
          fn main() {
              let cases: serde_json::Value = serde_json::from_str(&std::fs::read_to_string("cases.json").unwrap()).unwrap();
              let mut failures = 0;
              for case in cases.as_array().unwrap() {
                  let pair = native_pty_system().openpty(PtySize { rows: 30, cols: 180, pixel_width: 0, pixel_height: 0 }).unwrap();
                  let node = std::env::split_paths(&std::env::var_os("PATH").unwrap())
                      .map(|p| p.join("node.exe")).find(|p| p.is_file()).unwrap();
                  let mut cmd = CommandBuilder::new(node);
                  cmd.arg("-e"); cmd.arg(SCRIPT);
                  let mut child = pair.slave.spawn_command(cmd).unwrap();
                  drop(pair.slave);
                  let mut reader = pair.master.try_clone_reader().unwrap();
                  let output = Arc::new(Mutex::new(String::new()));
                  let capture = output.clone();
                  let reader_thread = std::thread::spawn(move || {
                      let mut buf = [0u8; 8192];
                      while let Ok(n) = reader.read(&mut buf) {
                          if n == 0 { break; }
                          capture.lock().unwrap().push_str(&String::from_utf8_lossy(&buf[..n]));
                      }
                  });
                  wait_for(&output, "FRAME_READY");
                  let mut writer = pair.master.take_writer().unwrap();
                  let wire = case["wire"].as_str().unwrap();
                  for chunk in wire.as_bytes().chunks(4096) {
                      writer.write_all(chunk).unwrap(); writer.flush().unwrap();
                      std::thread::sleep(Duration::from_millis(1));
                  }
                  writer.write_all(b"__CC_DESK_FRAME_END__").unwrap(); writer.flush().unwrap();
                  wait_for(&output, "FRAME_DONE");
                  let _ = child.kill(); let _ = child.wait();
                  drop(writer); drop(pair.master); let _ = reader_thread.join();
                  let output = output.lock().unwrap();
                  let expected = case["expected"].as_str().unwrap();
                  let bytes = field(&output, "FRAME_BYTES:");
                  let received_hash = field(&output, "FRAME_HASH:");
                  let open = field(&output, "FRAME_OPEN:");
                  let close = field(&output, "FRAME_CLOSE:");
                  let ok = bytes == Some(expected.len() as u64) && received_hash == Some(hash(expected.as_bytes()) as u64) && open == Some(1) && close == Some(1);
                  println!("CASE={} PASS={} EXPECTED_BYTES={} RECEIVED_BYTES={:?} OPEN={:?} CLOSE={:?} WIN32_REQUEST={}", case["name"], ok, expected.len(), bytes, open, close, output.contains("\x1b[?9001h"));
                  if !ok { failures += 1; }
              }
              assert_eq!(failures, 0, "paste must preserve both delimiters and complete UTF-8 body");
          }
          ''', encoding='utf-8')
      - name: Require intact paste framing and body
        working-directory: .paste-probe
        run: cargo run
