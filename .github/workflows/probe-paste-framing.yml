name: Probe ConPTY internal read boundaries
on:
  push:
    branches: [codex/fix-devtools-paste]
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - name: Isolate the existing native regression from the GUI build
        shell: python
        run: |
          from pathlib import Path
          import shutil
          root = Path('.paste-probe')
          (root / 'src/tests').mkdir(parents=True)
          (root / 'tests/fixtures').mkdir(parents=True)
          shutil.copy('src-tauri/tests/fixtures/devtools-paste-framing.json', root / 'tests/fixtures/devtools-paste-framing.json')
          text = Path('src-tauri/src/tests/paste_framing.rs').read_text(encoding='utf-8')
          marker = '        assert_native_frames("split-escape-sequence", &[payload]);'
          assert text.count(marker) == 1
          text = text.replace(marker, marker + r'''
                  for padding in 4060..4098 {
                      let payload = format!("{OPEN}{}\x1b[31m中文🎉\nTAIL{CLOSE}", "x".repeat(padding));
                      assert_native_frames(&format!("escape-offset-{padding}"), &[payload]);
                  }
                  let payload = format!("{OPEN}{}{CLOSE}", "\x1b[31m色\x1b[0m\n".repeat(400));
                  assert_native_frames("dense-literal-escapes", &[payload]);
          ''')
          (root / 'src/tests/paste_framing.rs').write_text(text, encoding='utf-8')
          (root / 'Cargo.toml').write_text('''[package]
          name = "paste-boundary-probe"
          version = "0.0.0"
          edition = "2021"
          [dependencies]
          portable-pty = "=0.8.1"
          serde = { version = "1", features = ["derive"] }
          serde_json = "1"
          ''', encoding='utf-8')
          (root / 'src/lib.rs').write_text('mod pty;\n#[cfg(test)] mod tests { mod paste_framing; }\n', encoding='utf-8')
          (root / 'src/pty.rs').write_text(r'''
          use std::io::{self, Write};
          pub(crate) fn write_pty_data<W: Write + ?Sized>(writer: &mut W, data: &[u8]) -> io::Result<()> {
              let c1 = std::env::var("PROBE_C1").unwrap() == "1";
              let escape: &[u8] = if c1 { b"\xc2\x9b0;0;27;1;0;1_" } else { b"\x1b[0;0;27;1;0;1_" };
              let mut wire = Vec::new();
              for b in data {
                  if *b == 0x1b { wire.extend_from_slice(escape); } else { wire.push(*b); }
              }
              let size: usize = std::env::var("PROBE_CHUNK").unwrap().parse().unwrap();
              for chunk in wire.chunks(size) {
                  writer.write_all(chunk)?;
                  writer.flush()?;
                  std::thread::sleep(std::time::Duration::from_millis(1));
              }
              Ok(())
          }
          ''', encoding='utf-8')
      - name: Compare ESC and C1 introducers with actual ConPTY
        working-directory: .paste-probe
        shell: pwsh
        run: |
          $env:PROBE_C1 = '0'
          $env:PROBE_CHUNK = '4096'
          cargo test --lib PtyPaste_NativeChunkBoundary_005 -- --nocapture
          Write-Output "ESC_BASELINE_EXIT=$LASTEXITCODE"
          $env:PROBE_C1 = '1'
          foreach ($size in @('4096', '512', '127')) {
            $env:PROBE_CHUNK = $size
            cargo test --lib PtyPaste_Native -- --nocapture
            Write-Output "C1_CHUNK_${size}_EXIT=$LASTEXITCODE"
          }
          $global:LASTEXITCODE = 0
