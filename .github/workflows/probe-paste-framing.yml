name: Probe native ConPTY pipe drainage
on:
  push:
    branches: [codex/fix-devtools-paste]
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - name: Prepare isolated native transport regression
        shell: python
        run: |
          from pathlib import Path
          import shutil
          root = Path('.paste-probe')
          (root / 'src/tests').mkdir(parents=True)
          (root / 'tests/fixtures').mkdir(parents=True)
          shutil.copy('src-tauri/tests/fixtures/devtools-paste-framing.json', root / 'tests/fixtures/devtools-paste-framing.json')
          text = Path('src-tauri/src/tests/paste_framing.rs').read_text(encoding='utf-8')
          marker = '        assert_native_frames("split-escape-sequence", &[payload]);'
          assert text.count(marker) == 1
          text = text.replace(marker, marker + r'''
                  for padding in 4060..4098 {
                      let payload = format!("{OPEN}{}\x1b[31m中文🎉\nTAIL{CLOSE}", "x".repeat(padding));
                      assert_native_frames(&format!("escape-offset-{padding}"), &[payload]);
                  }
                  let payload = format!("{OPEN}{}{CLOSE}", "\x1b[31m色\x1b[0m\n".repeat(400));
                  assert_native_frames("dense-literal-escapes", &[payload]);
          ''')
          (root / 'src/tests/paste_framing.rs').write_text(text, encoding='utf-8')
          (root / 'Cargo.toml').write_text('''[package]
          name = "paste-drain-probe"
          version = "0.0.0"
          edition = "2021"
          [dependencies]
          portable-pty = "=0.8.1"
          filedescriptor = "=0.8.3"
          serde = { version = "1", features = ["derive"] }
          serde_json = "1"
          ''', encoding='utf-8')
          (root / 'src/lib.rs').write_text('#![allow(non_snake_case)]\nmod pty;\n#[cfg(test)] mod tests { mod paste_framing; }\n', encoding='utf-8')
          (root / 'src/pty.rs').write_text(r'''
          use std::io::{self, Write};
          pub(crate) fn write_pty_data<W: Write + ?Sized>(writer: &mut W, data: &[u8]) -> io::Result<()> {
              let limit: usize = std::env::var("PROBE_CHUNK").unwrap().parse().unwrap();
              let mut chunk = Vec::with_capacity(limit);
              writer.flush()?;
              for c in std::str::from_utf8(data).unwrap().chars() {
                  let encoded = if c == '\x1b' { "\x1b[0;0;27;1;0;1_".to_string() } else { c.to_string() };
                  if chunk.len() + encoded.len() > limit {
                      writer.write_all(&chunk)?; writer.flush()?; chunk.clear();
                  }
                  chunk.extend_from_slice(encoded.as_bytes());
              }
              writer.write_all(&chunk)?;
              writer.flush()
          }
          ''', encoding='utf-8')
      - name: Fetch locked descriptor implementation for diagnostic-only patch
        working-directory: .paste-probe
        run: cargo fetch
      - name: Replace no-op descriptor flush in isolated probe only
        working-directory: .paste-probe
        shell: python
        run: |
          from pathlib import Path
          import json, re, shutil, subprocess
          metadata = json.loads(subprocess.check_output(['cargo', 'metadata', '--format-version', '1'], text=True))
          manifest = next(p['manifest_path'] for p in metadata['packages'] if p['name'] == 'filedescriptor')
          shutil.copytree(Path(manifest).parent, Path('vendor/filedescriptor'))
          p = Path('vendor/filedescriptor/src/windows.rs')
          text = p.read_text(encoding='utf-8')
          pattern = r'fn flush\(&mut self\) -> (?:std::)?io::Result<\(\)> \{\s*Ok\(\(\)\)\s*\}'
          assert len(re.findall(pattern, text)) == 1
          replacement = '''fn flush(&mut self) -> std::io::Result<()> {
              #[link(name = "kernel32")]
              extern "system" { fn FlushFileBuffers(handle: *mut std::ffi::c_void) -> i32; }
              // Probe exclusively owns ConPTY input pipes. Do not commit this global descriptor patch.
              if unsafe { FlushFileBuffers(self.as_raw_handle()) } == 0 {
                  return Err(std::io::Error::last_os_error());
              }
              Ok(())
          }'''
          text = re.sub(pattern, lambda _: replacement, text)
          p.write_text(text, encoding='utf-8')
          p = Path('Cargo.toml')
          p.write_text(p.read_text(encoding='utf-8') + '\n[patch.crates-io]\nfiledescriptor = { path = "vendor/filedescriptor" }\n', encoding='utf-8')
      - name: Require intact frames and payload with actual pipe flush
        working-directory: .paste-probe
        shell: pwsh
        run: |
          foreach ($size in @('512', '4096')) {
            $env:PROBE_CHUNK = $size
            cargo test --lib PtyPaste_Native -- --nocapture
            Write-Output "DRAIN_CHUNK_${size}_EXIT=$LASTEXITCODE"
          }
          $global:LASTEXITCODE = 0
