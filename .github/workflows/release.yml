# Promote a single signed platform set only from the exact protected main source.
name: Release

on:
  push:
    branches:
      - main
    paths:
      - package.json
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  preflight:
    if: github.ref == 'refs/heads/main' && github.ref_protected
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.gate.outputs.version }}
      tag: ${{ steps.gate.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run release recovery fixtures
        run: node --test tests/scripts/releaseRecovery.node.cjs tests/scripts/nativeReleasePolicy.node.mjs tests/scripts/releaseCoverage.node.mjs
      - name: Resolve coverage from current protected main required CI
        id: coverage
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release-preflight.mjs --resolve-coverage
      - name: Download exact CI coverage artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.coverage.outputs.coverage_artifact_id }}
          run-id: ${{ steps.coverage.outputs.ci_run }}
          github-token: ${{ github.token }}
          path: coverage
          merge-multiple: true
      - name: Require protected main, successful required CI and disclosed coverage
        id: gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/release-preflight.mjs --coverage coverage/windows-native-coverage.json \
            --ci-run "${{ steps.coverage.outputs.ci_run }}" --ci-attempt "${{ steps.coverage.outputs.ci_attempt }}" \
            --coverage-artifact-id "${{ steps.coverage.outputs.coverage_artifact_id }}" \
            --coverage-artifact-name "${{ steps.coverage.outputs.coverage_artifact_name }}"

  build:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            name: macos
            patterns: |
              src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
              src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz
              src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
          - platform: ubuntu-22.04
            target: ''
            name: linux
            patterns: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/appimage/*.AppImage.sig
          - platform: windows-2022
            target: ''
            name: windows
            patterns: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/nsis/*.exe.sig

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: ${{ matrix.target }}

      - name: Setup MSVC developer command prompt
        if: matrix.platform == 'windows-2022'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure Rust linker
        if: matrix.platform == 'windows-2022'
        shell: bash
        run: |
          LINK_PATH=$(powershell.exe -Command "Get-Command link -CommandType Application | Where-Object { \$_.Source -notlike '*Git*' } | Select-Object -First 1 -ExpandProperty Source")
          if [ -z "$LINK_PATH" ]; then
            echo "::error::MSVC link.exe not found"
            exit 1
          fi
          LINK_PATH_TOML=$(echo "$LINK_PATH" | sed 's|\\|\\\\|g')
          mkdir -p src-tauri/.cargo
          printf '[target.x86_64-pc-windows-msvc]\nlinker = "%s"\n' "$LINK_PATH_TOML" > src-tauri/.cargo/config.toml

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify updater signing secrets
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ] || [ -z "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]; then
            echo "::error::Missing CC Desk updater signing secrets"
            exit 1
          fi

      - name: Build signed candidate
        shell: bash
        env:
          CC_DESK_BUILD_SHA: ${{ github.sha }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            npm run tauri build -- --target "${{ matrix.target }}"
          else
            npm run tauri build
          fi

      - name: Upload candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cc-desk-candidate-${{ github.sha }}-${{ matrix.name }}
          path: ${{ matrix.patterns }}
          if-no-files-found: error

  release:
    needs: [preflight, build]
    if: github.ref == 'refs/heads/main' && github.ref_protected
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve latest exact CI coverage before promotion
        id: coverage
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release-preflight.mjs --resolve-coverage
      - name: Download exact CI coverage artifact for publication
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.coverage.outputs.coverage_artifact_id }}
          run-id: ${{ steps.coverage.outputs.ci_run }}
          github-token: ${{ github.token }}
          path: coverage
          merge-multiple: true
      - name: Recheck main, required CI, coverage and same-run platform artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/release-preflight.mjs --artifacts --coverage coverage/windows-native-coverage.json \
            --ci-run "${{ steps.coverage.outputs.ci_run }}" --ci-attempt "${{ steps.coverage.outputs.ci_attempt }}" \
            --coverage-artifact-id "${{ steps.coverage.outputs.coverage_artifact_id }}" \
            --coverage-artifact-name "${{ steps.coverage.outputs.coverage_artifact_name }}"
      - name: Download this run's three platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: cc-desk-candidate-${{ github.sha }}-*
          path: artifacts
          merge-multiple: false
      - name: Generate updater manifest and verify all three actual signatures
        run: node scripts/generate-updater-manifest.js artifacts latest.json "${{ needs.preflight.outputs.tag }}"
      - name: Recheck source immediately before publishing
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/release-preflight.mjs --artifacts --coverage coverage/windows-native-coverage.json \
            --ci-run "${{ steps.coverage.outputs.ci_run }}" --ci-attempt "${{ steps.coverage.outputs.ci_attempt }}" \
            --coverage-artifact-id "${{ steps.coverage.outputs.coverage_artifact_id }}" \
            --coverage-artifact-name "${{ steps.coverage.outputs.coverage_artifact_name }}" \
            --notes release-validation-notes.md
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: CC Desk ${{ needs.preflight.outputs.version }}
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          body_path: release-validation-notes.md
          fail_on_unmatched_files: true
          files: |
            artifacts/**/*.exe
            artifacts/**/*.exe.sig
            artifacts/**/*.dmg
            artifacts/**/*.app.tar.gz
            artifacts/**/*.app.tar.gz.sig
            artifacts/**/*.AppImage
            artifacts/**/*.AppImage.sig
            latest.json
            coverage/windows-native-coverage.json
      - name: Verify published update channel bytes and signatures
        run: node scripts/verify-updater-manifest.js "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/latest.json" "${{ needs.preflight.outputs.version }}"
