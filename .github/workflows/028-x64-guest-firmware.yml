# Local review only; two private passive screen samples. No global installation.
name: Windows evaluation media first-screen observer
on:
  push:
    branches: [verify/028-x64-guest-firmware-20261121]
    paths: [.github/workflows/028-x64-guest-firmware.yml]
permissions: {}
jobs:
  firmware:
    if: github.repository == 'shawnwu2022/cc-desk' && github.ref == 'refs/heads/verify/028-x64-guest-firmware-20261121' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - name: Evaluate bounded boot path without user interaction
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          stage=runner_admission
          fail() { printf '%s\n' 'BOOT_PATH_PASS=false' "BOOT_PATH_STOP_STAGE=$stage"; exit 1; }
          [ "${RUNNER_ENVIRONMENT:-}" = github-hosted ] || fail
          [ "$(/usr/bin/uname -m)" = x86_64 ] || fail
          [ "$(/usr/bin/lsb_release -sc)" = noble ] || fail
          pinned='2d175924c8e647969a82e36f931b22397108bd94a030e0e947b7e66e47e0be9a'
          [[ $pinned =~ ^[0-9a-f]{64}$ ]] || fail
          for var in HTTPS_PROXY HTTP_PROXY ALL_PROXY https_proxy http_proxy all_proxy; do
            [ -z "${!var:-}" ] || fail
          done
          umask 077
          work=$(/usr/bin/mktemp -d /tmp/ccdesk-firmware-XXXXXXXX) || fail
          trap '/usr/bin/rm -f -- "$work"/{official.vhdx,overlay.qcow2,OVMF_VARS_4M.fd,qmp.sock,frame-a.ppm,frame-b.ppm}' EXIT
          disk=$(/usr/bin/df -Pk -- "$work" | /usr/bin/awk 'NR==2 {print $4}') || fail
          [[ $disk =~ ^[0-9]+$ ]] && (( disk >= 24 * 1024 * 1024 )) || fail
          uid=$(/usr/bin/id -u) || fail
          gid=$(/usr/bin/id -g) || fail
          kvm_record=$(/usr/bin/getent group kvm) || fail
          IFS=: read -r group _ kvm _ <<<"$kvm_record"
          [[ $uid =~ ^[1-9][0-9]*$ && $gid =~ ^[1-9][0-9]*$ && $kvm =~ ^[1-9][0-9]*$ ]] || fail
          [ "$group" = kvm ] && [ "$kvm" != "$gid" ] && [ -c /dev/kvm ] && [ ! -L /dev/kvm ] || fail
          read -r dg mode major minor <<<"$(/usr/bin/stat -c '%g %a %t %T' -- /dev/kvm)"
          [[ $dg = "$kvm" && $mode =~ ^[0-7]{3}$ && $major = a && $minor = e8 ]] || fail
          (( (8#$mode & 060) == 060 )) || fail
          # Unprivileged private Apt state and authenticated download only.
          # Snapshot dpkg status for dependency resolution: never alter dpkg,
          # invoke maintainer scripts/udev hooks or add host system settings.
          ar="$work/apt"
          rt="$work/runtime"
          /usr/bin/mkdir -p -- "$ar"/{empty,lists/partial,archives/partial,preferences.d} "$rt" || fail
          /usr/bin/cp -- /var/lib/dpkg/status "$ar/status" || fail
          [ -f /usr/share/keyrings/ubuntu-archive-keyring.gpg ] || fail
          [ "$(/usr/bin/stat -c '%u' -- /usr/share/keyrings/ubuntu-archive-keyring.gpg)" = 0 ] || fail
          cat > "$ar/ubuntu.sources" <<'APT'
          Types: deb
          URIs: https://archive.ubuntu.com/ubuntu
          Suites: noble noble-updates
          Components: main universe
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

          Types: deb
          URIs: https://security.ubuntu.com/ubuntu
          Suites: noble-security
          Components: main universe
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          APT
          cat > "$ar/config" <<APT
          Dir::Etc::main "/dev/null";
          Dir::Etc::parts "$ar/empty";
          Dir::Etc::sourcelist "$ar/ubuntu.sources";
          Dir::Etc::sourceparts "$ar/empty";
          Dir::Etc::preferences "$ar/empty/preferences";
          Dir::Etc::preferencesparts "$ar/preferences.d";
          Dir::Etc::netrc "/dev/null";
          Dir::Etc::netrcparts "$ar/empty";
          Dir::State "$ar";
          Dir::State::status "$ar/status";
          Dir::State::lists "$ar/lists";
          Dir::Cache "$ar";
          Dir::Cache::archives "$ar/archives";
          Dir::Cache::pkgcache "";
          Dir::Cache::srcpkgcache "";
          Acquire::Languages "none";
          Acquire::Retries "0";
          Acquire::https::AllowRedirect "false";
          Acquire::AllowInsecureRepositories "false";
          APT::Get::AllowUnauthenticated "false";
          Debug::NoLocking "true";
          APT
          # Use only the private config from process start; no inherited Apt
          # settings or host hooks. This never runs with sudo/root.
          apt_do() {
            /usr/bin/timeout -k 2s 160s /usr/bin/env -i PATH=/usr/bin:/bin HOME="$work" \
              APT_CONFIG="$ar/config" "$@"
          }
          stage=apt_index
          apt_do /usr/bin/apt-get update >/dev/null 2>&1 || fail
          stage=apt_download
          packages=(qemu-system-x86 qemu-system-common qemu-system-data qemu-utils ovmf seabios tesseract-ocr tesseract-ocr-eng)
          apt_do /usr/bin/apt-get --yes --no-remove --reinstall --no-install-recommends \
            --download-only install "${packages[@]}" >/dev/null 2>&1 || fail
          declare -A authenticated=()
          have=0
          stage=apt_extraction
          for deb in "$ar"/archives/*.deb; do
            [ -f "$deb" ] && [ ! -L "$deb" ] || fail
            pkg=$(/usr/bin/dpkg-deb -f "$deb" Package) || fail
            ver=$(/usr/bin/dpkg-deb -f "$deb" Version) || fail
            architecture=$(/usr/bin/dpkg-deb -f "$deb" Architecture) || fail
            [[ $pkg =~ ^[a-z0-9][a-z0-9+.-]+$ && $ver =~ ^[a-zA-Z0-9:.+~_-]+$ &&
               ($architecture = amd64 || $architecture = all) && -z "${authenticated[$pkg]:-}" ]] || fail
            expected=$(/usr/bin/sha256sum -- "$deb") || fail
            # apt already authenticates acquired packages; independently tie
            # each actual archive to SHA256 from an authenticated index.
            apt_do /usr/bin/apt-cache show "$pkg=$ver" 2>/dev/null | /usr/bin/awk \
              -v hash="${expected%% *}" '$1=="SHA256:" && $2==hash {ok=1} END {exit !ok}' || fail
            /usr/bin/dpkg-deb -x -- "$deb" "$rt" >/dev/null 2>&1 || fail
            authenticated[$pkg]=1
            (( have+=1 ))
            (( have<=100 )) || fail
          done
          for pkg in "${packages[@]}"; do [ "${authenticated[$pkg]:-}" = 1 ] || fail; done
          stage=runtime_abi
          qemu="$rt/usr/bin/qemu-system-x86_64"
          qimg="$rt/usr/bin/qemu-img"
          ocr="$rt/usr/bin/tesseract"
          tessdata="$rt/usr/share/tesseract-ocr/5/tessdata"
          qdata="$rt/usr/share/qemu"
          ovmf="$rt/usr/share/OVMF"
          vgarom="$rt/usr/share/seabios/vgabios-stdvga.bin"
          lib="$rt/usr/lib/x86_64-linux-gnu:$rt/lib/x86_64-linux-gnu"
          for path in "$qemu" "$qimg" "$ocr" "$tessdata/eng.traineddata" "$qdata" "$ovmf" "$ovmf/OVMF_CODE_4M.fd" "$ovmf/OVMF_VARS_4M.fd"; do
            [ -e "$path" ] && [[ "$(/usr/bin/realpath -e -- "$path")" == "$rt/"* ]] || fail
          done
          [ -x "$qemu" ] && [ -x "$qimg" ] && [ -x "$ocr" ] && [ -s "$tessdata/eng.traineddata" ] || fail
          stage=vga_rom_input
          [ -f "$vgarom" ] && [ -s "$vgarom" ] &&
            [[ "$(/usr/bin/realpath -e -- "$vgarom")" == "$rt/usr/share/seabios/"* ]] || fail
          stage=ovmf_split_input
          code_size=$(/usr/bin/stat -Lc '%s' -- "$ovmf/OVMF_CODE_4M.fd") || fail
          vars_size=$(/usr/bin/stat -Lc '%s' -- "$ovmf/OVMF_VARS_4M.fd") || fail
          [[ $code_size =~ ^[1-9][0-9]{0,7}$ && $vars_size =~ ^[1-9][0-9]{0,7}$ ]] || fail
          (( code_size % 4096 == 0 && vars_size % 4096 == 0 &&
             code_size + vars_size == 4 * 1024 * 1024 )) || fail
          printf '%s\n' 'PRIVATE_SEABIOS_ROM_PRESENT=true' 'OVMF_SPLIT_4M_ALIGNED=true'
          stage=package_elf_paths
          # Private direct ELF resolution; no credential or ambient loader env.
          # Same-distro OS already installed libs may be used only from protected
          # system library paths. Actual module/firmware lookup must still pass.
          for exe in "$qemu" "$qimg" "$ocr"; do
            /usr/bin/env -i /lib64/ld-linux-x86-64.so.2 --library-path "$lib" --list "$exe" 2>/dev/null |
              /usr/bin/python3 -I -S -c 'import os,sys; from pathlib import Path; root=Path(sys.argv[1]); system=Path("/usr/lib/x86_64-linux-gnu"); lines=[l.strip() for l in sys.stdin if l.strip()]; assert lines; paths=[]; exec("for line in lines:\n if line.startswith(\"linux-vdso\"): continue\n assert \"not found\" not in line\n value=line.split(\" => \",1)[-1].split()[0]\n p=Path(value).resolve(strict=True)\n assert p.is_file()\n assert p.is_relative_to(root) or (p.is_relative_to(system) and p.stat().st_uid==0 and not p.stat().st_mode & 0o022)\n paths.append(p)"); assert paths' "$rt" >/dev/null 2>&1 || fail
          done
          printf '%s\n' 'SIGNED_PACKAGE_STAGE_COMPLETE=true'
          qemu_env=(/usr/bin/env -i "HOME=$work" "LD_LIBRARY_PATH=$lib" "QEMU_MODULE_DIR=$rt/usr/lib/x86_64-linux-gnu/qemu")
          cd -- "$work"
          disk=$(/usr/bin/df -Pk -- "$work" | /usr/bin/awk 'NR==2 {print $4}') || fail
          [[ $disk =~ ^[0-9]+$ ]] && (( disk >= 24 * 1024 * 1024 )) || fail
          length=11686379520
          url='https://software-static.download.prss.microsoft.com/dbazure/888969d5-f34g-4e03-ac9d-1f9786c66749/26100.1742.amd64fre.ge_release_svc_refresh.240906-0331_server_serverdatacentereval_en-us.vhdx'
          stage=image_download
          # Exactly one fresh bounded transfer; no automatic or Range retries.
          if status=$(/usr/bin/curl -q --proto '=https' --tlsv1.2 --silent --fail --connect-timeout 15 \
            --max-time 850 --max-filesize "$length" --output official.vhdx --write-out '%{http_code}' -- "$url" 2>/dev/null); then
            curl_rc=0
          else
            curl_rc=$?
          fi
          media_result() {
            case "$1" in
              0) code=ok ;; 6) code=dns ;; 7) code=connect ;; 18) code=partial ;;
              22) code=http_error ;; 23) code=local_write ;; 28) code=deadline ;;
              35) code=tls_handshake ;; 51|60) code=tls_verification ;;
              56) code=receive ;; 63) code=size_cap ;; *) code=other ;;
            esac
            case "$2" in
              000|200|206|301|302|303|307|308|400|401|403|404|408|416|425|429|500|502|503|504) http=$2 ;;
              *) http=other ;;
            esac
            size=unavailable
            if [[ $3 =~ ^[0-9]{1,12}$ ]] && [[ $4 =~ ^[0-9]{1,12}$ ]]; then
              if (( 10#$3 == 10#$4 )); then size=match
              elif (( 10#$3 < 10#$4 )); then size=short
              else size=over; fi
            fi
            printf '%s\n' "OFFICIAL_GET_CURL=$code" "OFFICIAL_GET_HTTP=$http" "OFFICIAL_GET_LENGTH=$size"
          }
          bytes=''
          if [ -f official.vhdx ] && [ ! -L official.vhdx ]; then
            bytes=$(/usr/bin/stat -c '%s' -- official.vhdx 2>/dev/null) || bytes=''
          fi
          media_result "$curl_rc" "$status" "$bytes" "$length"
          [ "$curl_rc" -eq 0 ] && [ "$status" = 200 ] && [ "$bytes" = "$length" ] || fail
          stage=image_digest
          /usr/bin/chmod 0400 official.vhdx || fail
          /usr/bin/printf '%s  official.vhdx\n' "$pinned" | /usr/bin/timeout -k 2s 95s /usr/bin/sha256sum -c --status || fail
          # Stage 1's exact digest already attests independent HasParent and
          # Parent Locator absence. The official emulator must agree.
          stage=image_and_overlay
          guest_size=$("${qemu_env[@]}" "$qimg" info -f vhdx --output=json official.vhdx 2>/dev/null |
             /usr/bin/python3 -I -S -c 'import json,sys;x=json.load(sys.stdin); assert x["format"]=="vhdx" and not any("backing" in k for k in x); n=x["virtual-size"]; assert isinstance(n,int) and 32000000000<=n<=64*1024**4;print(n)' 2>/dev/null) || fail
          "${qemu_env[@]}" "$qimg" create -f qcow2 overlay.qcow2 "$guest_size" >/dev/null 2>&1 || fail
          /usr/bin/cp -- "$ovmf/OVMF_VARS_4M.fd" OVMF_VARS_4M.fd || fail
          # 4 GiB RAM belongs only to this disposable VM; retain host headroom.
          /usr/bin/awk '/^MemAvailable:/ {ok = ($2 >= 5*1024*1024)} END {exit !ok}' /proc/meminfo || fail
          # QEMU is nonroot (including filesystem IDs), with existing KVM GID
          # only in this process. No app/env tweaks, inherited tokens or shares.
          stage=qemu_readiness
          /usr/bin/timeout --signal=TERM --kill-after=3s 138s \
              /usr/bin/python3 -I -S - "$uid" "$gid" "$kvm" "$work" 2>/dev/null <<'PY' || fail
          import errno
          import json
          import os
          import re
          import socket
          import stat
          import struct
          import subprocess
          import sys
          import tempfile
          import threading
          import time
          from pathlib import Path

          class Blocked(RuntimeError):
              pass

          phase="launch"
          def require(ok, code):
              if not ok:
                  raise Blocked(code)

          def startup_reason(data):
              # Externally only these constants; never print the private stderr.
              low=data.lower()
              if b"permission denied" in low or b"operation not permitted" in low:
                  return "permission"
              if b"kvm" in low and (b"failed" in low or b"not available" in low):
                  return "kvm_setup"
              if b"vgabios-stdvga.bin" in low or (b"vga" in low and b"romfile" in low):
                  return "vga_rom"
              if b"combined size of system firmware exceeds" in low or (b"firmware block device" in low and b"invalid size" in low):
                  return "ovmf_split_size"
              if b"pflash" in low or b"ovmf" in low:
                  return "ovmf_pflash"
              if b"vga" in low:
                  return "vga_device"
              if b"ide.0" in low or b"drive" in low or b"blockdev" in low or b"vhdx" in low:
                  return "disk_or_controller"
              if b"pc bios" in low or b"firmware" in low or b"bios" in low:
                  return "other_firmware"
              if b"error while loading shared libraries" in low or b"cannot open shared object file" in low:
                  return "dynamic_library"
              if b"invalid option" in low or b"unsupported" in low or b"parameter" in low:
                  return "option_or_parameter"
              return "early_exit_other"

          def qmp_error_kind(err):
              if not isinstance(err,dict):
                  return "qmp_shape"
              if err.get("class")=="CommandNotFound":
                  return "qmp_unknown_command"
              msg=str(err.get("desc","")).lower()
              if err.get("class") in ("InvalidParameter","InvalidParameterType","InvalidParameterValue") \
                 or ("parameter" in msg and any(k in msg for k in ("invalid","unexpected","missing"))):
                  return "qmp_invalid_arguments"
              return "qmp_command_rejected"

          uid,gid,kvm=map(int,sys.argv[1:4])
          work=Path(sys.argv[4])
          runtime=work/"runtime"
          ovmf=runtime/"usr/share/OVMF"
          rom=runtime/"usr/share/seabios/vgabios-stdvga.bin"
          qemu=runtime/"usr/bin/qemu-system-x86_64"
          tesseract=runtime/"usr/bin/tesseract"
          tessdata=runtime/"usr/share/tesseract-ocr/5/tessdata"
          lib=f"{runtime}/usr/lib/x86_64-linux-gnu:{runtime}/lib/x86_64-linux-gnu"
          modules=runtime/"usr/lib/x86_64-linux-gnu/qemu"
          qmp=work/"qmp.sock"
          def node(**data):
              return json.dumps(data,separators=(",",":"))
          def valid_frame(path):
              # No pixels/dimensions printed, no artifact upload; sample only.
              try:
                  fd=os.open(path,os.O_RDONLY|os.O_NOFOLLOW|os.O_CLOEXEC)
                  with os.fdopen(fd,"rb") as fp:
                      meta=os.fstat(fp.fileno())
                      if not stat.S_ISREG(meta.st_mode) or meta.st_size>7_000_128: return False
                      if fp.readline(32)!=b"P6\n": return False
                      width,height=map(int,fp.readline(32).split())
                      if not (1<=width<=1920 and 1<=height<=1200): return False
                      if fp.readline(32)!=b"255\n": return False
                      pixels=fp.read(7_000_000)
                      if len(pixels)!=width*height*3: return False
                      return pixels!=pixels[:3]*(width*height)
              except (OSError,ValueError):
                  return False


          def score_text(body):
              # OCR is untrusted data. Never render it or pass any of it to a command.
              value=re.sub(r"[^a-z0-9]+"," ",body[:16384].lower())
              value=" "+value+" "
              def anycue(cues):
                  return any(" "+cue+" " in value for cue in cues)
              # A single safety cue blocks automation. Positive classification
              # requires cues in two independent sets, in both separate frames.
              if anycue(("license terms","licence terms","licensing terms","software license","license agreement",
                         "accept the terms","accept license","end user license","eula","privacy statement",
                         "privacy settings","agree to microsoft","accept decline")):
                  return "terms_suspected"
              if anycue(("sign in","signing in","sign in options","password","ctrl alt delete","pin",
                         "security key","microsoft account","verification code","unlock")):
                  return "auth_suspected"
              group_a=("uefi interactive shell","uefi shell","boot manager","no bootable device","boot failed","startup nsh")
              group_b=("uefi qemu harddisk","no mapping found","map table","shell","boot menu",
                       "press esc","uefi cd dvd","firmware setup","start pxe")
              if anycue(group_a) and anycue(group_b):
                  # Avoid counting 'shell' twice inside the first cue.
                  residual=value
                  for cue in group_a: residual=residual.replace(" "+cue+" "," ")
                  if any(" "+cue+" " in residual for cue in group_b): return "firmware_screen"
              group_a=("country or region","country and region","right country","keyboard layout",
                       "input method","choose a language","customize settings","windows setup")
              group_b=("united states","united kingdom","keyboard or input","time and currency","preferred language",
                       "choose your region","language to install","is this your")
              if anycue(group_a) and anycue(group_b):
                  residual=value
                  for cue in group_a: residual=residual.replace(" "+cue+" "," ")
                  if any(" "+cue+" " in residual for cue in group_b): return "windows_setup_prompt"
              return "unknown"

          def combine(a,b):
              if "terms_suspected" in (a,b): return "TERMS_SUSPECTED_STOP"
              if "auth_suspected" in (a,b): return "AUTH_SUSPECTED_STOP"
              if a==b=="firmware_screen": return "FIRMWARE_SCREEN"
              if a==b=="windows_setup_prompt": return "WINDOWS_SETUP_PROMPT"
              return "UNKNOWN_STOP"

          def ocr_local(path):
              if not valid_frame(path): return "unknown"
              argv=["/usr/bin/prlimit","--fsize=65536:65536","--",str(tesseract),
                    str(path),"stdout","--tessdata-dir",str(tessdata),"-l","eng","--psm","11"]
              scrubbed={"HOME":str(work),"LD_LIBRARY_PATH":lib,"TESSDATA_PREFIX":str(tessdata),
                        "OMP_THREAD_LIMIT":"1","LC_ALL":"C"}
              try:
                  with tempfile.TemporaryFile(dir=work) as text:
                      p=subprocess.run(argv,env=scrubbed,cwd=work,stdin=subprocess.DEVNULL,
                                       stdout=text,stderr=subprocess.DEVNULL,timeout=8,check=False)
                      if p.returncode!=0: return "unknown"
                      text.seek(0)
                      return score_text(text.read(16384).decode("utf-8","replace"))
              except (OSError,subprocess.TimeoutExpired):
                  return "unknown"
          def proc_facts(pid):
              p=Path("/proc")/str(pid)
              fields=dict(line.split(":",1) for line in (p/"status").read_text().splitlines() if ":" in line)
              require(fields["Uid"].split()==[str(uid)]*4 and fields["Gid"].split()==[str(gid)]*4,"process_uid_gid")
              require(fields["Groups"].split()==[str(kvm)] and fields["NoNewPrivs"].strip()=="1","process_groups_nnp")
              require(all(int(fields[k].strip(),16)==0 for k in ("CapEff","CapBnd","CapPrm","CapInh","CapAmb")),"process_capabilities")
              fds=set()
              for fd in (p/"fd").iterdir():
                  try: link=os.readlink(fd)
                  except FileNotFoundError: continue
                  if link.startswith("socket:["): fds.add(link[8:-1])
              for kind in ("tcp","tcp6","udp","udp6","raw","raw6"):
                  table=p/"net"/kind
                  if table.exists():
                      for line in table.read_text().splitlines()[1:]:
                          require(line.split()[9] not in fds,"inet_socket_present")

          child=None
          conn=None
          thread=None
          stderr=bytearray()
          outcome="ok"
          frame_a=work/"frame-a.ppm"
          frame_b=work/"frame-b.ppm"
          final_class="UNKNOWN_STOP"
          sample_a=False
          sample_b=False
          try:
              require(stat.S_IMODE(work.stat().st_mode)==0o700 and work.stat().st_uid==uid,"private_directory")
              argv=[
                "/usr/bin/sudo","-n","--","/usr/bin/setpriv",
                f"--reuid={uid}",f"--regid={gid}",f"--groups={kvm}",
                "--inh-caps=-all","--ambient-caps=-all","--bounding-set=-all","--no-new-privs","--reset-env","--",
                "/usr/bin/env","-i",f"HOME={work}",f"LD_LIBRARY_PATH={lib}",f"QEMU_MODULE_DIR={modules}",
                "/usr/bin/timeout","--signal=TERM","--kill-after=2s","103s",
                "/usr/bin/prlimit","--fsize=2147483648:2147483648","--",
                str(qemu),"-L",str(runtime/"usr/share/qemu"),"-no-user-config","-nodefaults","-S",
                "-machine","q35,accel=kvm","-cpu","host","-m","4096","-smp","2",
                "-display","none","-device",f"VGA,romfile={rom}","-nic","none","-monitor","none",
                "-serial","none","-parallel","none","-no-reboot",
                "-qmp",f"unix:{qmp},server=on,wait=off",
                "-drive",f"if=pflash,format=raw,readonly=on,file={ovmf}/OVMF_CODE_4M.fd",
                "-drive","if=pflash,format=raw,file=OVMF_VARS_4M.fd",
                "-blockdev",node(driver="file",filename="official.vhdx",**{"node-name":"source","read-only":True}),
                "-blockdev",node(driver="vhdx",file="source",**{"node-name":"base","read-only":True}),
                "-blockdev",node(driver="file",filename="overlay.qcow2",**{"node-name":"scratch-file"}),
                "-blockdev",node(driver="qcow2",file="scratch-file",backing="base",**{"node-name":"scratch"}),
                "-device","ide-hd,drive=scratch,bus=ide.0"]
              child=subprocess.Popen(argv,cwd=work,stdin=subprocess.DEVNULL,stdout=subprocess.DEVNULL,stderr=subprocess.PIPE)
              def drain():
                  while True:
                      chunk=child.stderr.read(1024)
                      if not chunk: break
                      stderr.extend(chunk[:max(0,8192-len(stderr))])
              thread=threading.Thread(target=drain,daemon=True)
              thread.start()
              phase="private_socket"
              deadline=time.monotonic()+17
              while True:
                  if child.poll() is not None:
                      thread.join(timeout=1)
                      phase="early_launch_exit"
                      raise Blocked(startup_reason(stderr))
                  require(time.monotonic()<deadline,"socket_deadline")
                  if not qmp.exists():
                      time.sleep(.1)
                      continue
                  mode=qmp.lstat()
                  require(stat.S_ISSOCK(mode.st_mode) and mode.st_uid==uid,"socket_type_owner")
                  attempt=socket.socket(socket.AF_UNIX)
                  attempt.settimeout(3)
                  try: attempt.connect(str(qmp))
                  except OSError as e:
                      attempt.close()
                      if e.errno not in (errno.ECONNREFUSED,errno.ENOENT): raise
                      time.sleep(.1)
                      continue
                  conn=attempt
                  break
              phase="peer_credentials"
              pid, peer_uid, peer_gid=struct.unpack("3i",conn.getsockopt(socket.SOL_SOCKET,socket.SO_PEERCRED,12))
              require(pid>1 and peer_uid==uid and peer_gid==gid,"peer_credentials")
              phase="process_facts"
              proc_facts(pid)
              reader=conn.makefile("rb")
              def read():
                  data=reader.readline(262144)
                  require(bool(data) and data.endswith(b"\n"),"qmp_eof_or_oversized")
                  result=json.loads(data)
                  require(isinstance(result,dict),"qmp_shape")
                  return result
              phase="qmp_greeting"
              require("QMP" in read(),"qmp_shape")
              seq=0
              def call(name,args=None):
                  global seq
                  seq+=1
                  command={"execute":name,"id":seq}
                  if args is not None: command["arguments"]=args
                  conn.sendall(json.dumps(command).encode()+b"\n")
                  for _ in range(20):
                      answer=read()
                      if answer.get("id")!=seq: continue
                      if "error" in answer: raise Blocked(qmp_error_kind(answer["error"]))
                      require("return" in answer,"qmp_shape")
                      return answer["return"]
                  raise Blocked("qmp_response_id")

              phase="qmp_capabilities"
              call("qmp_capabilities")
              phase="kvm_state"
              require(call("query-kvm")=={"enabled":True,"present":True},"kvm_not_active")
              phase="prelaunch_state"
              require(call("query-status")["status"]=="prelaunch","unexpected_pause_state")
              def pci_check(pci):
                  def visit(bus):
                      for d in bus["devices"]:
                          require(d["class_info"]["class"]>>8!=2,"guest_nic_present")
                          if "pci_bridge" in d:
                              visit({"devices":d["pci_bridge"].get("devices",[])})
                  require(pci,"pci_missing")
                  for row in pci: visit(row)
                  require(any(d["class_info"]["class"]==0x300 for row in pci for d in row["devices"]),"vga_missing")
              def network_observe():
                  global phase
                  phase="qmp_pci"
                  pci_check(call("query-pci"))
                  phase="qmp_rx_filter"
                  require(call("query-rx-filter")==[],"guest_rx_filter_present")
                  phase="qmp_inventory"
                  require(call("human-monitor-command",{"command-line":"info network"}).strip()=="","guest_network_present")
              network_observe()
              phase="vcpu_counter"
              require(len(call("query-cpus-fast"))==2,"wrong_vcpu_count")
              phase="continue"
              call("cont")
              require(call("query-status")["running"] is True,"not_running")
              def capture(path):
                  require(not path.exists(),"unexpected_frame_path")
                  try:
                      call("screendump",{"filename":str(path),"format":"ppm"})
                  except Blocked as e:
                      if str(e) not in ("qmp_unknown_command","qmp_invalid_arguments","qmp_command_rejected"): raise
                      path.unlink(missing_ok=True)
                      return False
                  return valid_frame(path)
              # Just observe, never even synthesize a key event.
              phase="bounded_observation"
              launched=time.monotonic()
              time.sleep(max(0,launched+48-time.monotonic()))
              require(call("query-status")["running"] is True,"not_running")
              phase="private_frame_a"
              sample_a=capture(frame_a)
              phase="bounded_observation"
              time.sleep(max(0,launched+63-time.monotonic()))
              require(call("query-status")["running"] is True,"not_running")
              phase="private_frame_b"
              sample_b=capture(frame_b)
              phase="stop"
              call("stop")
              require(call("query-status")["running"] is False,"not_stopped")
              phase="process_facts_after"
              proc_facts(pid)
              network_observe()
              phase="close"
              call("quit")
              require(child.wait(timeout=8)==0,"nonzero_exit")
              phase="private_ocr_after_retirement"
              final_class=combine(ocr_local(frame_a) if sample_a else "unknown",
                                  ocr_local(frame_b) if sample_b else "unknown")
              phase="complete"
          except Blocked as e:
              outcome=e.args[0]
          except PermissionError:
              outcome="permission"
          except (TimeoutError,subprocess.TimeoutExpired):
              outcome="deadline"
          except OSError:
              outcome="os_error"
          except (KeyError,IndexError,TypeError,ValueError):
              outcome="shape_or_data"
          finally:
              for image in (frame_a,frame_b): image.unlink(missing_ok=True)
              if conn is not None: conn.close()
              if child is not None and child.poll() is None:
                  child.terminate()
                  try: child.wait(timeout=5)
                  except subprocess.TimeoutExpired:
                      child.kill()
                      try: child.wait(timeout=5)
                      except subprocess.TimeoutExpired:
                          phase="close"
                          outcome="cleanup_deadline"
          print("QEMU_DIAGNOSTIC_PHASE="+phase)
          print("QEMU_DIAGNOSTIC_RESULT="+outcome)
          if outcome=="ok" and phase=="complete":
              print("VALID_PRIVATE_FRAME_PAIR="+("true" if sample_a and sample_b else "false"))
              print("SAFE_SCREEN_CLASS="+final_class)
              print("OBSERVATION_SAMPLE_OFFSETS=48_63")
              sys.exit(0)
          sys.exit(1)
          PY
          stage=image_after_boot
          /usr/bin/printf '%s  official.vhdx\n' "$pinned" | /usr/bin/timeout -k 2s 95s /usr/bin/sha256sum -c --status || fail
          printf '%s\n' 'BOOT_PATH_PASS=true' 'KVM_VCPU_STARTED_AND_STOPPED=true' \
            'VIRTUAL_VGA_REALIZED=true' 'PRIVATE_QMP_NO_GUEST_NIC_SNAPSHOTS=true' \
            'EXACT_IMMUTABLE_MEDIA_RECHECK=true' 'WINDOWS_DESKTOP_VERIFIED=false' \
            'GUEST_INPUT_SENT=false' 'WINDOWS_DESKTOP_CLASSIFIED=false'
