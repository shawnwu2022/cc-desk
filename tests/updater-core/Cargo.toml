[package]
name = "cc-desk-updater-core-tests"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
base64 = "=0.22.1"
sha2 = "=0.10.9"
minisign-verify = "=0.2.5"
semver = "=1.0.28"
url = "=2.5.8"
reqwest = { version = "=0.11.27", features = ["json", "blocking", "stream"] }
tokio = { version = "=1.52.1", features = ["rt", "macros"] }
