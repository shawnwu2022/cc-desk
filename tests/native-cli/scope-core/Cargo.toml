[package]
name = "d12-scope-core"
version = "0.0.0"
edition = "2021"
[dependencies]
cap-std = "=4.0.3"
libc = "=0.2.186"
tempfile = "=3.27.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
toml = "=0.9.12"
[target.'cfg(windows)'.dependencies]
windows = { version = "=0.61.3", features = ["Win32_Storage_FileSystem"] }

[lib]
path = "lib.rs"
