[package]
name = "d17-input-core"
version = "0.0.0"
edition = "2021"
[lib]
path = "lib.rs"
[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
parking_lot = "=0.12.5"
uuid = { version = "=1.23.1", features = ["v4"] }
axum = "=0.7.9"
tokio = { version = "=1.52.1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
once_cell = "=1.21.4"
dirs = "=5.0.1"
log = "=0.4.29"
chrono = "=0.4.44"
tempfile = "=3.27.0"
anyhow = "=1.0.102"
