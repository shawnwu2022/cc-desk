[package]
name = "cc-desk"
version = "0.18.1"
description = "CC Desk - a multi-project, multi-session desktop workspace for Claude Code"
authors = ["shawnwu2022"]
license = "MIT"
repository = "https://github.com/shawnwu2022/cc-desk"
edition = "2021"
rust-version = "1.89" # std File::lock_*（feature file_locks，1.89 稳定）；windows 0.61 亦要求 ≥1.89

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
base64 = "=0.22.1"
minisign-verify = "=0.2.5"
sha2 = "=0.10.9"
cap-std = "=4.0.3"
libc = "=0.2.186"
toml = "=0.9.12"
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
portable-pty = "=0.8.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "parking_lot", "rt-multi-thread"] }
reqwest = { version = "0.11", features = ["json", "blocking", "stream"] }
anyhow = "1"
dirs = "5"
log = "0.4"
uuid = { version = "1", features = ["v4"] }
parking_lot = "0.12"
arc-swap = "1"
chrono = "0.4"
encoding_rs = "0.8"
futures-util = "0.3"
once_cell = "1"
axum = "0.7"
tower = "0.5"
rusqlite = { version = "0.31", features = ["bundled"], optional = true }

[features]
default = ["sqlite"]
sqlite = ["rusqlite"]
history-roundtrip-acceptance = []

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.38"
windows-core = "0.61"
windows = { version = "0.61", features = [
  "Wdk_Foundation", "Wdk_Storage_FileSystem", "Wdk_System_Registry",
  "Win32_Foundation", "Win32_Globalization",
  "Win32_Storage_FileSystem", "Win32_Security", "Win32_Security_Authorization",
  "Win32_System_IO", "Win32_System_Threading", "Win32_System_JobObjects",
  "Win32_System_Registry", "Win32_System_Com", "Win32_System_RemoteDesktop",
  "Win32_System_Ioctl", "Win32_System_SystemServices", "Win32_UI_Shell",
  "Win32_System_Diagnostics_ToolHelp",
] }

[profile.release]
strip = true
lto = true
