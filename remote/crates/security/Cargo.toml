[package]
name = "cc-desk-remote-security"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []
experimental = ["dep:coset"]

[dependencies]
tokio = { version = "=1.52.1", features = ["io-util", "sync", "time", "net", "rt-multi-thread", "macros"] }
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring"] }
rustls = { version = "=0.23.46", default-features = false, features = ["std", "ring"] }
ring = "=0.17.14"
coset = { version = "=0.4.2", optional = true }
cc-desk-remote-record = { path = "../../../protocol/remote/inner/v1" }

[dev-dependencies]
tokio = { version = "=1.52.1", features = ["test-util"] }
base64 = "=0.22.1"
serde_json = "=1.0.150"
cc-desk-remote-transport = { path = "../transport" }
cc-desk-remote-protocol = { path = "../../../protocol/remote/v1" }
tokio-tungstenite = { version = "=0.29.0", default-features = false, features = ["handshake"] }
futures-util = { version = "=0.3.32", features = ["sink"] }

[[test]]
name = "rpk"
required-features = ["experimental"]

[[test]]
name = "binding"
required-features = ["experimental"]
