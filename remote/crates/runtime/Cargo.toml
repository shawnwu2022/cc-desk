[package]
name = "cc-desk-native-runtime"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false

[features]
default = []
conpty-qualification = ["dep:portable-pty", "dep:serde", "dep:serde_json"]

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.61.3", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Pipes", "Win32_System_Console"] }
portable-pty = { path = "../../vendor/portable-pty", optional = true }
serde = { version = "=1.0.229", features = ["derive"], optional = true }
serde_json = { version = "=1.0.150", optional = true }

[dev-dependencies]
tempfile = "=3.27.0"

[build-dependencies]
serde_json = "=1.0.150"

[[bin]]
name = "conpty-qualification-worker"
test = false
required-features = ["conpty-qualification"]

[[test]]
name = "conpty_qualification"
required-features = ["conpty-qualification"]

[[test]]
name = "conpty_lifecycle"
required-features = ["conpty-qualification"]

[[bin]]
name = "native-pipe-fixture"
test = false
required-features = ["conpty-qualification"]

[[bin]]
name = "native-pipe-qualification-worker"
test = false
required-features = ["conpty-qualification"]

[[test]]
name = "native_pipe"
required-features = ["conpty-qualification"]

[[test]]
name = "native_pty"
required-features = ["conpty-qualification"]
