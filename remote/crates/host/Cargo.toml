[package]
name = "cc-desk-remote-host"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
ring = "=0.17.14"
subtle = "=2.6.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.61.3", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "=3.27.0"
