[package]
name = "cc-desk-remote-host"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = []
experimental-local-writer = ["dep:cc-desk-remote-terminal"]
experimental-canonical-replies = ["experimental-local-writer", "cc-desk-remote-terminal/experimental-emulator", "dep:cc-desk-remote-record"]
experimental-host-owner = ["experimental-canonical-replies"]

[dependencies]
cc-desk-remote-record = { path = "../../../protocol/remote/inner/v1", optional = true }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
ring = "=0.17.14"
subtle = "=2.6.1"
cc-desk-remote-terminal = { path = "../terminal", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.61.3", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "=3.27.0"
cc-desk-native-runtime = { path = "../runtime", features = ["conpty-qualification"] }

[[bin]]
name = "local-writer-fixture"
test = false
required-features = ["experimental-local-writer"]
