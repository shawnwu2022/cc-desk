[package]
name = "cc-desk-remote-client"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
cc-desk-remote-security = { path = "../security", features = ["experimental"] }
cc-desk-remote-record = { path = "../../../protocol/remote/inner/v1" }
tokio = { version = "=1.52.1", features = ["sync", "time"] }

[dev-dependencies]
tokio = { version = "=1.52.1", features = ["rt-multi-thread", "macros", "io-util"] }
ring = "=0.17.14"
rustls = { version = "=0.23.46", default-features = false, features = ["std", "ring"] }
coset = "=0.4.2"
base64 = "=0.22.1"
serde_json = "=1.0.150"
